<title>MossOS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#191918">
<style>/* MossOS mobile. Layout: one column with bottom tabs on phones; a left sidebar and a
   centred column on iPad and wider. Dark-first, MossOS tokens, Helvetica Neue,
   light numerals. Area colours are the only accent besides moss green. */
:root{
  --bg:#191918;--surface:#212120;--sunk:#2A2A28;--raise:#2F2F2D;
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.15);
  --ink:#EDEDEB;--muted:#A3A39E;--faint:#76766F;
  --accent:#5FCF8E;--accent-ink:#12251A;--accent-tint:rgba(95,207,142,.14);
  --p1:#B9A3FA;--p1-tint:rgba(185,163,250,.14);
  --warn:#E8A33D;--bad:#E2574C;--shadow:rgba(0,0,0,.5);
  --hn:"Helvetica Neue","HelveticaNeue",Helvetica,"Segoe UI",Arial,sans-serif;
  --r:16px;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#FFFFFF;--surface:#F7F7F5;--sunk:#EFEFED;--raise:#FFFFFF;
  --line:rgba(0,0,0,.085);--line2:rgba(0,0,0,.16);
  --ink:#191918;--muted:#66665F;--faint:#8A8A84;
  --accent:#23824B;--accent-ink:#FFFFFF;--accent-tint:rgba(35,130,75,.11);
  --p1:#6A4BC9;--p1-tint:rgba(106,75,201,.1);
  --warn:#9A5B00;--bad:#C2372C;--shadow:rgba(0,0,0,.18);
  color-scheme:light}}
:root[data-theme="light"]{
  --bg:#FFFFFF;--surface:#F7F7F5;--sunk:#EFEFED;--raise:#FFFFFF;
  --line:rgba(0,0,0,.085);--line2:rgba(0,0,0,.16);
  --ink:#191918;--muted:#66665F;--faint:#8A8A84;
  --accent:#23824B;--accent-ink:#FFFFFF;--accent-tint:rgba(35,130,75,.11);
  --p1:#6A4BC9;--p1-tint:rgba(106,75,201,.1);
  --warn:#9A5B00;--bad:#C2372C;--shadow:rgba(0,0,0,.18);
  color-scheme:light}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:400 16px/1.45 var(--hn);letter-spacing:-.005em;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}

/* ── frame ─────────────────────────────────────────────────────────── */
.main{max-width:720px;margin:0 auto;min-height:100vh;
  padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);
  display:flex;align-items:center;gap:8px;min-height:56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top.edge{box-shadow:0 1px 0 var(--line)}
.top h1{margin:0 auto 0 0;font-size:24px;font-weight:500;letter-spacing:-.025em;line-height:1.1;
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top.sub h1{font-size:18px;font-weight:500}
.back{display:grid;place-items:center;width:44px;height:44px;margin-left:-12px;border-radius:12px;color:var(--ink)}
.iconbtn{display:grid;place-items:center;min-width:44px;height:44px;border-radius:12px;color:var(--muted)}
.iconbtn:hover{background:var(--sunk);color:var(--ink)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--faint);white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sync.on i{background:var(--accent)}
.sync.warn i{background:var(--warn)}
.view{display:grid;gap:22px;padding-top:4px;outline:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view>*{min-width:0}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:18px;height:18px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);align-items:end;
  padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.tabs button{display:grid;justify-items:center;gap:3px;padding:6px 0;min-height:50px;color:var(--faint);font-size:10.5px;font-weight:500}
.tabs button.on{color:var(--ink)}
.tabs button.on svg.i{stroke-width:2.2}
.tabs .cap{align-self:center}
.tabs .cap span{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
  box-shadow:0 6px 18px var(--shadow)}
.tabs .cap svg.i{width:26px;height:26px;stroke-width:2.2}
.side{display:none}

@media (min-width:900px){
  .tabs{display:none}
  .side{display:flex;flex-direction:column;gap:2px;position:fixed;top:0;bottom:0;left:0;width:240px;z-index:25;
    padding:calc(22px + env(safe-area-inset-top,0px)) 12px 20px max(12px,env(safe-area-inset-left,0px));
    border-right:1px solid var(--line);background:var(--bg);overflow-y:auto}
  .side .brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:500;letter-spacing:-.02em;padding:0 10px 18px}
  .side .brand svg{width:26px;height:26px;color:var(--accent)}
  .side button{display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px;font-size:15px;color:var(--muted);min-height:44px}
  .side button:hover{background:var(--sunk);color:var(--ink)}
  .side button.on{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
  .side .capbtn{background:var(--accent);color:var(--accent-ink);margin:0 0 14px;justify-content:center;font-weight:600}
  .side .capbtn:hover{background:var(--accent);color:var(--accent-ink);filter:brightness(1.06)}
  .side .grp{font-size:12px;color:var(--faint);padding:16px 10px 4px}
  .main{margin-left:240px;max-width:760px;padding-bottom:48px}
  .app .main{margin-left:max(240px,calc(50% - 380px + 120px))}
  .toast{bottom:28px}
}

/* ── type and common pieces ───────────────────────────────────────── */
h2{margin:0;font-size:17px;font-weight:500;letter-spacing:-.01em;text-wrap:balance}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.sechead .meta{font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums}
.link{color:var(--accent);font-weight:500;font-size:14px;white-space:nowrap;padding:6px 0}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:13px}
.note{font-size:14px;color:var(--muted);line-height:1.5;max-width:60ch;margin:0}
.dateline{font-size:13px;color:var(--faint);letter-spacing:.02em}
.big{font-size:44px;font-weight:300;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card.flat{background:var(--sunk);border-color:transparent}
.empty{padding:18px;border:1px dashed var(--line2);border-radius:var(--r);color:var(--muted);font-size:14px;line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;
  font-weight:500;font-size:15px;background:var(--ink);color:var(--bg);white-space:nowrap}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.soft{background:var(--sunk);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line2)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 13px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btnrow .btn{flex:1 1 auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:99px;border:1px solid var(--line2);
  font-size:14px;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip i{width:8px;height:8px;border-radius:50%;flex:none}
.scrollx{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.scrollx::-webkit-scrollbar{display:none}
.scrollx .chip{flex:none}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.pill{display:inline-flex;align-items:center;font-size:12px;padding:3px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.p1{background:var(--p1);color:var(--bg);font-weight:600}
.pill.p2{background:var(--sunk);color:var(--ink);font-weight:600}
.pill.ex{background:transparent;border:1px dashed var(--line2);color:var(--faint)}
.pill.warn{color:var(--warn)}
.field{display:grid;gap:6px}
.field label,.lbl{font-size:13px;color:var(--muted)}
.input,textarea.input{width:100%;min-height:46px;padding:11px 14px;border-radius:12px;border:1px solid var(--line2);
  background:var(--surface);font-size:16px;line-height:1.4}
textarea.input{resize:vertical;min-height:110px}
.input:focus{outline:none;border-color:var(--accent)}

/* ── rows ─────────────────────────────────────────────────────────── */
.list{display:grid}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);min-height:56px;width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .t{font-size:16px;line-height:1.3;overflow-wrap:anywhere}
.row .s{font-size:13px;color:var(--faint);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row .ic{font-size:18px;width:24px;text-align:center;flex:none}
.row.done .t{color:var(--faint);text-decoration:line-through}
.ck{flex:none;width:44px;height:44px;margin:-10px -8px -10px -10px;display:grid;place-items:center}
.ck span{width:24px;height:24px;border-radius:8px;border:2px solid var(--line2);display:grid;place-items:center}
.ck.on span{background:var(--accent);border-color:var(--accent)}
.ck.on span::after{content:"";width:5px;height:10px;border:solid var(--accent-ink);border-width:0 2.4px 2.4px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chev{color:var(--faint);flex:none}

/* ── today ───────────────────────────────────────────────────────── */
.prio{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:12px 14px;border-radius:14px;
  background:var(--surface);border:1px solid var(--line);text-align:left}
.prio.p1{background:var(--p1-tint);border-color:color-mix(in srgb,var(--p1) 45%,transparent)}
.prio .grow{flex:1;min-width:0}
.prio .t{font-size:16px;line-height:1.3}
.prio .s{font-size:13px;color:var(--faint);display:flex;align-items:center;gap:6px;margin-top:3px}
.prio.done .t{color:var(--faint);text-decoration:line-through}
.prios{display:grid;gap:8px}
.slot{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:14px;border:1px dashed var(--line2);
  color:var(--faint);font-size:14px;width:100%}
.play{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:12px}
.play .k{display:flex;justify-content:space-between;font-size:12.5px;color:var(--faint)}
.play .t{font-size:22px;font-weight:500;letter-spacing:-.02em;line-height:1.2;display:flex;gap:12px;align-items:flex-start}
.play .t span:first-child{font-size:26px;line-height:1}
.play .w{font-size:14.5px;color:var(--muted);line-height:1.45}
.play .acts{display:grid;grid-template-columns:1fr auto;gap:8px}
.areas{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.areas::-webkit-scrollbar{display:none}
.acard{flex:0 0 148px;display:grid;gap:6px;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);
  box-shadow:inset 0 3px 0 var(--c);text-align:left}
.acard .n{font-size:14.5px;font-weight:500;display:flex;align-items:center;gap:7px;min-width:0}
.acard .n span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acard .f{font-size:12.5px;color:var(--muted);line-height:1.35;min-height:2.7em;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.st{font-size:11.5px;padding:2px 8px;border-radius:99px;justify-self:start;white-space:nowrap}
.st-ontrack{background:rgba(127,224,212,.15);color:#7FE0D4}
.st-needsyou{background:rgba(242,207,122,.16);color:#F2CF7A}
.st-blocked{background:rgba(245,163,163,.16);color:#F5A3A3}
.st-paused{background:var(--sunk);color:var(--muted)}
.st-planned{background:rgba(247,176,204,.15);color:#F7B0CC}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .st-ontrack{color:#16756B}
  :root:not([data-theme="dark"]) .st-needsyou{color:#8A6100}
  :root:not([data-theme="dark"]) .st-blocked{color:#B03A3A}
  :root:not([data-theme="dark"]) .st-planned{color:#A83A6A}}
:root[data-theme="light"] .st-ontrack{color:#16756B}
:root[data-theme="light"] .st-needsyou{color:#8A6100}
:root[data-theme="light"] .st-blocked{color:#B03A3A}
:root[data-theme="light"] .st-planned{color:#A83A6A}
.log{display:grid}
.logrow{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px;align-items:baseline}
.logrow:first-child{border-top:0}
.logrow time{width:48px;flex:none;font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.logrow .dot{transform:translateY(-1px)}
.inboxbar{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;background:var(--accent-tint);width:100%;text-align:left}
.inboxbar b{font-weight:500}
.inboxbar .grow{flex:1;min-width:0}

/* ── tasks ───────────────────────────────────────────────────────── */
.grouph{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:6px 0 0}
.grouph .c{color:var(--faint);font-variant-numeric:tabular-nums}
.grouph .ln{flex:1;height:1px;background:var(--line)}
.sweepbar{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;background:var(--sunk);width:100%;text-align:left}
.slip{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface);font-size:14.5px}
.slip .grow{flex:1;min-width:0}
.slip s{color:var(--faint);font-size:12.5px;white-space:nowrap}
.slip b{font-weight:500;font-size:12.5px;white-space:nowrap}
.sweepcard{display:grid;gap:12px;padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.sweepcard .t{font-size:17px}
.dest{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.dest .btn{min-height:48px}

/* ── task detail ─────────────────────────────────────────────────── */
.dhead{display:flex;gap:14px;align-items:flex-start}
.dhead .ic{width:48px;height:48px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:24px;flex:none}
.dhead h2{font-size:22px;line-height:1.25;letter-spacing:-.02em}
.props{display:grid;border-top:1px solid var(--line)}
.prop{display:flex;align-items:center;gap:12px;min-height:50px;border-bottom:1px solid var(--line);font-size:15px;width:100%;text-align:left}
.prop .k{width:96px;flex:none;color:var(--faint);font-size:14px}
.prop .v{flex:1;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.notebox{min-height:90px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:15.5px;line-height:1.55;outline:none;white-space:pre-wrap}
.notebox:focus{border-color:var(--accent)}
.notebox:empty::before{content:attr(data-ph);color:var(--faint)}
.steps .row{min-height:50px}
.addstep{display:flex;gap:8px}
.addstep .input{flex:1;min-width:0}

/* ── capture + sort ──────────────────────────────────────────────── */
.sheetbg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  box-shadow:0 -10px 40px var(--shadow);display:grid;gap:16px}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--line2);justify-self:center;margin-bottom:-4px}
.sheet .shead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet .shead h2{font-size:19px}
@media (min-width:760px){.sheetbg{align-items:center}.sheet{border-radius:22px;padding-bottom:20px}}
.capbox{font-size:19px;line-height:1.4;min-height:120px;border:0;background:transparent;padding:4px 0;resize:none;width:100%;outline:none}
.capbox::placeholder{color:var(--faint)}
.photo{position:relative;width:96px;height:96px;border-radius:12px;overflow:hidden;background:var(--sunk)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo button{position:absolute;right:4px;top:4px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.sugg{display:grid;gap:10px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.sugg .orig{font-size:13px;color:var(--faint);font-style:italic;overflow-wrap:anywhere}
.sugg .t{font-size:17px;font-weight:500;line-height:1.3}
.sugg .meta{display:flex;flex-wrap:wrap;gap:6px}
.sugg .first{font-size:14px;color:var(--muted)}
.sugg.gone{opacity:.45}
.typegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.typegrid .btn{min-height:48px;flex-direction:column;gap:2px;font-size:14px}

/* ── areas page ─────────────────────────────────────────────────── */
.agrid{display:grid;gap:10px}
.abig{display:grid;gap:10px;padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:inset 0 3px 0 var(--c);width:100%;text-align:left}
.abig .h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.abig .h b{font-weight:500;font-size:17px;display:flex;align-items:center;gap:8px}
.abig .kv{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.abig .kv span:first-child{color:var(--faint)}
@media (min-width:600px){.agrid{grid-template-columns:1fr 1fr}}

/* ── more ───────────────────────────────────────────────────────── */
.menu{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 14px}
.menu .row{min-height:54px}
.soon{font-size:12px;color:var(--faint);border:1px solid var(--line2);border-radius:99px;padding:2px 8px;white-space:nowrap}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;
  background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-size:14.5px;font-weight:500;
  box-shadow:0 10px 30px var(--shadow);width:max-content;max-width:calc(100% - 32px);display:flex;gap:14px;align-items:center}
.toast button{color:var(--accent);font-weight:600;padding:4px 0}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .toast button{color:#7FE0A8}}
:root[data-theme="light"] .toast button{color:#7FE0A8}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ── stat tiles, segmented control ─────────────────────────────────── */
.stats4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stats4>div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0;display:grid;gap:4px}

<script>(function(){'use strict';
/* ── 01-util.js ── */
/* Small helpers shared by every view. */
var $ = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
var esc = function (s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
};
var uid = function (p) { return (p || 'x') + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); };

/* Dates are local calendar days written YYYY-MM-DD. */
function ymd(d) {
  d = d || new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function parseYmd(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function addDays(s, n) { var d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); }
function today() { return ymd(); }
function dayDiff(a, b) { return Math.round((parseYmd(b) - parseYmd(a)) / 864e5); }
var DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
var DOWL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function shortDate(s) {
  if (!s) return '';
  var n = dayDiff(today(), s);
  if (n === 0) return 'Today';
  if (n === 1) return 'Tomorrow';
  if (n === -1) return 'Yesterday';
  var d = parseYmd(s);
  if (n > 1 && n < 7) return DOW[d.getDay()];
  return DOW[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()];
}
function clock(ts) {
  var d = new Date(ts);
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

/* ── 02-store.js ── */
/* ═══ STORE ═══════════════════════════════════════════════════════════
   One map per collection. Every change is applied locally first (so the
   page reacts at once), cached in localStorage, then written to the
   viewer's private db subtree: data/users/<id>/m/<collection>/<doc>.
   That subtree is the viewer's own, so the same person on iPhone and iPad
   sees one set of data. Without db (signed out, or a plain browser) the
   app keeps working from the device cache. */
var COLS = ['areas', 'tasks', 'inbox', 'notes', 'log', 'meta', 'habits', 'goals'];
var CACHE_KEY = 'mossos.mobile.v1';

var Store = (function () {
  // out: the outbox. Every local change is listed here (and kept in the
  // device cache) until db confirms it. While listed, the local copy wins
  // over any snapshot, and a fresh launch sends it again. That way an edit
  // made just before iOS suspends the app is never lost.
  var S = {}, subs = [], db = null, base = null, timers = {}, out = {}, seq = 0, loaded = {}, status = 'local';
  COLS.forEach(function (c) { S[c] = {}; });

  function cacheLoad() {
    try {
      var raw = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
      if (raw && raw.v === 1) { COLS.forEach(function (c) { S[c] = raw.d[c] || {}; }); out = raw.o || {}; }
      return !!raw;
    } catch (e) { return false; }
  }
  var cacheT = null;
  function cacheNow() { clearTimeout(cacheT); try { localStorage.setItem(CACHE_KEY, JSON.stringify({ v: 1, d: S, o: out })); } catch (e) {} }
  function cacheSave() { clearTimeout(cacheT); cacheT = setTimeout(cacheNow, 200); }
  function emit() { subs.forEach(function (f) { try { f(); } catch (e) { console.error(e); } }); }

  function remoteWrite(col, id) {
    var key = col + '/' + id;
    out[key] = ++seq + '.' + Date.now();
    if (!db) return; // sent from the outbox once db connects
    if (timers[key]) clearTimeout(timers[key].t);
    var run = function () {
      delete timers[key];
      var mine = out[key], ref = db.doc(base + '/' + key), v = S[col][id];
      var p = v ? ref.set(JSON.parse(JSON.stringify(v))) : ref.delete();
      p.then(function () {
        if (out[key] === mine) { delete out[key]; cacheSave(); } // a newer edit keeps it listed
      }, function (e) {
        if (e && e.code === 'unavailable') setTimeout(function () { if (out[key] === mine) remoteWrite(col, id); }, 800 + Math.random() * 800);
        else if (e && e.code === 'quota_exceeded') { delete out[key]; toast('Storage is full. Delete some old items to keep saving.'); }
        else if (e && (e.code === 'invalid_argument')) { delete out[key]; console.warn('save refused', key, e); }
        else console.warn('save failed', key, e);
      });
    };
    timers[key] = { t: setTimeout(run, 350), run: run };
  }
  /* Hand every waiting write to db now: the app is being hidden or closed. */
  function flush() {
    Object.keys(timers).forEach(function (k) { var x = timers[k]; clearTimeout(x.t); x.run(); });
    cacheNow();
  }
  addEventListener('pagehide', flush);
  document.addEventListener('visibilitychange', function () { if (document.hidden) flush(); });

  return {
    flush: flush,
    init: function () { var had = cacheLoad(); emit(); return had; },
    status: function () { return status; },
    on: function (f) { subs.push(f); },
    all: function (col) { var m = S[col]; return Object.keys(m).map(function (k) { return m[k]; }); },
    get: function (col, id) { return S[col][id] || null; },
    put: function (col, obj, quiet) {
      if (!obj.id) obj.id = uid(col.charAt(0));
      obj.updated = Date.now();
      if (!obj.created) obj.created = obj.updated;
      S[col][obj.id] = obj;
      cacheSave(); remoteWrite(col, obj.id); if (!quiet) emit();
      return obj;
    },
    patch: function (col, id, fields) {
      var o = S[col][id]; if (!o) return null;
      Object.keys(fields).forEach(function (k) { o[k] = fields[k]; });
      return this.put(col, o);
    },
    del: function (col, id) { delete S[col][id]; cacheSave(); remoteWrite(col, id); emit(); },
    loaded: function (col) { return !!loaded[col]; },
    /* Connect to db. Called once at boot; resolves whether sync is live. */
    connect: function (onFirst) {
      if (!window.claude || !window.claude.use) { status = 'local'; emit(); return Promise.resolve(false); }
      status = 'connecting'; emit();
      return Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function (r) {
        var d = r[0], user = r[1];
        if (!d || !user) { status = 'local'; emit(); return false; }
        return Promise.resolve(user.id ? user.id() : null).then(function (id) {
          if (!id) { status = 'local'; emit(); return false; }
          db = d; base = 'data/users/' + id + '/m';
          // Everything still in the outbox (from before db arrived, or from a
          // session that ended before db confirmed it) goes out first.
          Object.keys(out).forEach(function (key) {
            var p = key.split('/'); if (COLS.indexOf(p[0]) > -1 && p[1]) remoteWrite(p[0], p[1]); else delete out[key];
          });
          var waiting = COLS.length, slow = setTimeout(function () { if (status === 'connecting') { status = 'slow'; emit(); } }, 10000);
          COLS.forEach(function (col) {
            db.collection(base + '/' + col).onSnapshot(function (snap) {
              var fresh = {};
              snap.docs.forEach(function (doc) { var v = doc.data(); if (v) fresh[doc.id] = v; });
              // Local changes db hasn't confirmed yet win over what the snapshot says.
              Object.keys(out).forEach(function (key) {
                var p = key.split('/'); if (p[0] !== col) return;
                if (S[col][p[1]]) fresh[p[1]] = S[col][p[1]]; else delete fresh[p[1]];
              });
              S[col] = fresh;
              if (!snap.metadata.fromCache && !loaded[col]) {
                loaded[col] = true;
                if (--waiting === 0) { clearTimeout(slow); status = 'synced'; if (onFirst) onFirst(); }
              }
              cacheSave(); emit();
            }, function (err) {
              status = err && err.code === 'revoked' ? 'local' : 'error'; emit();
            });
          });
          return true;
        });
      }).catch(function () { status = 'local'; emit(); return false; });
    },
    resetLocal: function () {
      COLS.forEach(function (c) { Object.keys(S[c]).forEach(function (id) { delete S[c][id]; remoteWrite(c, id); }); });
      cacheSave(); emit();
    }
  };
})();

/* Activity log: written automatically, read by Today. Keeps the last 300. */
function logEvent(text, area) {
  Store.put('log', { at: Date.now(), day: today(), text: text, area: area || null }, true);
  var all = Store.all('log').sort(function (a, b) { return b.at - a.at; });
  all.slice(300).forEach(function (o) { Store.del('log', o.id); });
}

function seedData() {
  var t = today();

  var tasks = [
    { ic: '🚔', t: 'Next HCPD application step', area: 'hcpd', due: t, prio: 'P1', prioDay: t, est: '30 min', note: 'Check the portal first. One step, not the whole packet.' },

/* ═══ TASK RULES ═════════════════════════════════════════════════════ */
var CAP = { P1: 1, P2: 2 };

function area(id) { return id ? Store.get('areas', id) : null; }
function areaColor(id) { var a = area(id); return a ? a.color : 'var(--faint)'; }
function areasSorted() { return Store.all('areas').sort(function (a, b) { return (a.order || 99) - (b.order || 99); }); }
function doneToday(t) { return t.done && t.doneAt && ymd(new Date(t.doneAt)) === today(); }

/* Which list a task belongs in today. Nothing is ever "overdue": a past
   due date that wasn't done is "slipped" and waits for the sweep. */
function bucket(t) {
  var d = today();
  if (t.done) return doneToday(t) ? 'today' : 'done';
  if (t.drifted) return 'drifted';
  if (!t.due) return 'whenever';
  var n = dayDiff(d, t.due);
  if (n < 0) return 'slipped';
  if (n === 0) return 'today';
  if (n === 1) return 'tomorrow';
  if (n <= 7) return 'week';
  return 'later';
}
var BUCKETS = [['today', 'Today'], ['tomorrow', 'Tomorrow'], ['week', 'This week'], ['later', 'Later'], ['whenever', 'Whenever'], ['drifted', 'Drifted']];

function tasksIn(b, areaFilter) {
  return Store.all('tasks').filter(function (t) {
    return bucket(t) === b && (!areaFilter || t.area === areaFilter);
  }).sort(function (a, b2) {
    if (!!a.done !== !!b2.done) return a.done ? 1 : -1;
    return (a.due || '9').localeCompare(b2.due || '9') || (a.created || 0) - (b2.created || 0);
  });
}
function slipped() { return tasksIn('slipped'); }

/* Priorities: at most 1 P1 and 2 P2 per day. */
function prios() {
  var d = today();
  return Store.all('tasks').filter(function (t) { return t.prio && t.prioDay === d; })
    .sort(function (a, b) { return a.prio.localeCompare(b.prio) || (a.prioAt || 0) - (b.prioAt || 0); });
}
function prioCount(level) { return prios().filter(function (t) { return t.prio === level; }).length; }
function candidates() {
  var d = today();
  return Store.all('tasks').filter(function (t) { return !t.done && t.cand === d && !(t.prio && t.prioDay === d); });
}
function setPrio(id, level) {
  var t = Store.get('tasks', id); if (!t) return;
  Store.patch('tasks', id, { prio: level, prioDay: level ? today() : null, prioAt: Date.now(), cand: null,
    due: level ? today() : t.due, drifted: level ? false : t.drifted });
  if (level) logEvent('Set ' + level + ': ' + t.t, t.area);
}
function swapOut(id) {
  var t = Store.get('tasks', id); if (!t) return;
  Store.patch('tasks', id, { prio: null, prioDay: null, cand: addDays(today(), 1) });
}

function completeTask(id, on) {
  var t = Store.get('tasks', id); if (!t) return;
  var val = on == null ? !t.done : on;
  Store.patch('tasks', id, { done: val, doneAt: val ? Date.now() : null });
  if (val) logEvent('Done: ' + t.t, t.area);
  // A goal's next action, done from the task list, moves the goal on.
  var g = val && t.goal ? Store.get('goals', t.goal) : null;
  if (g && g.taskId === id) Store.patch('goals', g.id, { lastNext: g.next, next: '', taskId: null, touched: today() });
  return val;
}
function moveTask(id, dest) {
  var t = Store.get('tasks', id); if (!t) return;
  var d = today(), was = t.due, f = { drifted: false };
  if (dest === 'today') f.due = d;
  else if (dest === 'tomorrow') f.due = addDays(d, 1);
  else if (dest === 'nextweek') f.due = addDays(d, 7);
  else if (dest === 'whenever') f.due = null;
  else if (dest === 'drifted') { f.due = null; f.drifted = true; }
  else if (/^\d{4}-\d\d-\d\d$/.test(dest)) f.due = dest;
  if (was && was < d) f.slip = { was: was, now: f.due || (f.drifted ? 'drifted' : 'whenever'), at: d };
  Store.patch('tasks', id, f);
  return f;
}
/* "Slipped, rescheduled": tasks moved off a past date in the last week. */
function rescheduled() {
  var d = today();
  return Store.all('tasks').filter(function (t) { return t.slip && !t.done && t.slip.at && dayDiff(t.slip.at, d) <= 7; })
    .sort(function (a, b) { return (b.updated || 0) - (a.updated || 0); });
}

/* Play: one thing at a time. Priorities first, then the rest of today,
   then small "whenever" jobs. Skips last until the end of the day. */
var playSkips = {};
/* Each card: {kind: task|habit|goal, id, ic, t, area, why, est, tag}. */
function playQueue() {
  var d = today(), seen = {}, q = [];
  function addTask(t, why) {
    if (!t || seen[t.id] || t.done) return; seen[t.id] = 1;
    q.push({ kind: 'task', id: t.id, ic: t.ic, t: t.t, area: t.area, why: why, est: t.est, tag: t.prio && t.prioDay === d ? t.prio : '' });
  }
  prios().forEach(function (t) { addTask(t, t.prio === 'P1' ? 'Your one P1 today.' : 'One of your two P2s today.'); });
  habitsDueToday().filter(function (h) { return !mark(h, d); }).forEach(function (h) {
    var s = streak(h);
    q.push({ kind: 'habit', id: h.id, ic: h.ic, t: h.n, area: h.area, why: h.cue || (s ? s + ' in a row. Keep it going.' : 'Today counts.'), est: '', tag: 'Habit' });
  });
  tasksIn('today').forEach(function (t) { addTask(t, t.note ? t.note.split('\n')[0] : 'Due today.'); });
  goalsLive().filter(function (g) { return g.next && !(g.taskId && seen[g.taskId]); }).slice(0, 2).forEach(function (g) {
    q.push({ kind: 'goal', id: g.id, ic: g.ic, t: g.next, area: g.area, why: 'Next action for ' + g.n + '.', est: '', tag: 'Goal' });
  });
  tasksIn('whenever').filter(function (t) { return /^\d+\s*min/.test(t.est || '') && parseInt(t.est, 10) <= 15; })
    .forEach(function (t) { addTask(t, 'Small. ' + t.est + ' and it is gone.'); });
  var skipped = playSkips[d] || {};
  return q.filter(function (x) { return !skipped[x.kind + x.id]; }).concat(q.filter(function (x) { return skipped[x.kind + x.id]; }));
}

/* ═══ SHELL ══════════════════════════════════════════════════════════
   Navigation is a tab plus a stack of pushed pages (task detail, sweep…).
   Views return HTML strings; clicks are handled by one delegated
   listener that dispatches on data-act. */
var nav = { tab: 'today', stack: [] };
var VIEWS = {}, ACTS = {}, TITLES = {};
var TABS = [['today', 'Today', 'today'], ['tasks', 'Tasks', 'tasks'], ['capture', 'Capture', 'plus'], ['money', 'Money', 'money'], ['more', 'More', 'more']];
var SIDE_MORE = [['areas', 'Life areas', 'areas'], ['inbox', 'Inbox', 'inbox'], ['habits', 'Habits', 'habits'], ['goals', 'Goals', 'goals'],
  ['notes', 'Notes', 'notes'], ['journal', 'Journal', 'journal'], ['projects', 'Projects', 'projects'],
  ['calendar', 'Calendar', 'calendar'], ['settings', 'Settings', 'settings']];

function go(tab) { nav.tab = tab; nav.stack = []; render(true); }
function push(view, arg) { nav.stack.push({ view: view, arg: arg }); render(true); }
function pop() { nav.stack.pop(); render(true); }
function current() { return nav.stack.length ? nav.stack[nav.stack.length - 1] : { view: nav.tab, arg: null }; }

function syncBadge() {
  var s = Store.status();
  var map = { synced: ['on', 'Synced'], connecting: ['', 'Connecting…'], slow: ['warn', 'Sync is slow'], error: ['warn', 'Sync stopped'], local: ['', 'This device'] };
  var m = map[s] || map.local;
  return '<span class="sync ' + m[0] + '" title="' + (s === 'local' ? 'Saved on this device only. Open MossOS in the Claude app, signed in, to sync between your phone and iPad.' : m[1]) + '"><i></i>' + m[1] + '</span>';
}

var lastKey = '';
function render(scrollTop, force) {
  var c = current(), v = VIEWS[c.view] || VIEWS.soon;
  var sub = nav.stack.length > 0;
  var title = typeof TITLES[c.view] === 'function' ? TITLES[c.view](c.arg) : (TITLES[c.view] || '');
  $('#top').className = 'top' + (sub ? ' sub' : '');
  $('#top').innerHTML = (sub ? '<button class="back" data-act="back" aria-label="Back">' + icon('back') + '</button>' : '')
    + '<h1>' + esc(title) + '</h1>' + (sub ? '' : syncBadge());
  // Keep focus and caret if the user is typing in this view.
  var ae = document.activeElement, keep = ae && ae.id && $('#view').contains(ae) ? { id: ae.id, s: ae.selectionStart, e: ae.selectionEnd } : null;
  if (keep && (ae.isContentEditable || ae.tagName === 'TEXTAREA' || ae.tagName === 'INPUT') && !scrollTop && !force) {
    // Don't rebuild under someone's fingers; repaint when they leave the field.
    render.stale = true; paintChrome(); return;
  }
  render.stale = false;
  $('#view').innerHTML = v(c.arg);
  if (v.after) v.after(c.arg);
  paintChrome();
  var key = c.view + ':' + (c.arg || '');
  if (scrollTop || key !== lastKey) window.scrollTo(0, 0);
  lastKey = key;
}

    h += '<section><div class="sechead"><h2>Habits today</h2><span class="meta">' + hdone + '/' + hd.length + '</span></div><div class="hchips">'

          + '<span>' + esc(x.ic) + '</span>' + esc(x.n) + (m === 1 ? ' ✓' : '') + '</button>';
      }).join('') + '</div></section>';
  }

  // Areas
  h += '<section><div class="sechead"><h2>Life areas</h2><button class="link" data-act="tab" data-v="areas">All</button></div><div class="areas">'
    + areasSorted().map(function (a) {
      return '<button class="acard" style="--c:' + esc(a.color) + '" data-act="open" data-v="area" data-id="' + a.id + '">'
        + '<span class="n"><span class="dot" style="background:' + esc(a.color) + '"></span><span>' + esc(a.short) + '</span></span>'
        + '<span class="st st-' + a.state.toLowerCase().replace(/\s/g, '') + '">' + esc(a.state) + '</span>'
        + '<span class="f">' + esc(a.focus || '') + '</span></button>';
    }).join('') + '</div></section>';

  // Rescheduled
  var rs = rescheduled().slice(0, 4);
  if (rs.length) h += '<section><div class="sechead"><h2>Slipped, rescheduled</h2><span class="meta">nothing overdue</span></div><div style="display:grid;gap:6px">'
    + rs.map(slipRow).join('') + '</div></section>';

  // Log
  var log = Store.all('log').filter(function (l) { return l.day === t; }).sort(function (a, b) { return b.at - a.at; });
  h += '<section><div class="sechead"><h2>Today\'s log</h2><span class="meta">writes itself</span></div>'
    + (log.length ? '<div class="log">' + log.slice(0, 12).map(function (l) {
      return '<div class="logrow"><time>' + clock(l.at) + '</time>' + areaDot(l.area) + '<span>' + esc(l.text) + '</span></div>';
    }).join('') + '</div>' : '<div class="empty">Nothing yet. Finishing a task, setting a priority or capturing something adds a line here.</div>')
    + '</section>';
  return h;
};

        + '<span class="grow t">' + esc(s.t) + '</span><button class="iconbtn" data-act="delstep" data-id="' + t.id + '" data-i="' + i + '" aria-label="Remove step">' + icon('x', 'sm') + '</button></div>';

  h += '<section><div class="sechead"><h2>Details</h2></div><div class="props">'
    + '<div class="prop"><span class="k">When</span><span class="v">' + whenChips.map(function (c) {
      return '<button class="chip' + (c[2] ? ' on' : '') + '" data-act="when" data-id="' + t.id + '" data-to="' + c[0] + '">' + c[1] + '</button>';

/* ═══ CAPTURE ═══════════════════════════════════════════════════════
   One tap, type or dictate, save. Sorting happens later, by hand or

var ASSETS = null;
function assetsInit() {
  if (!window.claude || !window.claude.use) return;
  window.claude.use('assets').then(function (a) { ASSETS = a; });
}
var capState = { kind: 'inbox', area: null, photo: null };
var CAP_KINDS = [['inbox', 'Inbox', 'Sort later'], ['task', 'Task', 'Due today'], ['note', 'Note', 'Keep it']];

ACTS.capture = function () {
  capState = { kind: 'inbox', area: null, photo: null };
  openSheet(capHtml(), function (s) {
    var ta = $('#captext', s); ta.focus();
    ta.addEventListener('keydown', function (e) { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) ACTS.capsave(); });
    var f = $('#capfile', s); if (f) f.addEventListener('change', capPhoto);
  });
};
function capHtml(text) {
  return '<div class="shead"><h2>Capture</h2><button class="iconbtn" data-act="close" aria-label="Close">' + icon('x') + '</button></div>'
    + '<label class="sr" for="captext">What\'s on your mind</label>'
    + '<textarea id="captext" class="capbox" placeholder="What\'s on your mind? Tap the mic on your keyboard to talk.">' + esc(text || '') + '</textarea>'
    + '<div id="capphoto">' + capPhotoHtml() + '</div>'
    + '<div class="chips" role="group" aria-label="Save as">' + CAP_KINDS.map(function (k) {
      return '<button class="chip' + (capState.kind === k[0] ? ' on' : '') + '" data-act="capkind" data-k="' + k[0] + '">' + k[1] + '</button>';
    }).join('') + '</div>'
    + (capState.kind !== 'inbox' ? '<div class="scrollx" role="group" aria-label="Area">' + areasSorted().map(function (a) {
      return '<button class="chip' + (capState.area === a.id ? ' on' : '') + '" data-act="caparea" data-a="' + a.id + '"><i style="background:' + esc(a.color) + '"></i>' + esc(a.short) + '</button>';
    }).join('') + '</div>' : '<p class="note small">Each line becomes its own item in your inbox.</p>')
    + '<div class="btnrow">'
    + (ASSETS ? '<label class="btn soft" style="flex:0 0 auto" aria-label="Add a photo">' + icon('camera', 'sm') + '<input id="capfile" type="file" accept="image/*" class="sr"></label>' : '')
    + '<button class="btn accent" data-act="capsave">Save</button></div>';
}
function capPhotoHtml() {
  if (!capState.photo) return '';
  if (capState.photo === 'uploading') return '<div class="photo" aria-label="Uploading photo"></div>';
  return '<div class="photo"><img src="' + esc(capState.photo.url) + '" alt="Attached photo"><button data-act="capunphoto" aria-label="Remove photo">' + icon('x', 'sm') + '</button></div>';
}
function capPhoto(e) {
  var file = e.target.files && e.target.files[0]; if (!file || !ASSETS) return;
  capState.photo = 'uploading'; $('#capphoto').innerHTML = capPhotoHtml();
  ASSETS.upload(file).then(function (r) { capState.photo = { id: r.id, url: r.url }; $('#capphoto').innerHTML = capPhotoHtml(); })
    .catch(function () { capState.photo = null; $('#capphoto').innerHTML = ''; toast('The photo didn\'t upload. Try a smaller one.'); });
}
ACTS.capunphoto = function () { capState.photo = null; $('#capphoto').innerHTML = ''; };
function capRedraw() {
  var text = $('#captext').value;
  $('#sheet').innerHTML = '<div class="grab" aria-hidden="true"></div>' + capHtml(text);
  var f = $('#capfile'); if (f) f.addEventListener('change', capPhoto);
  var ta = $('#captext'); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
}
ACTS.capkind = function (d) { capState.kind = d.k; capRedraw(); };
ACTS.caparea = function (d) { capState.area = capState.area === d.a ? null : d.a; capRedraw(); };
ACTS.capsave = function () {
  var text = $('#captext').value.trim(), photo = capState.photo && capState.photo.id ? capState.photo : null;
  if (!text && !photo) { $('#captext').focus(); return; }
  if (capState.photo === 'uploading') { toast('Wait for the photo to finish uploading'); return; }
  var k = capState.kind, n = 0;
  if (k === 'inbox') {
    var lines = text ? text.split(/\n+/).map(function (s) { return s.trim(); }).filter(Boolean) : [''];
    lines.forEach(function (line, i) { Store.put('inbox', { text: line, photo: i === 0 && photo ? photo.id : null }, true); n++; });
    logEvent('Captured ' + (n === 1 ? 'a thought' : n + ' thoughts'));
  } else if (k === 'task') {
    var first = text.split('\n')[0], rest = text.split('\n').slice(1).join('\n').trim();
    Store.put('tasks', { t: first || 'Photo', note: rest, area: capState.area, due: today(), done: false, steps: [], photo: photo ? photo.id : null }, true);
    logEvent('Captured a task: ' + first, capState.area);
  } else {
    var title = text.split('\n')[0];
    Store.put('notes', { title: title.slice(0, 80) || 'Photo', body: text, area: capState.area, photo: photo ? photo.id : null }, true);
    logEvent('Captured a note', capState.area);
  }
  closeSheet();
  toast(k === 'inbox' ? (n === 1 ? 'In your inbox' : n + ' items in your inbox') : k === 'task' ? 'Task added for today' : 'Note saved');
};

/* ═══ INBOX + SORT ══════════════════════════════════════════════════ */
var sortRun = null; // {busy, items:[suggestion], err}
TITLES.inbox = 'Inbox';
VIEWS.inbox = function () {
  var items = Store.all('inbox').sort(function (a, b) { return a.created - b.created; });
  var h = '';
  if (!items.length) { sortRun = null; return '<div class="empty">Inbox zero. Everything you capture lands here until you sort it.</div>'
    + '<button class="btn accent" data-act="capture">' + icon('plus', 'sm') + 'Capture something</button>'; }
  if (sortRun && sortRun.items) return sortView(items);
  h += '<div class="card"><p class="note">Claude reads each item and suggests what it is, which area it belongs to, a day if you mentioned one, and a first step. You confirm each one.</p>'
    + '<div class="btnrow" style="margin-top:12px"><button class="btn accent" data-act="sortai"' + (AI.ready && !(sortRun && sortRun.busy) ? '' : ' disabled') + '>'
    + icon('sparkle', 'sm') + (sortRun && sortRun.busy ? 'Sorting ' + items.length + '…' : 'Sort with Claude') + '</button></div>'
    + (AI.ready ? '' : '<p class="note small" style="margin-top:8px">Claude sorting works when MossOS is open in the Claude app. You can sort by hand below.</p>')
    + (sortRun && sortRun.err ? '<p class="note small" style="margin-top:8px;color:var(--warn)">' + esc(sortRun.err) + '</p>' : '') + '</div>';
  h += '<div class="list">' + items.map(function (it) {
    return '<div class="row" style="align-items:flex-start"><span class="grow"><div class="t">' + esc(it.text || '(photo)') + '</div>'
      + (it.photo ? '<img src="/_blob/' + esc(it.photo) + '" alt="" style="width:80px;height:80px;object-fit:cover;border-radius:10px;margin-top:8px">' : '')
      + '<div class="s">' + esc(timeAgo(it.created)) + ' ' + exPill(it) + '</div>'
      + '<div class="chips" style="margin-top:8px"><button class="chip" data-act="file" data-id="' + it.id + '" data-k="task">→ Task</button>'
      + '<button class="chip" data-act="file" data-id="' + it.id + '" data-k="note">→ Note</button>'
      + '<button class="chip" data-act="file" data-id="' + it.id + '" data-k="drop">Delete</button></div></span></div>';
  }).join('') + '</div>';
  return h;
};
function timeAgo(ts) {
  var m = Math.round((Date.now() - ts) / 6e4);
  if (m < 1) return 'just now'; if (m < 60) return m + ' min ago';
  var h = Math.round(m / 60); if (h < 24) return h + ' h ago';
  return shortDate(ymd(new Date(ts)));
}
ACTS.file = function (d) {
  var it = Store.get('inbox', d.id); if (!it) return;
  applySuggestion(it, { type: d.k, title: it.text, area: null, due: d.k === 'task' ? today() : null });
};
function applySuggestion(it, s) {
  var title = (s.title || it.text || 'Untitled').slice(0, 140);
  if (s.type === 'task') {
    var t = Store.put('tasks', { t: title, ic: s.icon || '', area: s.area || null, due: s.due || null, done: false, note: s.title && s.title !== it.text ? it.text : '',
      steps: s.firstStep ? [{ t: s.firstStep, done: false }] : [], photo: it.photo || null }, true);
    logEvent('Sorted into a task: ' + t.t, t.area);
  } else if (s.type === 'note' || s.type === 'idea') {
    Store.put('notes', { title: title.slice(0, 80), body: it.text, area: s.area || null, kind: s.type, photo: it.photo || null }, true);
    logEvent('Sorted into ' + (s.type === 'idea' ? 'an idea' : 'a note'), s.area);
  }
  Store.del('inbox', it.id);
}
ACTS.sortai = function () {
  var items = Store.all('inbox').sort(function (a, b) { return a.created - b.created; }).slice(0, 25);
  sortRun = { busy: true }; render();
  var t = today(), d = new Date();
  aiJson('You sort quick captures for a personal organizer. Today is ' + DOWL[d.getDay()] + ' ' + t + '.\n'
    + 'Life areas (id: name): ' + areasSorted().map(function (a) { return a.id + ': ' + a.name; }).join('; ') + '.\n'
    + 'For each item decide:\n- type: "task" (something to do), "note" (information to keep), "idea" (a thought to develop later) or "drop" (empty or meaningless)\n'
    + '- title: a short, clear version in the person\'s own voice, under 70 characters\n- area: one area id from the list, or null\n'
    + '- due: YYYY-MM-DD only if the text names or clearly implies a day, else null\n- firstStep: for tasks, one concrete step under 5 minutes, else null\n- icon: one emoji\n'
    + 'Items: ' + JSON.stringify(items.map(function (i) { return { id: i.id, text: i.text || '(photo with no text)' }; })) + '\n'
    + 'Reply with JSON only: {"items":[{"id":"…","type":"task","title":"…","area":null,"due":null,"firstStep":null,"icon":"📝"}]}')
    .then(function (r) {
      var ids = {}; items.forEach(function (i) { ids[i.id] = 1; });
      var areaIds = {}; areasSorted().forEach(function (a) { areaIds[a.id] = 1; });
      var out = (r && r.items || []).filter(function (s) { return s && ids[s.id]; }).map(function (s) {
        return { id: s.id, type: ['task', 'note', 'idea', 'drop'].indexOf(s.type) > -1 ? s.type : 'task',
          title: String(s.title || '').slice(0, 140), area: areaIds[s.area] ? s.area : null,
          due: /^\d{4}-\d\d-\d\d$/.test(s.due || '') ? s.due : null, firstStep: s.firstStep ? String(s.firstStep).slice(0, 120) : null,
          icon: typeof s.icon === 'string' ? s.icon.slice(0, 4) : '' };
      });
      sortRun = out.length ? { items: out } : { err: 'Claude didn\'t return any suggestions. Try again, or sort by hand.' };
      render();
    }).catch(function (e) { sortRun = { err: aiError(e) }; render(); });
};
function sortView(items) {
  var byId = {}; items.forEach(function (i) { byId[i.id] = i; });
  var live = sortRun.items.filter(function (s) { return byId[s.id]; });
  if (!live.length) { sortRun = null; return VIEWS.inbox(); }
  return '<div class="btnrow"><button class="btn accent" data-act="sortacceptall">Accept all ' + live.length + '</button><button class="btn ghost" data-act="sortcancel">Cancel</button></div>'
    + live.map(function (s) {
      var it = byId[s.id];
      return '<div class="sugg"><div class="orig">“' + esc(it.text) + '”</div>'
        + '<div class="t">' + esc(s.icon ? s.icon + ' ' : '') + esc(s.title || it.text) + '</div>'
        + '<div class="meta"><span class="pill">' + { task: 'Task', note: 'Note', idea: 'Idea', drop: 'Delete' }[s.type] + '</span>'
        + (s.area ? '<span class="pill">' + areaDot(s.area) + '&nbsp;' + esc(areaName(s.area)) + '</span>' : '')
        + (s.due ? '<span class="pill">' + esc(shortDate(s.due)) + '</span>' : '') + '</div>'
        + (s.firstStep ? '<div class="first">First step: ' + esc(s.firstStep) + '</div>' : '')
        + '<div class="chips"><button class="chip on" data-act="sortaccept" data-id="' + s.id + '">Accept</button>'
        + ['task', 'note', 'idea', 'drop'].filter(function (k) { return k !== s.type; }).map(function (k) {
          return '<button class="chip" data-act="sorttype" data-id="' + s.id + '" data-k="' + k + '">' + { task: 'Task', note: 'Note', idea: 'Idea', drop: 'Delete' }[k] + ' instead</button>';
        }).join('') + '</div></div>';
    }).join('');
}
function sugg(id) { return sortRun && sortRun.items ? sortRun.items.filter(function (s) { return s.id === id; })[0] : null; }
ACTS.sortaccept = function (d) { var s = sugg(d.id), it = Store.get('inbox', d.id); if (s && it) applySuggestion(it, s); };
ACTS.sorttype = function (d) { var s = sugg(d.id); if (s) { s.type = d.k; render(); } };
ACTS.sortcancel = function () { sortRun = null; render(); };
ACTS.sortacceptall = function () {
  var n = 0;
  sortRun.items.slice().forEach(function (s) { var it = Store.get('inbox', s.id); if (it) { applySuggestion(it, s); n++; } });
  sortRun = null; toast(n + ' sorted'); render();
};

    var next = open.filter(function (t) { return t.due; }).sort(function (x, y) { return x.due.localeCompare(y.due); })[0];
    return '<button class="abig" style="--c:' + esc(a.color) + '" data-act="open" data-v="area" data-id="' + a.id + '">'
      + '<div class="h"><b><span class="dot" style="background:' + esc(a.color) + '"></span>' + esc(a.name) + '</b>'

      + '<div>' + esc(a.focus || 'No focus set') + '</div>'
      + '<div class="kv"><span>Next</span><span>' + esc(next ? next.t + ' · ' + shortDate(next.due) : (a.next || '—')) + '</span></div>'

  ['🧘', 'Sit still for two minutes', '#C39BD3', 'Two. Not twenty.'],

};
ACTS.gdelstep = function (d) { var g = Store.get('goals', d.id), s = (g.steps || []).slice(); s.splice(+d.i, 1); Store.patch('goals', d.id, { steps: s }); };
ACTS.form_gaddstep = function (d, f) {
  var inp = $('input', f), v = inp.value.trim(); if (!v) return;
  var g = Store.get('goals', d.id); inp.value = '';
  touchGoal(d.id, { steps: (g.steps || []).concat([{ t: v, done: false }]) }); render(false, true);
  var n = $('#gnewstep'); if (n) n.focus();
};
ACTS.goalarea = function (d) { var g = Store.get('goals', d.id); Store.patch('goals', d.id, { area: g.area === d.a ? null : d.a }); };
ACTS.goalstatus = function (d) {
  var g = Store.get('goals', d.id); touchGoal(d.id, { status: d.s });
  if (d.s === 'done') { logEvent('Finished a goal: ' + g.n, g.area); toast('Finished. That counts.'); }
};
ACTS.delgoal = function (d) { var g = Store.get('goals', d.id); Store.del('goals', d.id); pop(); toast('Goal deleted', function () { Store.put('goals', g); }); };
ACTS.goaltask = function (d) {
  var g = Store.get('goals', d.id);
  var t = Store.put('tasks', { t: g.next, ic: g.ic || '', area: g.area || null, due: today(), done: false, steps: [], note: 'Next action for: ' + g.n, goal: g.id });
  touchGoal(d.id, { taskId: t.id }); logEvent('Next action on today: ' + g.next, g.area); toast('On today\'s list');
};
/* Finishing a next action asks for the next one. Claude can suggest it. */
ACTS.goalnextdone = function (d) {
  var g = Store.get('goals', d.id), had = !!g.next;
  if (had) {
    logEvent(g.n + ': ' + g.next, g.area);
    var t = g.taskId ? Store.get('tasks', g.taskId) : null; if (t && !t.done) completeTask(t.id, true);
    touchGoal(d.id, { lastNext: g.next, next: '', taskId: null });
  }
  openSheet('<div class="shead"><h2>' + (had ? 'Nice. What\'s next?' : 'Next action') + '</h2><button class="iconbtn" data-act="close" aria-label="Close">' + icon('x') + '</button></div>'
    + '<p class="note">' + esc(g.n) + '. One concrete thing you could start in the next day, not a plan.</p>'
    + '<form class="addstep" data-form="goalnext" data-id="' + d.id + '"><label class="sr" for="gnext">Next action</label><input id="gnext" class="input" autocomplete="off" placeholder="e.g. Email the recruiter"><button class="btn accent" type="submit">Set</button></form>'
    + (AI.ready ? '<button class="btn ghost" data-act="goalsuggest" data-id="' + d.id + '">' + icon('sparkle', 'sm') + 'Suggest one with Claude</button>' : '')
    + '<div id="gsugg"></div>', function (s) { $('#gnext', s).focus(); });
};
ACTS.form_goalnext = function (d, f) {
  var v = $('input', f).value.trim(); if (!v) return;
  touchGoal(d.id, { next: v }); closeSheet(); toast('Next action set');
};
ACTS.goalsuggest = function (d, el) {
  var g = Store.get('goals', d.id); el.disabled = true; el.innerHTML = icon('sparkle', 'sm') + 'Thinking…';
  aiJson('Suggest three possible next actions for this personal goal. Each must be concrete, startable within a day, and take under an hour. '
    + 'Goal: "' + g.n + '". Why: "' + (g.why || '') + '". Steps (done marked): ' + JSON.stringify((g.steps || []).map(function (s) { return (s.done ? '[x] ' : '[ ] ') + s.t; }))
    + '. Last action finished: "' + (g.lastNext || 'none') + '". Reply with JSON only: {"options":["…","…","…"]}, each under 70 characters.')
    .then(function (r) {
      var opts = (r && r.options || []).filter(function (x) { return typeof x === 'string'; }).slice(0, 3);
      el.hidden = true;
      $('#gsugg').innerHTML = '<div class="list">' + opts.map(function (o) {
        return '<button class="row" data-act="goalpick" data-id="' + d.id + '" data-t="' + esc(o) + '"><span class="grow t">' + esc(o) + '</span></button>';
      }).join('') + '</div>';
    }).catch(function (e) { el.disabled = false; el.innerHTML = icon('sparkle', 'sm') + 'Suggest one with Claude'; toast(aiError(e)); });
};
ACTS.goalpick = function (d) { touchGoal(d.id, { next: d.t }); closeSheet(); toast('Next action set'); };
ACTS.newgoal = function () {
  var g = Store.put('goals', { n: 'New goal', ic: '🎯', why: '', steps: [], next: '', area: null, status: 'live', touched: today() });
  push('goal', g.id); setTimeout(function () { var e = $('#gn'); if (e) { e.focus(); e.select(); } }, 50);
};

/* ── 99-boot.js ── */
/* ═══ BOOT ══════════════════════════════════════════════════════════ */
try { var th = localStorage.getItem('mossos.theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
var hadCache = Store.init();
Store.on(function () { render(); });

/* First run: seed when there is truly nothing, after db has answered (or
   straight away when there is no db). Never seed over real data. */
function maybeSeed() {
  if (Store.get('meta', 'setup')) { upgradeSeed(); return; }
  if (Store.all('tasks').length || Store.all('areas').length) { Store.put('meta', { id: 'setup', seeded: Date.now(), examples: false }); return; }
  seedData();
}
Store.connect(maybeSeed).then(function (live) { if (!live) maybeSeed(); });
if (!hadCache && (!window.claude || !window.claude.use)) maybeSeed();
aiInit(); assetsInit();
render(true);

/* A new day while the app stays open: repaint at midnight. */
(function tick() {
  var n = new Date(), next = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1, 0, 0, 5);
  setTimeout(function () { render(); tick(); }, next - n);
})();

})();</script>
