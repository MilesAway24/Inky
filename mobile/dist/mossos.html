<title>MossOS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#191918">
<style>/* MossOS mobile. Layout: one column with bottom tabs on phones; a left sidebar and a
   centred column on iPad and wider. Dark-first, MossOS tokens, Helvetica Neue,
   light numerals. Area colours are the only accent besides moss green. */
:root{
  --bg:#191918;--surface:#212120;--sunk:#2A2A28;--raise:#2F2F2D;
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.15);
  --ink:#EDEDEB;--muted:#A3A39E;--faint:#76766F;
  --accent:#5FCF8E;--accent-ink:#12251A;--accent-tint:rgba(95,207,142,.14);
  --warn:#E8A33D;--bad:#E2574C;--shadow:rgba(0,0,0,.5);
  --hn:"Helvetica Neue","HelveticaNeue",Helvetica,"Segoe UI",Arial,sans-serif;
  --r:16px;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#FFFFFF;--surface:#F7F7F5;--sunk:#EFEFED;--raise:#FFFFFF;
  --line:rgba(0,0,0,.085);--line2:rgba(0,0,0,.16);
  --ink:#191918;--muted:#66665F;--faint:#8A8A84;
  --accent:#23824B;--accent-ink:#FFFFFF;--accent-tint:rgba(35,130,75,.11);
  --warn:#9A5B00;--bad:#C2372C;--shadow:rgba(0,0,0,.18);
  color-scheme:light}}
:root[data-theme="light"]{
  --bg:#FFFFFF;--surface:#F7F7F5;--sunk:#EFEFED;--raise:#FFFFFF;
  --line:rgba(0,0,0,.085);--line2:rgba(0,0,0,.16);
  --ink:#191918;--muted:#66665F;--faint:#8A8A84;
  --accent:#23824B;--accent-ink:#FFFFFF;--accent-tint:rgba(35,130,75,.11);
  --warn:#9A5B00;--bad:#C2372C;--shadow:rgba(0,0,0,.18);
  color-scheme:light}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:400 16px/1.45 var(--hn);letter-spacing:-.005em;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}

/* ── frame ─────────────────────────────────────────────────────────── */
.main{max-width:720px;margin:0 auto;min-height:100vh;
  padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);
  display:flex;align-items:center;gap:8px;min-height:56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top.edge{box-shadow:0 1px 0 var(--line)}
.top h1{margin:0 auto 0 0;font-size:24px;font-weight:500;letter-spacing:-.025em;line-height:1.1;
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top.sub h1{font-size:18px;font-weight:500}
.back{display:grid;place-items:center;width:44px;height:44px;margin-left:-12px;border-radius:12px;color:var(--ink)}
.iconbtn{display:grid;place-items:center;min-width:44px;height:44px;border-radius:12px;color:var(--muted)}
.iconbtn:hover{background:var(--sunk);color:var(--ink)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--faint);white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sync.on i{background:var(--accent)}
.sync.warn i{background:var(--warn)}
.view{display:grid;gap:22px;padding-top:4px;outline:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view>*{min-width:0}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:18px;height:18px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);align-items:end;
  padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.tabs button{display:grid;justify-items:center;gap:3px;padding:6px 0;min-height:50px;color:var(--faint);font-size:10.5px;font-weight:500}
.tabs button.on{color:var(--ink)}
.tabs button.on svg.i{stroke-width:2.2}
.tabs .cap{align-self:center}
.tabs .cap span{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
  box-shadow:0 6px 18px var(--shadow)}
.tabs .cap svg.i{width:26px;height:26px;stroke-width:2.2}
.side{display:none}

@media (min-width:900px){
  .tabs{display:none}
  .side{display:flex;flex-direction:column;gap:2px;position:fixed;top:0;bottom:0;left:0;width:240px;z-index:25;
    padding:calc(22px + env(safe-area-inset-top,0px)) 12px 20px max(12px,env(safe-area-inset-left,0px));
    border-right:1px solid var(--line);background:var(--bg);overflow-y:auto}
  .side .brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:500;letter-spacing:-.02em;padding:0 10px 18px}
  .side .brand svg{width:26px;height:26px;color:var(--accent)}
  .side button{display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px;font-size:15px;color:var(--muted);min-height:44px}
  .side button:hover{background:var(--sunk);color:var(--ink)}
  .side button.on{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
  .side .capbtn{background:var(--accent);color:var(--accent-ink);margin:0 0 14px;justify-content:center;font-weight:600}
  .side .capbtn:hover{background:var(--accent);color:var(--accent-ink);filter:brightness(1.06)}
  .side .grp{font-size:12px;color:var(--faint);padding:16px 10px 4px}
  .main{margin-left:240px;max-width:760px;padding-bottom:48px}
  .app .main{margin-left:max(240px,calc(50% - 380px + 120px))}
  .toast{bottom:28px}
}

/* ── type and common pieces ───────────────────────────────────────── */
h2{margin:0;font-size:17px;font-weight:500;letter-spacing:-.01em;text-wrap:balance}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.sechead .meta{font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums}
.link{color:var(--accent);font-weight:500;font-size:14px;white-space:nowrap;padding:6px 0}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:13px}
.note{font-size:14px;color:var(--muted);line-height:1.5;max-width:60ch;margin:0}
.dateline{font-size:13px;color:var(--faint);letter-spacing:.02em}
.big{font-size:44px;font-weight:300;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card.flat{background:var(--sunk);border-color:transparent}
.empty{padding:18px;border:1px dashed var(--line2);border-radius:var(--r);color:var(--muted);font-size:14px;line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;
  font-weight:500;font-size:15px;background:var(--ink);color:var(--bg);white-space:nowrap}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.soft{background:var(--sunk);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line2)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 13px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btnrow .btn{flex:1 1 auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:99px;border:1px solid var(--line2);
  font-size:14px;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip i{width:8px;height:8px;border-radius:50%;flex:none}
.scrollx{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.scrollx::-webkit-scrollbar{display:none}
.scrollx .chip{flex:none}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.pill{display:inline-flex;align-items:center;font-size:12px;padding:3px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ex{background:transparent;border:1px dashed var(--line2);color:var(--faint)}
.pill.warn{color:var(--warn)}
.field{display:grid;gap:6px}
.field label,.lbl{font-size:13px;color:var(--muted)}
.input,textarea.input{width:100%;min-height:46px;padding:11px 14px;border-radius:12px;border:1px solid var(--line2);
  background:var(--surface);font-size:16px;line-height:1.4}
textarea.input{resize:vertical;min-height:110px}
.input:focus{outline:none;border-color:var(--accent)}

/* ── rows ─────────────────────────────────────────────────────────── */
.list{display:grid}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);min-height:56px;width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .t{font-size:16px;line-height:1.3;overflow-wrap:anywhere}
.row .s{font-size:13px;color:var(--faint);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row .ic{font-size:18px;width:24px;text-align:center;flex:none}
.row.done .t{color:var(--faint);text-decoration:line-through}
.ck{flex:none;width:44px;height:44px;margin:-10px -8px -10px -10px;display:grid;place-items:center}
.ck span{width:24px;height:24px;border-radius:8px;border:2px solid var(--line2);display:grid;place-items:center}
.ck.on span{background:var(--accent);border-color:var(--accent)}
.ck.on span::after{content:"";width:5px;height:10px;border:solid var(--accent-ink);border-width:0 2.4px 2.4px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chev{color:var(--faint);flex:none}

/* ── today ───────────────────────────────────────────────────────── */
.play{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:12px}
.play .k{display:flex;justify-content:space-between;font-size:12.5px;color:var(--faint)}
.play .t{font-size:22px;font-weight:500;letter-spacing:-.02em;line-height:1.2;display:flex;gap:12px;align-items:flex-start}
.play .t span:first-child{font-size:26px;line-height:1}
.play .w{font-size:14.5px;color:var(--muted);line-height:1.45}
.play .acts{display:grid;grid-template-columns:1fr auto;gap:8px}
.areas{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.areas::-webkit-scrollbar{display:none}
.acard{flex:0 0 148px;display:grid;gap:6px;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);
  box-shadow:inset 0 3px 0 var(--c);text-align:left}
.acard .n{font-size:14.5px;font-weight:500;display:flex;align-items:center;gap:7px;min-width:0}
.acard .n span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acard .f{font-size:12.5px;color:var(--muted);line-height:1.35;min-height:2.7em;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.st{font-size:11.5px;padding:2px 8px;border-radius:99px;justify-self:start;white-space:nowrap}
.st-ontrack{background:rgba(127,224,212,.15);color:#7FE0D4}
.st-needsyou{background:rgba(242,207,122,.16);color:#F2CF7A}
.st-blocked{background:rgba(245,163,163,.16);color:#F5A3A3}
.st-paused{background:var(--sunk);color:var(--muted)}
.st-planned{background:rgba(247,176,204,.15);color:#F7B0CC}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .st-ontrack{color:#16756B}
  :root:not([data-theme="dark"]) .st-needsyou{color:#8A6100}
  :root:not([data-theme="dark"]) .st-blocked{color:#B03A3A}
  :root:not([data-theme="dark"]) .st-planned{color:#A83A6A}}
:root[data-theme="light"] .st-ontrack{color:#16756B}
:root[data-theme="light"] .st-needsyou{color:#8A6100}
:root[data-theme="light"] .st-blocked{color:#B03A3A}
:root[data-theme="light"] .st-planned{color:#A83A6A}
.log{display:grid}
.logrow{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px;align-items:baseline}
.logrow:first-child{border-top:0}
.logrow time{width:48px;flex:none;font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.logrow .dot{transform:translateY(-1px)}
.inboxbar{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;background:var(--accent-tint);width:100%;text-align:left}
.inboxbar b{font-weight:500}
.inboxbar .grow{flex:1;min-width:0}

/* ── tasks ───────────────────────────────────────────────────────── */
.grouph{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:6px 0 0}
.grouph .c{color:var(--faint);font-variant-numeric:tabular-nums}
.grouph .ln{flex:1;height:1px;background:var(--line)}
.sweepbar{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;background:var(--sunk);width:100%;text-align:left}
.slip{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface);font-size:14.5px}
.slip .grow{flex:1;min-width:0}
.slip s{color:var(--faint);font-size:12.5px;white-space:nowrap}
.slip b{font-weight:500;font-size:12.5px;white-space:nowrap}
.sweepcard{display:grid;gap:12px;padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.sweepcard .t{font-size:17px}
.dest{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.dest .btn{min-height:48px}

/* ── task detail ─────────────────────────────────────────────────── */
.dhead{display:flex;gap:14px;align-items:flex-start}
.dhead .ic{width:48px;height:48px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:24px;flex:none}
.dhead h2{font-size:22px;line-height:1.25;letter-spacing:-.02em}
.props{display:grid;border-top:1px solid var(--line)}
.prop{display:flex;align-items:center;gap:12px;min-height:50px;border-bottom:1px solid var(--line);font-size:15px;width:100%;text-align:left}
.prop .k{width:96px;flex:none;color:var(--faint);font-size:14px}
.prop .v{flex:1;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.notebox{min-height:90px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:15.5px;line-height:1.55;outline:none;white-space:pre-wrap}
.notebox:focus{border-color:var(--accent)}
.notebox:empty::before{content:attr(data-ph);color:var(--faint)}
.steps .row{min-height:50px}
.addstep{display:flex;gap:8px}
.addstep .input{flex:1;min-width:0}

/* ── capture + sort ──────────────────────────────────────────────── */
.sheetbg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  box-shadow:0 -10px 40px var(--shadow);display:grid;gap:16px}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--line2);justify-self:center;margin-bottom:-4px}
.sheet .shead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet .shead h2{font-size:19px}
@media (min-width:760px){.sheetbg{align-items:center}.sheet{border-radius:22px;padding-bottom:20px}}
.capbox{font-size:19px;line-height:1.4;min-height:120px;border:0;background:transparent;padding:4px 0;resize:none;width:100%;outline:none}
.capbox::placeholder{color:var(--faint)}
.photo{position:relative;width:96px;height:96px;border-radius:12px;overflow:hidden;background:var(--sunk)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo button{position:absolute;right:4px;top:4px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.sugg{display:grid;gap:10px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.sugg .orig{font-size:13px;color:var(--faint);font-style:italic;overflow-wrap:anywhere}
.sugg .t{font-size:17px;font-weight:500;line-height:1.3}
.sugg .meta{display:flex;flex-wrap:wrap;gap:6px}
.sugg .first{font-size:14px;color:var(--muted)}
.sugg.gone{opacity:.45}
.typegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.typegrid .btn{min-height:48px;flex-direction:column;gap:2px;font-size:14px}

/* ── areas page ─────────────────────────────────────────────────── */
.agrid{display:grid;gap:10px}
.abig{display:grid;gap:10px;padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:inset 0 3px 0 var(--c);width:100%;text-align:left}
.abig .h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.abig .h b{font-weight:500;font-size:17px;display:flex;align-items:center;gap:8px}
.abig .kv{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.abig .kv span:first-child{color:var(--faint)}
@media (min-width:600px){.agrid{grid-template-columns:1fr 1fr}}

/* ── more ───────────────────────────────────────────────────────── */
.menu{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 14px}
.menu .row{min-height:54px}
.soon{font-size:12px;color:var(--faint);border:1px solid var(--line2);border-radius:99px;padding:2px 8px;white-space:nowrap}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;
  background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-size:14.5px;font-weight:500;
  box-shadow:0 10px 30px var(--shadow);width:max-content;max-width:calc(100% - 32px);display:flex;gap:14px;align-items:center}
.toast button{color:var(--accent);font-weight:600;padding:4px 0}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .toast button{color:#7FE0A8}}
:root[data-theme="light"] .toast button{color:#7FE0A8}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ── stat tiles, segmented control ─────────────────────────────────── */
.stats4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stats4>div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0;display:grid;gap:4px}
.stats4 span{font-size:12px;color:var(--faint);line-height:1.2}
.stats4 b{font-size:26px;font-weight:300;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.stats4 b small{font-size:14px;color:var(--faint)}
@media (max-width:380px){.stats4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:12px;padding:3px}
.seg button{min-height:38px;border-radius:9px;font-size:14px;color:var(--muted);text-align:center}
.seg button.on{background:var(--raise);color:var(--ink);box-shadow:0 1px 3px var(--shadow)}

/* ── habits ─────────────────────────────────────────────────────────── */
.habs{display:grid;gap:10px}
@media (min-width:600px){.habs{grid-template-columns:1fr 1fr}}
.hcard{display:grid;gap:12px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:inset 3px 0 0 var(--c)}
.hcard.big{box-shadow:inset 0 3px 0 var(--c)}
.hhead{display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-width:0}
.hhead .grow{display:grid;gap:2px;min-width:0;flex:1}

/* ── 02-store.js ── */
/* ═══ STORE ═══════════════════════════════════════════════════════════
   One map per collection. Every change is applied locally first (so the
   page reacts at once), cached in localStorage, then written to the
   viewer's private db subtree: data/users/<id>/m/<collection>/<doc>.
   That subtree is the viewer's own, so the same person on iPhone and iPad
   sees one set of data. Without db (signed out, or a plain browser) the
   app keeps working from the device cache. */
var COLS = ['areas', 'tasks', 'inbox', 'notes', 'log', 'meta', 'habits', 'goals', 'projects', 'journal', 'ranks', 'decks', 'lifts', 'tools'];
var CACHE_KEY = 'mossos.mobile.v1';

var Store = (function () {
  // out: the outbox. Every local change is listed here (and kept in the
  // device cache) until db confirms it. While listed, the local copy wins
  // over any snapshot, and a fresh launch sends it again. That way an edit
  // made just before iOS suspends the app is never lost.
  var S = {}, subs = [], db = null, base = null, timers = {}, out = {}, seq = 0, loaded = {}, status = 'local';
  COLS.forEach(function (c) { S[c] = {}; });

  function cacheLoad() {
    try {
      var raw = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
      if (raw && raw.v === 1) { COLS.forEach(function (c) { S[c] = raw.d[c] || {}; }); out = raw.o || {}; }
      return !!raw;
    } catch (e) { return false; }
  }
  var cacheT = null;
  function cacheNow() { clearTimeout(cacheT); try { localStorage.setItem(CACHE_KEY, JSON.stringify({ v: 1, d: S, o: out })); } catch (e) {} }
  function cacheSave() { clearTimeout(cacheT); cacheT = setTimeout(cacheNow, 200); }
  function emit() { subs.forEach(function (f) { try { f(); } catch (e) { console.error(e); } }); }

  function remoteWrite(col, id) {
    var key = col + '/' + id;
    out[key] = ++seq + '.' + Date.now();
    if (!db) return; // sent from the outbox once db connects
    if (timers[key]) clearTimeout(timers[key].t);
    var run = function () {
      delete timers[key];
      var mine = out[key], ref = db.doc(base + '/' + key), v = S[col][id];
      var p = v ? ref.set(JSON.parse(JSON.stringify(v))) : ref.delete();
      p.then(function () {
        if (out[key] === mine) { delete out[key]; cacheSave(); } // a newer edit keeps it listed
      }, function (e) {
        if (e && e.code === 'unavailable') setTimeout(function () { if (out[key] === mine) remoteWrite(col, id); }, 800 + Math.random() * 800);
        else if (e && e.code === 'quota_exceeded') { delete out[key]; toast('Storage is full. Delete some old items to keep saving.'); }
        else if (e && (e.code === 'invalid_argument')) { delete out[key]; console.warn('save refused', key, e); }
        else console.warn('save failed', key, e);
      });
    };
    timers[key] = { t: setTimeout(run, 350), run: run };
  }
  /* Hand every waiting write to db now: the app is being hidden or closed. */
  function flush() {
    Object.keys(timers).forEach(function (k) { var x = timers[k]; clearTimeout(x.t); x.run(); });
    cacheNow();
  }
  addEventListener('pagehide', flush);
  document.addEventListener('visibilitychange', function () { if (document.hidden) flush(); });

  return {
    flush: flush,
    init: function () { var had = cacheLoad(); emit(); return had; },
    status: function () { return status; },
    on: function (f) { subs.push(f); },
    all: function (col) { var m = S[col]; return Object.keys(m).map(function (k) { return m[k]; }); },
    get: function (col, id) { return S[col][id] || null; },
    put: function (col, obj, quiet) {
      if (!obj.id) obj.id = uid(col.charAt(0));
      obj.updated = Date.now();
      if (!obj.created) obj.created = obj.updated;
      S[col][obj.id] = obj;
      cacheSave(); remoteWrite(col, obj.id); if (!quiet) emit();
      return obj;
    },
    patch: function (col, id, fields) {
      var o = S[col][id]; if (!o) return null;
      Object.keys(fields).forEach(function (k) { o[k] = fields[k]; });
      return this.put(col, o);
    },
    del: function (col, id) { delete S[col][id]; cacheSave(); remoteWrite(col, id); emit(); },
    loaded: function (col) { return !!loaded[col]; },
    /* Connect to db. Called once at boot; resolves whether sync is live. */
    connect: function (onFirst) {
      if (!window.claude || !window.claude.use) { status = 'local'; emit(); return Promise.resolve(false); }
      status = 'connecting'; emit();
      return Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function (r) {
        var d = r[0], user = r[1];
        if (!d || !user) { status = 'local'; emit(); return false; }
        return Promise.resolve(user.id ? user.id() : null).then(function (id) {
          if (!id) { status = 'local'; emit(); return false; }
          db = d; base = 'data/users/' + id + '/m';
          // Everything still in the outbox (from before db arrived, or from a
          // session that ended before db confirmed it) goes out first.
          Object.keys(out).forEach(function (key) {
            var p = key.split('/'); if (COLS.indexOf(p[0]) > -1 && p[1]) remoteWrite(p[0], p[1]); else delete out[key];
          });
          var waiting = COLS.length, slow = setTimeout(function () { if (status === 'connecting') { status = 'slow'; emit(); } }, 10000);
          COLS.forEach(function (col) {
            db.collection(base + '/' + col).onSnapshot(function (snap) {
              var fresh = {};
              snap.docs.forEach(function (doc) { var v = doc.data(); if (v) fresh[doc.id] = v; });
              // Local changes db hasn't confirmed yet win over what the snapshot says.
              Object.keys(out).forEach(function (key) {
                var p = key.split('/'); if (p[0] !== col) return;
                if (S[col][p[1]]) fresh[p[1]] = S[col][p[1]]; else delete fresh[p[1]];
              });
              S[col] = fresh;
              if (!snap.metadata.fromCache && !loaded[col]) {
                loaded[col] = true;
                if (--waiting === 0) { clearTimeout(slow); status = 'synced'; if (onFirst) onFirst(); }
              }
              cacheSave(); emit();
            }, function (err) {
              status = err && err.code === 'revoked' ? 'local' : 'error'; emit();
            });
          });
          return true;
        });
      }).catch(function () { status = 'local'; emit(); return false; });
    },
    resetLocal: function () {
      COLS.forEach(function (c) { Object.keys(S[c]).forEach(function (id) { delete S[c][id]; remoteWrite(c, id); }); });
      cacheSave(); emit();
    }
  };
})();

/* Activity log: written automatically, read by Today. Keeps the last 300. */
function logEvent(text, area) {
  Store.put('log', { at: Date.now(), day: today(), text: text, area: area || null }, true);

  all.slice(300).forEach(function (o) { Store.del('log', o.id); });
}

  var el = e.target.closest('[data-act]'); if (!el) return;
  var f = ACTS[el.dataset.act]; if (!f) return;
  e.preventDefault(); f(el.dataset, el, e);
});
ACTS.tab = function (d) { go(d.v); };
ACTS.back = function () { pop(); };
ACTS.close = function () { closeSheet(); };
ACTS.open = function (d) { push(d.v, d.id); };

/* ── AI (Claude via the sample capability) ─────────────────────────── */
var AI = { s: null, ready: false };
function aiInit() {
  if (!window.claude || !window.claude.use) return;
  window.claude.use('sample').then(function (s) { AI.s = s; AI.ready = !!s; render(); });
}
function aiJson(prompt, opts) {
  if (!AI.s) return Promise.reject({ code: 'not_granted' });
  return AI.s.json(prompt, Object.assign({ modelTier: 'quick' }, opts || {}));
}
function aiError(e) {
  var c = e && e.code;
  if (c === 'not_granted') return 'Claude isn\'t available here. Open MossOS in the Claude app to use it.';
  if (c === 'rate_limited') return 'Claude is busy. Try again in a minute.';
  if (c === 'cancelled') return 'Stopped.';
  return 'Claude couldn\'t answer that. Try again.';
}

/* Shared bits of markup. */
function areaDot(id) { return '<span class="dot" style="background:' + areaColor(id) + '"></span>'; }
function areaName(id) { var a = area(id); return a ? a.short : ''; }
function exPill(o) { return o && o.example ? '<span class="pill ex">example</span>' : ''; }

/* ── 10-today.js ── */
/* ═══ TODAY ═════════════════════════════════════════════════════════
   Money, then the Play card (one thing at a time), habits, life areas,
   and the day's log. */
TITLES.today = 'Today';
VIEWS.today = function () {
  var d = new Date(), t = today();
  var inboxN = Store.all('inbox').length, slipN = slipped().length;
  var h = '<div class="dateline">' + DOWL[d.getDay()] + ' · ' + d.getDate() + ' ' + MON[d.getMonth()] + '</div>';
  h += jumpTiles(['habits', 'goals', 'notes', 'projects', 'tools', 'calendar']);

  if (hasExamples()) h += '<div class="card flat"><p class="note">You\'re looking at example data so you can see how MossOS works. '
    + 'Items marked <span class="pill ex">example</span> go when you clear them.</p>'
    + '<div class="btnrow" style="margin-top:12px"><button class="btn sm soft" data-act="clearex">Clear examples</button></div></div>';

  if (inboxN || slipN) {
    h += '<div style="display:grid;gap:8px">';
    if (inboxN) h += '<button class="inboxbar" data-act="tab" data-v="inbox">' + icon('inbox') + '<span class="grow"><b>' + inboxN + ' captured</b>'
      + '<span class="muted small"> · waiting to be sorted</span></span>' + icon('chev', 'sm chev') + '</button>';
    if (slipN) h += '<button class="sweepbar" data-act="open" data-v="sweep">' + icon('broom') + '<span class="grow"><b style="font-weight:500">'
      + slipN + ' slipped</b><span class="muted small"> · give each a new day</span></span>' + icon('chev', 'sm chev') + '</button>';
    h += '</div>';
  }

  if (typeof moneyStrip === 'function') h += moneyStrip();

  // Play
  var q = playQueue();
  h += '<section><div class="sechead"><h2>Play</h2><span class="meta">one at a time · ' + q.length + ' left</span></div>';
  if (q.length) {
    var x = q[0];
    h += '<div class="play"><div class="k"><span>' + areaDot(x.area) + ' ' + esc(areaName(x.area) || 'No area')
      + (x.tag ? ' · ' + esc(x.tag) : '') + '</span><span>' + esc([x.time ? fmtTime(x.time) : '', x.est ? '~' + x.est : ''].filter(Boolean).join(' · ')) + '</span></div>'
      + '<div class="t"><span>' + esc(x.ic || '•') + '</span><span>' + esc(x.t) + '</span></div>'
      + '<div class="w">' + esc(x.why) + '</div>'
      + '<div class="acts"><button class="btn accent" data-act="playdo" data-k="' + x.kind + '" data-id="' + x.id + '">' + (x.kind === 'habit' ? 'Mark done' : 'Do it') + '</button>'
      + '<button class="btn soft" data-act="playskip" data-k="' + x.kind + '" data-id="' + x.id + '">Skip ›</button></div>'
      + '<button class="link" style="justify-self:start" data-act="open" data-v="' + x.kind + '" data-id="' + x.id + '">Open the ' + x.kind + '</button></div>';
  } else {
    h += '<div class="empty">Nothing waiting. Capture something, or enjoy the gap.</div>';
  }
  h += '</section>';

  // Habits due today
  var hd = habitsDueToday();
  if (hd.length) {
    var hdone = hd.filter(function (x) { return mark(x, t) === 1; }).length;
    h += '<section><div class="sechead"><h2>Habits today</h2><span class="meta">' + hdone + '/' + hd.length + '</span></div><div class="hchips">'
      + hd.map(function (x) {
        var m = mark(x, t);
        return '<button class="hchip' + (m === 1 ? ' on' : '') + (m === 2 ? ' skip' : '') + '" style="--c:' + esc(x.color) + '" data-act="habtoggle" data-id="' + x.id + '" aria-pressed="' + (m === 1) + '">'
          + '<span>' + esc(x.ic) + '</span>' + esc(x.n) + (m === 1 ? ' ✓' : '') + '</button>';
      }).join('') + '</div></section>';
  }

  // Areas
  h += '<section><div class="sechead"><h2>Life areas</h2><button class="link" data-act="tab" data-v="areas">All</button></div><div class="areas">'
    + areasSorted().map(function (a) {
      return '<button class="acard" style="--c:' + esc(a.color) + '" data-act="open" data-v="area" data-id="' + a.id + '">'
        + '<span class="n"><span class="dot" style="background:' + esc(a.color) + '"></span><span>' + esc(a.short) + '</span></span>'
        + '<span class="st st-' + a.state.toLowerCase().replace(/\s/g, '') + '">' + esc(a.state) + '</span>'
        + '<span class="f">' + esc(a.focus || '') + '</span></button>';
    }).join('') + '</div></section>';

  // Rescheduled
  var rs = rescheduled().slice(0, 4);
  if (rs.length) h += '<section><div class="sechead"><h2>Slipped, rescheduled</h2><span class="meta">nothing overdue</span></div><div style="display:grid;gap:6px">'
    + rs.map(slipRow).join('') + '</div></section>';

  // Log
  var log = Store.all('log').filter(function (l) { return l.day === t; }).sort(function (a, b) { return b.at - a.at; });
  h += '<section><div class="sechead"><h2>Today\'s log</h2><span class="meta">writes itself</span></div>'
    + (log.length ? '<div class="log">' + log.slice(0, 12).map(function (l) {
      return '<div class="logrow"><time>' + clock(l.at) + '</time>' + areaDot(l.area) + '<span>' + esc(l.text) + '</span></div>';
    }).join('') + '</div>' : '<div class="empty">Nothing yet. Finishing a task, marking a habit or capturing something adds a line here.</div>')

function slipRow(tk) {
  var now = tk.slip.now === 'drifted' ? 'Drifted' : tk.slip.now === 'whenever' ? 'Whenever' : shortDate(tk.slip.now);
  return '<button class="slip" data-act="open" data-v="task" data-id="' + tk.id + '">' + areaDot(tk.area)
    + '<span class="grow">' + esc(tk.t) + '</span><s>' + esc(shortDate(tk.slip.was)) + '</s><span class="faint">→</span><b>' + esc(now) + '</b></button>';
}

ACTS.clearex = function () { clearExamples(); toast('Examples cleared'); };
ACTS.toggle = function (d) {
  var undo = snapshot(d.id), rep = !!(Store.get('tasks', d.id) || {}).repeat, on = completeTask(d.id), n = Store.get('tasks', d.id);
  toast(on ? (rep ? 'Done. Next: ' + esc(shortDate(n.due)) : 'Done') : 'Marked not done', undo);
};
ACTS.playdo = function (d) {
  if (d.k === 'habit') return toggleToday(d.id);
  if (d.k === 'goal') return ACTS.goalnextdone({ id: d.id });
  var undo = snapshot(d.id);
  completeTask(d.id, true);
  toast('Done. Next one is up.', undo);
};
ACTS.playskip = function (d) {
  var k = today(); playSkips[k] = playSkips[k] || {}; playSkips[k][(d.k || 'task') + d.id] = 1; render();
};


/* One-tap tiles to the other sections, each with a live count. */
function sectionCount(k) {
  var t = today();
  if (k === 'habits') { var hd = habitsDueToday(); return hd.length ? hd.filter(function (x) { return mark(x, t) === 1; }).length + '/' + hd.length + ' today' : 'none due'; }
  if (k === 'goals') { var g = goalsLive(); return g.length + ' live'; }
  if (k === 'notes') { var n = Store.all('notes').length; return n + ' note' + (n === 1 ? '' : 's'); }
  if (k === 'projects') { var p = projectsAll('active').length; return p + ' active'; }
  if (k === 'tools') { var r = Store.all('ranks').reduce(function (a, l) { return a + rankPending(l).length; }, 0), c = Store.all('decks').reduce(function (a, dk) { return a + dueCards(dk).length; }, 0); return r ? r + ' to rank' : c ? c + ' cards due' : 'Rank, cards, gym'; }
  if (k === 'calendar') { var w = Store.all('tasks').filter(function (x) { return !x.done && x.due && x.due > t && dayDiff(t, x.due) <= 7; }).length; return w + ' this week'; }
  if (k === 'journal') { var e = entryFor(t); return e && (e.text || e.mood) ? 'written today' : 'not yet today'; }
  if (k === 'inbox') { return Store.all('inbox').length + ' to sort'; }
  if (k === 'tasks') { return tasksIn('today').filter(function (x) { return !x.done; }).length + ' today'; }
  if (k === 'areas') { return areasSorted().filter(function (a) { return a.state === 'Needs you'; }).length + ' need you'; }
  return '';
}
function jumpTiles(keys) {
  return '<nav class="jump" aria-label="Go to">' + keys.map(function (k) {
    return '<button class="jt2" data-act="tab" data-v="' + k + '">' + icon(SECTIONS[k][1], 'sm') + '<b>' + SECTIONS[k][0] + '</b><span>' + esc(sectionCount(k)) + '</span></button>';
  }).join('') + '</nav>';
}

/* ── 11-tasks.js ── */
/* ═══ TASKS ═════════════════════════════════════════════════════════
   Three groups: Today, Upcoming, Someday. Add from the box at the top in
   plain words; swipe a row right to finish it or left to move it to
   tomorrow; tap a title to rename it in place. */
var taskFilter = null;
TITLES.tasks = 'Tasks';
VIEWS.tasks = function () {
  var open = Store.all('tasks').filter(function (t) { return !t.done; });
  var h = '<form class="addtask" data-form="quickadd"><label class="sr" for="qadd">Add a task</label>'
    + '<input id="qadd" class="input" placeholder="Add a task: &quot;gym 6pm every Mon, Thu&quot;" autocomplete="off" enterkeyhint="done">'
    + '<button class="btn accent" type="submit" aria-label="Add">' + icon('plus', 'sm') + '</button></form>';
  h += '<div class="scrollx" role="group" aria-label="Filter by area"><button class="chip' + (!taskFilter ? ' on' : '') + '" data-act="tfilter" data-id="">All · ' + open.length + '</button>'
    + areasSorted().map(function (a) {
      var n = open.filter(function (t) { return t.area === a.id; }).length;
      return '<button class="chip' + (taskFilter === a.id ? ' on' : '') + '" data-act="tfilter" data-id="' + a.id + '"><i style="background:' + esc(a.color) + '"></i>' + esc(a.short) + (n ? ' · ' + n : '') + '</button>';
    }).join('') + '</div>';
  var sl = slipped().filter(function (t) { return !taskFilter || t.area === taskFilter; });
  if (sl.length) h += '<button class="sweepbar" data-act="open" data-v="sweep">' + icon('broom') + '<span class="grow"><b style="font-weight:500">'
    + sl.length + ' slipped</b><span class="muted small"> · sweep them onto real days</span></span>' + icon('chev', 'sm chev') + '</button>';
  GROUPS.forEach(function (g) {
    var list = tasksInGroup(g[0], taskFilter), openN = list.filter(function (t) { return !t.done; }).length;
    h += '<section><div class="grouph">' + g[1] + ' <span class="c">' + openN + '</span><span class="ln"></span></div>'
      + (list.length ? '<div class="tlist">' + list.map(taskRow).join('') + '</div>'
        : '<p class="note small" style="padding:6px 2px">' + { today: 'Nothing due today.', upcoming: 'Nothing scheduled.', someday: 'Nothing parked here.' }[g[0]] + '</p>')
      + '</section>';
  });
  var wk = Date.now() - 7 * 864e5;
  var older = Store.all('tasks').filter(function (t) { return bucket(t) === 'done' && t.doneAt > wk && (!taskFilter || t.area === taskFilter); })
    .sort(function (a, b) { return b.doneAt - a.doneAt; });
  if (older.length) h += '<details class="donegrp"><summary>Done this week · ' + older.length + '</summary><div class="tlist">' + older.map(taskRow).join('') + '</div></details>';
  h += '<p class="note small">Swipe a task right to finish it, left to move it to tomorrow. Tap a name to rename it.</p>';
  return h;
};
VIEWS.tasks.after = function () { wireSwipes(); };
function whenText(t) {
  var g = listGroup(t), out = [];
  if (t.due && g !== 'today') out.push(shortDate(t.due));
  if (t.time) out.push(fmtTime(t.time));
  return out.join(' ');
}
function taskRow(t) {
  var meta = [];
  if (t.area) meta.push(areaDot(t.area) + esc(areaName(t.area)));
  var w = whenText(t); if (w) meta.push(esc(w));
  if (t.repeat) meta.push('↻ ' + esc(repeatLabel(t.repeat)));
  var st = t.steps || []; if (st.length) meta.push(st.filter(function (x) { return x.done; }).length + '/' + st.length);
  return '<div class="trow' + (t.done ? ' done' : '') + '" data-swipe="' + t.id + '">'
    + '<div class="swbg" aria-hidden="true"><span class="l">' + (t.repeat ? '↻ Done' : '✓ Done') + '</span><span class="r">Tomorrow →</span></div>'
    + '<div class="trin">'
    + '<button class="ck' + (t.done ? ' on' : '') + '" data-act="toggle" data-id="' + t.id + '" aria-label="' + (t.done ? 'Mark not done' : 'Mark done') + '"><span></span></button>'
    + '<div class="grow"><button class="tt" data-act="rename" data-id="' + t.id + '" aria-label="Rename ' + esc(t.t) + '">' + esc(t.ic ? t.ic + ' ' : '') + esc(t.t) + '</button>'
    + (meta.length || t.example ? '<div class="s">' + meta.join('<span class="faint">·</span>') + ' ' + exPill(t) + '</div>' : '') + '</div>'
    + '<button class="iconbtn" data-act="open" data-v="task" data-id="' + t.id + '" aria-label="Open ' + esc(t.t) + '">' + icon('chev', 'sm') + '</button>'
    + '</div></div>';
}
ACTS.tfilter = function (d) { taskFilter = d.id || null; render(); };
ACTS.form_quickadd = function (d, f) {
  var inp = $('input', f), v = inp.value.trim(); if (!v) return;
  var p = parseTaskText(v);
  var t = Store.put('tasks', { t: p.title, ic: '', area: p.area || taskFilter, project: p.project, due: p.due || today(), time: p.time, repeat: p.repeat, done: false, steps: [], note: '' });
  inp.value = ''; logEvent('New task: ' + t.t, t.area);
  render(false, true); var n = $('#qadd'); if (n) n.focus();
  toast('Added: ' + esc([t.t, shortDate(t.due), t.time ? fmtTime(t.time) : '', t.repeat ? '↻ ' + repeatLabel(t.repeat) : ''].filter(Boolean).join(' · ')), function () { Store.del('tasks', t.id); });
};
ACTS.newtask = function () {
  var t = Store.put('tasks', { t: 'New task', ic: '', area: taskFilter, due: today(), done: false, steps: [], note: '' });
  push('task', t.id);
  setTimeout(function () { var el = $('#ttitle'); if (el) { el.focus(); el.select(); } }, 50);
};
/* Rename in place: the title becomes a text field. */
ACTS.rename = function (d, el) {
  if (el.dataset.moved) { delete el.dataset.moved; return; }
  var t = Store.get('tasks', d.id); if (!t) return;
  var inp = document.createElement('input');
  inp.className = 'input ttedit'; inp.value = t.t; inp.setAttribute('aria-label', 'Task name'); inp.id = 'ren' + t.id;
  el.replaceWith(inp); inp.focus(); inp.select();
  var done = false;
  var finish = function (save) {
    if (done) return; done = true;
    var v = inp.value.trim();
    if (save && v && v !== t.t) { Store.patch('tasks', t.id, { t: v }); toast('Renamed'); }
    inp.blur(); render(false, true);
  };
  inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); finish(true); } else if (e.key === 'Escape') { e.stopPropagation(); finish(false); } });
  inp.addEventListener('blur', function () { finish(true); });
};
/* Swipe right: done. Swipe left: tomorrow. Vertical drags scroll as usual. */
function wireSwipes() {
  $$('[data-swipe]').forEach(function (row) {
    var inner = $('.trin', row), id = row.dataset.swipe, x0 = 0, y0 = 0, dx = 0, on = false, locked = null, pid = null;
    inner.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      if (e.target.closest('input')) return;
      on = true; locked = null; dx = 0; x0 = e.clientX; y0 = e.clientY; pid = e.pointerId;
    });
    inner.addEventListener('pointermove', function (e) {
      if (!on || e.pointerId !== pid) return;
      var mx = e.clientX - x0, my = e.clientY - y0;
      if (locked === null && (Math.abs(mx) > 8 || Math.abs(my) > 8)) {
        locked = Math.abs(mx) > Math.abs(my) ? 'x' : 'y';
        if (locked === 'x') { try { inner.setPointerCapture(pid); } catch (er) {} row.classList.add('swiping'); }
      }
      if (locked !== 'x') return;
      dx = mx; inner.style.transform = 'translateX(' + dx + 'px)';
      row.classList.toggle('goR', dx > 70); row.classList.toggle('goL', dx < -70);
    });
    var end = function () {
      if (!on) return; on = false;
      row.classList.remove('swiping', 'goR', 'goL'); inner.style.transform = '';
      if (locked !== 'x') return;
      // a swipe isn't a tap: don't let the click that follows rename or open
      $$('[data-act]', inner).forEach(function (b) { b.dataset.moved = '1'; setTimeout(function () { delete b.dataset.moved; }, 400); });
      var t = Store.get('tasks', id); if (!t) return;
      var undo = snapshot(id), wasDone = !!t.done, rep = !!t.repeat;
      if (dx > 70) { completeTask(id, !wasDone); var n = Store.get('tasks', id); toast(wasDone ? 'Marked not done' : rep ? 'Done. Next: ' + esc(shortDate(n.due)) : 'Done', undo); }
      else if (dx < -70 && !wasDone) { moveTask(id, 'tomorrow'); toast('Moved to tomorrow', undo); }
    };
    inner.addEventListener('pointerup', end); inner.addEventListener('pointercancel', end);
  });
}
/* Clicks that end a swipe are swallowed (see data-moved above). */
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-moved]'); if (el && el.dataset.act !== 'rename') { e.stopImmediatePropagation(); e.preventDefault(); delete el.dataset.moved; }
}, true);

  h += '<section><div class="sechead"><h2>Details</h2></div><div class="props">'

    + '<div class="prop"><span class="k">Repeat</span><span class="v">' + [['', 'None'], ['day', 'Daily'], ['weekday', 'Weekdays'], ['week', 'Weekly'], ['month', 'Monthly']].map(function (r) {

    if (!o.time) o.time = pt.time || null;

/* Rule-based sorter: used without Claude, or when Claude fails. */
function guessSort(item, ctx) {
  var text = item.text || '', low = text.toLowerCase().trim();
  var o = { id: item.id, raw: text, type: 'task', title: text, area: null, project: null, due: null, time: null, repeat: null, firstStep: null, year: '', score: null, note: '', icon: '', targetId: null };
  var sc = low.match(/\b(\d{1,2}(?:\.\d)?)\s*(?:\/\s*10|out of 10)\b/);
  if (/^(i\s+)?(just\s+)?(watched|saw|rewatched|finished watching)\s+/.test(low) || /\b(movie|film)\b/.test(low) && sc) {
    var title = text.replace(/^(i\s+)?(just\s+)?(watched|saw|rewatched|finished watching)\s+/i, '').replace(/\b\d{1,2}(\.\d)?\s*(\/\s*10|out of 10)\b/i, '').replace(/\b(movie|film)\b/i, '').trim();
    var parts = title.split(/\s+[-–—]\s+|,\s+|\.\s+/), ym = /\((\d{4})\)/.exec(parts[0]);
    o.type = 'movie'; o.title = parts[0].replace(/\(\d{4}\)/, '').trim(); o.year = ym ? ym[1] : ''; o.score = sc ? +sc[1] : null; o.note = parts.slice(1).join(', ');
    return o;
  }
  var hab = ctx.habits.filter(function (h) { return overlap(h.name, text) >= 0.5 || low.indexOf(h.name.toLowerCase()) > -1; })[0];
  if (hab && /^(took|did|done|went|walked|read|drank|finished|✓|x\b)|\b(done|today)\b/.test(low) || hab && words(text).length <= 3) { o.type = 'habit_done'; o.targetId = hab.id; o.title = hab.name; return o; }
  if (/^(done|did|finished|sent|called|booked|paid|emailed|submitted|bought|fixed|cleaned)\b/.test(low)) {
    var best = null, bs = 0; ctx.tasks.forEach(function (t) { var v = overlap(t.t, text); if (v > bs) { bs = v; best = t; } });
    if (best && bs >= 0.5) { o.type = 'done'; o.targetId = best.id; o.title = best.t; return o; }
  }
  if (/\b(every (day|morning|night|evening)|each (day|morning|night)|daily|habit)\b/.test(low) && !/\b(\d{1,2}(:\d\d)?\s*(am|pm)|at \d)/.test(low)) {
    o.type = 'habit_new'; o.title = text.replace(/\b(start(ing)?|begin|i want to|i should)\b/ig, '').replace(/\b(every (day|morning|night|evening|week)|each (day|morning|night)|daily|habit)\b/ig, '').trim().replace(/^\w/, function (c) { return c.toUpperCase(); }) || text; return o;
  }
  if (/^idea\b[:\s-]*/i.test(text)) { o.type = 'idea'; o.title = text.replace(/^idea\b[:\s-]*/i, ''); return o; }
  if (/^(feeling|felt|i feel|today was|rough|good day|bad day|tired|grateful|journal)\b/.test(low)) { o.type = 'journal'; return o; }
  if (/^(note|remember that|fyi)\b[:\s-]*/i.test(text) || /https?:\/\//.test(low) || /\b(password|code|address|phone|number|ref)\b.*[:#]/.test(low)) { o.type = 'note'; o.title = text.replace(/^(note|remember that|fyi)\b[:\s-]*/i, '').slice(0, 80); return o; }
  if (/\b(by|before)\s+(summer|winter|spring|fall|the end of|december|january|june|next year)|\bgoal\b/.test(low)) { o.type = 'goal'; return o; }
  // A task: read its day, time, repeat, area and project from the words.
  var pt = parseTaskText(text);
  o.title = pt.title; o.due = pt.due; o.time = pt.time; o.repeat = pt.repeat; o.area = pt.area; o.project = pt.project;
  return o;
}

/* ═══ HABITS ════════════════════════════════════════════════════════

var HAB_TPL = [
  ['💊', 'Meds', '#5FCF8E', 'Same time as coffee. The coffee is the cue.'],
  ['🚶', 'Morning walk', '#7AA2F7', 'Ten minutes counts. It is daylight, not exercise.'],
  ['📖', 'Read 20 pages', '#F0C889', 'Any book. Pages, not minutes.'],
  ['💧', 'Drink water', '#8FD3C7', 'A glass when you sit down.'],
  ['🧹', 'Tidy one thing', '#C39BD3', 'One thing. Not the room.'],
  ['🌙', 'Phone out of the bedroom', '#8FD3C7', 'The charger lives elsewhere.'],
  ['✍️', 'Write one line', '#F0C889', 'A sentence counts.'],
  ['🧘', 'Sit still for two minutes', '#C39BD3', 'Two. Not twenty.'],
  ['🏃', 'Run', '#F08A4B', 'Shoes on is the habit. The run follows.'],
  ['📚', 'Study 25 minutes', '#3CC4B4', 'One timer. Stop when it rings.']

function setMark(id, s, v) {

/* ── list ───────────────────────────────────────────────────────────── */

function goalPct(g) {

      + '<span class="s">' + (g.area ? areaDot(g.area) + esc(areaName(g.area)) : '') + (g.due ? (/^ongoing$/i.test(g.due) ? ' · ongoing' : ' · by ' + esc(g.due)) : '') + ' ' + exPill(g) + '</span></span><span class="gp">' + p + '%</span></div>'

  }).join('') + '</div>' + addForm('', [['t', 'Add an item']]);

  }).join('') + '</div>';
  if (k === 'links') return '<div class="list">' + items.map(function (x, i) {

    return '<div class="row"><span class="grow"><a class="t" href="' + esc(safe) + '" target="_blank" rel="noopener" style="color:var(--accent)">' + esc(x.t || x.url) + '</a><div class="s">' + esc(x.url) + '</div></span>' + del(i) + '</div>';
  }).join('') + '</div>' + addForm('', [['t', 'Name'], ['url', 'https://…', 'url']]);
  if (k === 'people') return '<div class="list">' + items.map(function (x, i) {

/* ── 17-journal.js ── */
/* ═══ JOURNAL ═══════════════════════════════════════════════════════
   One entry per day (id j<date>): a mood and some words. Recorded, not
   scored. The prompt is built from today's log, so there's always a
   place to start. */
var MOODS = { good: ['🙂', 'Good'], ok: ['😐', 'Okay'], low: ['🌧', 'Low'] };
function entryFor(day) { return Store.get('journal', 'j' + day); }
TITLES.journal = 'Journal';
VIEWS.journal = function () {
  var t = today(), e = entryFor(t) || {};
  var log = Store.all('log').filter(function (l) { return l.day === t; }).sort(function (a, b) { return a.at - b.at; });
  var prompt = log.length ? 'Today you: ' + log.slice(-3).map(function (l) { return l.text.replace(/^Done: /, ''); }).join('; ') + '. How did it feel?'
    : 'What took up most of today?';
  var past = Store.all('journal').filter(function (j) { return j.day !== t; }).sort(function (a, b) { return b.day.localeCompare(a.day); });
  var wk = range(7).map(function (i) { return addDays(t, i - 6); });
  var h = '<div class="moodweek">' + wk.map(function (d) {
    var j = entryFor(d);
    return '<span class="' + (d === t ? 'now' : '') + '"><b>' + (j && j.mood ? MOODS[j.mood][0] : '·') + '</b><em>' + DOW[parseYmd(d).getDay()].charAt(0) + '</em></span>';
  }).join('') + '</div>';
  h += '<section class="card" style="display:grid;gap:12px"><div class="sechead" style="margin:0"><h2>' + esc(DOWL[new Date().getDay()]) + '</h2><span class="meta">' + esc(shortDate(t)) + '</span></div>'
    + '<div class="chips" role="group" aria-label="Mood">' + Object.keys(MOODS).map(function (k) {
      return '<button class="chip' + (e.mood === k ? ' on' : '') + '" data-act="mood" data-m="' + k + '" aria-pressed="' + (e.mood === k) + '">' + MOODS[k][0] + ' ' + MOODS[k][1] + '</button>';
    }).join('') + '</div>'
    + '<label class="sr" for="jtext">Entry</label><textarea id="jtext" class="input" style="min-height:160px;font-size:16.5px;line-height:1.55" placeholder="' + esc(prompt) + '">' + esc(e.text || '') + '</textarea>'
    + '<p class="note small">Recorded, not scored. Saved as you type.</p></section>';
  h += past.length ? '<section><div class="sechead"><h2>Earlier</h2><span class="meta">' + past.length + '</span></div><div class="list">' + past.slice(0, 60).map(function (j) {

/* ── 18-calendar.js ── */
/* ═══ CALENDAR ══════════════════════════════════════════════════════
   Month: a grid with a dot per task (in its area's colour) and a mark
   for journal days. Week: the Status design's view, each day a column of
   blocks coloured by area. Tap a day to see and add to it. Money
   (paydays, bills) joins in the Finance update. */
var cal = { mode: 'month', sel: null, month: null };
function monthStart(s) { return s.slice(0, 8) + '01'; }
function tasksOn(d) {
  return Store.all('tasks').filter(function (t) { return t.due === d || (t.done && t.doneAt && ymd(new Date(t.doneAt)) === d && t.due !== d); }).sort(byWhen);
}
TITLES.calendar = 'Calendar';
VIEWS.calendar = function () {
  var t = today(); cal.sel = cal.sel || t; cal.month = cal.month || monthStart(t);
  var h = '<div class="seg" role="tablist">' + [['month', 'Month'], ['week', 'Week']].map(function (v) {
    return '<button role="tab" aria-selected="' + (cal.mode === v[0]) + '" class="' + (cal.mode === v[0] ? 'on' : '') + '" data-act="calmode" data-v="' + v[0] + '">' + v[1] + '</button>';
  }).join('') + '</div>';
  h += cal.mode === 'month' ? monthView() : weekView();
  h += dayDetail(cal.sel);
  return h;
};
function monthView() {
  var t = today(), m = cal.month, first = parseYmd(m), lead = (first.getDay() + 6) % 7;
  var days = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  var h = '<div class="calhead"><button class="iconbtn" data-act="calnav" data-n="-1" aria-label="Previous month">' + icon('back') + '</button>'
    + '<b>' + ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][first.getMonth()] + ' ' + first.getFullYear() + '</b>'
    + '<button class="iconbtn" data-act="calnav" data-n="1" aria-label="Next month">' + icon('chev') + '</button></div>'
    + '<div class="cal">' + ['M', 'T', 'W', 'T', 'F', 'S', 'S'].map(function (x) { return '<span class="wdh">' + x + '</span>'; }).join('');
  for (var i = 0; i < lead; i++) h += '<span></span>';
  for (var dnum = 1; dnum <= days; dnum++) {
    var d = m.slice(0, 8) + String(dnum).padStart(2, '0'), ts = tasksOn(d), j = entryFor(d);
    h += '<button class="day' + (d === t ? ' today' : '') + (d === cal.sel ? ' sel' : '') + '" data-act="calday" data-d="' + d + '" aria-label="' + esc(shortDate(d)) + ', ' + ts.length + ' tasks">'
      + '<span class="n">' + dnum + '</span><span class="dots">' + ts.slice(0, 4).map(function (x) {
        return '<i style="background:' + areaColor(x.area) + (x.done ? ';opacity:.4' : '') + '"></i>';
      }).join('') + '</span>' + (j && j.mood ? '<span class="mood">' + MOODS[j.mood][0] + '</span>' : '') + '</button>';
  }
  return h + '</div>';
}
function weekView() {
  var t = today(), sel = cal.sel, mon = addDays(sel, -wd(sel));
  var h = '<div class="calhead"><button class="iconbtn" data-act="calweek" data-n="-7" aria-label="Previous week">' + icon('back') + '</button>'
    + '<b>' + esc(absDate(mon)) + ' – ' + esc(absDate(addDays(mon, 6))) + '</b>'
    + '<button class="iconbtn" data-act="calweek" data-n="7" aria-label="Next week">' + icon('chev') + '</button></div>';
  h += '<div class="arealegend">' + areasSorted().map(function (a) { return '<span><i style="background:' + esc(a.color) + '"></i>' + esc(a.short) + '</span>'; }).join('') + '</div>';
  h += '<div class="wk">' + range(7).map(function (i) {
    var d = addDays(mon, i), ts = tasksOn(d), hd = habitsSorted().filter(function (x) { return dueOn(x, d); }), hit = hd.filter(function (x) { return mark(x, d) === 1; }).length;
    return '<div class="wkday' + (d === t ? ' today' : '') + (d === sel ? ' sel' : '') + '"><button class="wkh" data-act="calday" data-d="' + d + '"><b>' + DOW[parseYmd(d).getDay()] + '</b><span>' + parseYmd(d).getDate() + '</span></button>'
      + '<div class="blocks">' + (ts.length ? ts.map(function (x) {
        return '<button class="blk' + (x.done ? ' done' : '') + '" style="--c:' + areaColor(x.area) + '" data-act="open" data-v="task" data-id="' + x.id + '">' + (x.time ? esc(fmtTime(x.time)) + ' ' : '') + esc(x.t) + '</button>';
      }).join('') : '<span class="faint small">Nothing planned</span>') + '</div>'
      + (hd.length && d <= t ? '<span class="hab small faint">' + hit + '/' + hd.length + ' habits</span>' : '') + '</div>';
  }).join('') + '</div>';
  return h;
}
function dayDetail(d) {
  var ts = tasksOn(d), j = entryFor(d), t = today();
  var hs = habitsSorted().filter(function (x) { return dueOn(x, d); });
  var h = '<section class="card" style="display:grid;gap:10px"><div class="sechead" style="margin:0"><h2>' + esc(shortDate(d)) + '</h2>'
    + '<span class="meta">' + ts.filter(function (x) { return !x.done; }).length + ' open</span></div>';
  h += ts.length ? '<div class="list">' + ts.map(taskRow).join('') + '</div>' : '<p class="note">Nothing due.</p>';
  h += '<form class="addstep" data-form="caladd" data-d="' + d + '"><label class="sr" for="caladd">Add a task on this day</label><input id="caladd" class="input" placeholder="Add a task on ' + esc(shortDate(d)) + '" autocomplete="off"><button class="btn soft" type="submit">Add</button></form>';
  if (hs.length && d <= t) h += '<div class="small muted">Habits: ' + hs.map(function (x) { var m = mark(x, d); return esc(x.ic) + (m === 1 ? '✓' : m === 2 ? '–' : '·'); }).join('  ') + '</div>';
  if (j && (j.mood || j.text)) h += '<button class="row" data-act="open" data-v="entry" data-id="' + j.id + '"><span class="grow"><div class="s">Journal' + (j.mood ? ' · ' + MOODS[j.mood][0] + ' ' + MOODS[j.mood][1] : '') + '</div><div class="t jt">' + esc(j.text || '') + '</div></span></button>';
  return h + '</section>';
}
ACTS.calmode = function (d) { cal.mode = d.v; render(); };
ACTS.calday = function (d) { cal.sel = d.d; render(); };
ACTS.calnav = function (d) {
  var f = parseYmd(cal.month); f.setMonth(f.getMonth() + (+d.n)); cal.month = ymd(f);

ACTS.form_caladd = function (d, f) {
  var inp = $('input', f), v = inp.value.trim(); if (!v) return; inp.value = '';

/* ── RANK ───────────────────────────────────────────────────────────────

function rankList(id) { return Store.get('ranks', id); }

        + '<div class="s">' + (l.order || []).length + ' ranked' + (p ? ' · <b style="color:var(--accent);font-weight:500">' + p + ' to rank</b>' : '') + (ti ? ' · #1 ' + esc(ti.t) : '') + ' ' + exPill(l) + '</div></span>' + icon('chev', 'sm chev') + '</button>';

/* The comparison sheet. */
var cmp = null; // {list, item, lo, hi, asked}
function startRanking(listId, itemId) {
  var l = rankList(listId), order = (l.order || []).filter(function (x) { return x !== itemId; });
  if (!order.length) { Store.patch('ranks', listId, { order: [itemId] }); toast('Added. The next one gets compared to it.'); return; }
  cmp = { list: listId, item: itemId, lo: 0, hi: order.length, asked: 0, total: Math.ceil(Math.log2(order.length + 1)) };
  askNext();
}
function askNext() {
  var l = rankList(cmp.list), order = (l.order || []).filter(function (x) { return x !== cmp.item; });
  if (cmp.lo >= cmp.hi) {
    order.splice(cmp.lo, 0, cmp.item); Store.patch('ranks', cmp.list, { order: order });
    var it = rankItem(l, cmp.item), pos = cmp.lo + 1, next = rankPending(rankList(cmp.list))[0];
    var listId = cmp.list; cmp = null;
    if (next) { toast(esc(it.t) + ' is #' + pos + '. Next one…'); startRanking(listId, next.id); }
    else { closeSheet(); toast(esc(it.t) + ' is #' + pos + ' of ' + order.length); }
    return;
  }
  var mid = (cmp.lo + cmp.hi) >> 1, a = rankItem(l, cmp.item), b = rankItem(l, order[mid]);
  cmp.mid = mid; cmp.asked++;
  var card = function (it, side) {
    return '<button class="vs" data-act="rankpick" data-s="' + side + '"><b>' + esc(it.t) + '</b>' + (it.year ? '<span>' + esc(it.year) + '</span>' : '')
      + (it.note ? '<small>' + esc(it.note) + '</small>' : '') + '</button>';
  };
  openSheet('<div class="shead"><h2>' + (l.kind === 'movies' ? 'Which was better?' : 'Which is better?') + '</h2><button class="iconbtn" data-act="rankstop" aria-label="Stop for now">' + icon('x') + '</button></div>'
    + '<p class="note small">Question ' + cmp.asked + ' of about ' + Math.max(cmp.asked, cmp.total) + '. Go with your gut.</p>'
    + '<div class="vsgrid">' + card(a, 'new') + '<span class="vsor">or</span>' + card(b, 'old') + '</div>'
    + '<button class="btn ghost block" data-act="rankpick" data-s="tie">Too close to call</button>', null, function () { cmp = null; });
}
ACTS.rankpick = function (d) {
  if (!cmp) return;

  sheetOnClose = null; askNext();
};
ACTS.rankstop = function () { cmp = null; closeSheet(); toast('Saved. The rest wait under "to rank".'); };
ACTS.rankitem = function (d) {

    + '<div class="btnrow"><button class="btn soft" data-act="rankmove" data-id="' + d.id + '" data-i="' + d.i + '" data-n="-1"' + (pos === 1 ? ' disabled' : '') + '>Move up</button>'
    + '<button class="btn soft" data-act="rankmove" data-id="' + d.id + '" data-i="' + d.i + '" data-n="1"' + (pos === (l.order || []).length ? ' disabled' : '') + '>Move down</button></div>'
    + '<div class="btnrow"><button class="btn accent" data-act="rerank" data-id="' + d.id + '" data-i="' + d.i + '">Rank it again</button>'
    + '<button class="btn ghost" style="color:var(--bad)" data-act="rankdel" data-id="' + d.id + '" data-i="' + d.i + '">Remove</button></div>',
    function (s) {
      $('#rinote', s).addEventListener('input', function (e) {

      });

    + '<div class="field"><label for="ls">Sets</label><input id="ls" class="input" name="sets" inputmode="numeric" value="' + esc(last ? last.sets : '3') + '"></div>'
    + '<div class="field"><label for="lr">Reps</label><input id="lr" class="input" name="reps" inputmode="numeric" value="' + esc(last ? last.reps : '8') + '"></div>'
    + '<button class="btn accent" type="submit">Log today</button></form>'
    + (last ? '<p class="note small">Last time: ' + esc(liftLine(last, e.unit)) + ' on ' + esc(shortDate(last.d)) + '. Same again counts.</p>' : '')
    + (log.length ? '<div class="list">' + log.slice().reverse().slice(0, 20).map(function (x, i) {
      return '<div class="row"><span class="grow"><div class="t">' + esc(liftLine(x, e.unit)) + '</div><div class="s">' + esc(shortDate(x.d)) + '</div></span>'
        + '<button class="iconbtn" data-act="delset" data-id="' + id + '" data-i="' + (log.length - 1 - i) + '" aria-label="Delete">' + icon('x', 'sm') + '</button></div>';
    }).join('') + '</div>' : '')
    + '<div class="btnrow"><button class="btn soft" data-act="liftunit" data-id="' + id + '">Switch to ' + (e.unit === 'kg' ? 'lb' : 'kg') + '</button><button class="btn ghost" style="color:var(--bad)" data-act="dellift" data-id="' + id + '">Delete</button></div>';
};
ACTS.form_logset = function (d, f) {
  var g = function (n) { return $('[name=' + n + ']', f).value.trim(); };
  var x = { d: today(), w: parseFloat(g('w')) || 0, sets: parseInt(g('sets'), 10) || 1, reps: parseInt(g('reps'), 10) || 1 };
  var e = Store.get('lifts', d.id);
  Store.patch('lifts', d.id, { log: (e.log || []).concat([x]), lastAt: Date.now() });

};
ACTS.delset = function (d) { var e = Store.get('lifts', d.id), log = (e.log || []).slice(); log.splice(+d.i, 1); Store.patch('lifts', d.id, { log: log }); };
ACTS.liftunit = function (d) { var e = Store.get('lifts', d.id); Store.patch('lifts', d.id, { unit: e.unit === 'kg' ? 'lb' : 'kg' }); };
ACTS.dellift = function (d) { var e = Store.get('lifts', d.id); Store.del('lifts', d.id); pop(); toast('Deleted', function () { Store.put('lifts', e); }); };

/* ── FOCUS TIMER ───────────────────────────────────────────────────── */
var TMODES = [['Focus', 25], ['Short break', 5], ['Long break', 15]];
var timerState = (function () { try { return JSON.parse(localStorage.getItem('mossos.timer') || 'null') || { m: 0, end: null, left: 1500, running: false }; } catch (e) { return { m: 0, end: null, left: 1500, running: false }; } })();
function timerSave() { try { localStorage.setItem('mossos.timer', JSON.stringify(timerState)); } catch (e) {} }
function timerLeft() { return timerState.running ? Math.max(0, Math.round((timerState.end - Date.now()) / 1000)) : timerState.left; }
var timerTick = null;
function timerLoop() {
  clearInterval(timerTick);
  if (!timerState.running) return;
  timerTick = setInterval(function () {
    var l = timerLeft(), el = $('#tclock');
    if (el) el.textContent = fmtSecs(l);
    if (l <= 0) {
      clearInterval(timerTick); timerState.running = false; timerState.left = TMODES[timerState.m][1] * 60; timerSave();
      if (timerState.m === 0) logEvent('Focused for ' + TMODES[0][1] + ' minutes');
      toast(timerState.m === 0 ? 'Focus done. Take five.' : 'Break over.');
      if (navigator.vibrate) navigator.vibrate(200);
      render();
    }
  }, 500);
}
function fmtSecs(s) { return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
TITLES.timer = 'Focus timer';
VIEWS.timer = function () {
  return '<div class="seg" role="tablist">' + TMODES.map(function (m, i) {
    return '<button role="tab" aria-selected="' + (timerState.m === i) + '" class="' + (timerState.m === i ? 'on' : '') + '" data-act="tmode" data-i="' + i + '">' + m[0] + '</button>';
  }).join('') + '</div>'
    + '<div class="timer"><div id="tclock" class="tclock" aria-live="off">' + fmtSecs(timerLeft()) + '</div>'
    + '<div class="btnrow"><button class="btn accent" data-act="tgo">' + (timerState.running ? 'Pause' : 'Start') + '</button><button class="btn soft" data-act="treset">Reset</button></div></div>'
    + '<p class="note">Keep MossOS open for the alert. If you leave, the time still counts down and you\'ll see where it got to when you come back.</p>';
};
VIEWS.timer.after = function () { timerLoop(); };
ACTS.tmode = function (d) { timerState = { m: +d.i, end: null, left: TMODES[+d.i][1] * 60, running: false }; timerSave(); render(); };
ACTS.tgo = function () {
  if (timerState.running) { timerState.left = timerLeft(); timerState.running = false; }
  else { timerState.end = Date.now() + timerState.left * 1000; timerState.running = true; }
  timerSave(); render();
};
ACTS.treset = function () { timerState = { m: timerState.m, end: null, left: TMODES[timerState.m][1] * 60, running: false }; timerSave(); render(); };

/* ── 21-when.js ── */
/* ═══ WHEN PICKER ═══════════════════════════════════════════════════
   From Miles's recording: a big time readout, a week strip of days (with
   a dot where other tasks already sit) that opens to a full month, and a
   ruler you drag sideways that snaps every 5 minutes. Presets, All day,
   and in-app reminders. pickWhen({due, time, remind, id}, onDone). */
var REMIND_OPTS = [[10080, '1 week'], [4320, '3 days'], [1440, '1 day'], [120, '2 hours'], [60, '1 hour'], [30, '30 min'], [15, '15 min']];
var TICK = 10;               // px per 5 minutes
var when = null;             // {due, time, remind, id, full, month, onDone}

function remindLabel(m) {
  var o = REMIND_OPTS.filter(function (x) { return x[0] === m; })[0]; if (o) return o[1];
  if (m % 10080 === 0) return (m / 10080) + ' weeks'; if (m % 1440 === 0) return (m / 1440) + ' days';
  if (m % 60 === 0) return (m / 60) + ' hours'; return m + ' min';
}
function hm(mins) { return String(Math.floor(mins / 60)).padStart(2, '0') + ':' + String(mins % 60).padStart(2, '0'); }
function mins(t) { var p = t.split(':'); return +p[0] * 60 + +p[1]; }
function longDate(s) { var d = parseYmd(s); return DOWL[d.getDay()] + ', ' + ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][d.getMonth()] + ' ' + d.getDate(); }
function busyOn(d, exceptId) { return Store.all('tasks').filter(function (t) { return t.due === d && !t.done && t.id !== exceptId; }).length; }

/* A month grid shared by the pickers. opts: {pick, nav, exceptId, ring} */
function monthGrid(month, sel, opts) {
  var first = parseYmd(month), lead = (first.getDay() + 6) % 7, days = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate(), t = today();
  var h = '<div class="calhead"><button type="button" class="iconbtn" data-act="' + opts.nav + '" data-n="-1" aria-label="Previous month">' + icon('back') + '</button>'
    + '<b>' + ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][first.getMonth()] + ' ' + first.getFullYear() + '</b>'
    + '<button type="button" class="iconbtn" data-act="' + opts.nav + '" data-n="1" aria-label="Next month">' + icon('chev') + '</button></div>'
    + '<div class="cal mini">' + ['M', 'T', 'W', 'T', 'F', 'S', 'S'].map(function (x) { return '<span class="wdh">' + x + '</span>'; }).join('');
  for (var i = 0; i < lead; i++) h += '<span></span>';
  for (var n = 1; n <= days; n++) {
    var d = month.slice(0, 8) + String(n).padStart(2, '0'), busy = busyOn(d, opts.exceptId);
    h += '<button type="button" class="day' + (d === t ? ' today' : '') + (d === sel ? ' sel' : '') + (d < t ? ' past' : '') + '" data-act="' + opts.pick + '" data-d="' + d + '" aria-label="' + esc(longDate(d)) + (busy ? ', ' + busy + ' other tasks' : '') + '">'
      + '<span class="n">' + n + '</span><span class="dots">' + (busy ? '<i style="background:var(--accent)"></i>' : '') + '</span></button>';
  }
  return h + '</div>';
}

function pickWhen(o, onDone) {
  when = { due: o.due || null, time: o.time || null, remind: (o.remind || []).slice(), id: o.id || null, full: false,
    month: (o.due || today()).slice(0, 8) + '01', onDone: onDone, title: o.title || 'When' };
  openSheet('<div id="whenbox"></div>', function () { whenPaint(); });
}
function whenPaint() {
  var w = when, t = today(), box = $('#whenbox'); if (!box || !w) return;
  var tm = w.time ? fmtTime(w.time) : null;
  var h = '<div class="shead"><h2>' + esc(w.title) + '</h2><button class="iconbtn" data-act="close" aria-label="Cancel">' + icon('x') + '</button></div>'
    + '<div class="readout" aria-live="polite"><div class="big2" id="wbig">' + (tm ? esc(tm.replace(/(am|pm)$/, '')) + '<small>' + tm.slice(-2).toUpperCase() + '</small>' : 'All day') + '</div>'
    + '<div class="muted">' + (w.due ? esc(longDate(w.due)) + (w.due === t ? ' · <b class="todaytag">today</b>' : '') : 'No date · Someday') + '</div></div>';
  // dates
  h += '<div class="wlab"><span>Date</span><button type="button" class="link" data-act="wfull">' + (w.full ? 'Hide month' : 'Full month') + '</button></div>'
    + '<div class="wstrip">' + range(7).map(function (i) {
      var d = addDays(t, i), busy = busyOn(d, w.id);
      return '<button type="button" class="wday' + (w.due === d ? ' on' : '') + '" data-act="wday" data-d="' + d + '" aria-pressed="' + (w.due === d) + '"><em>' + (i === 0 ? 'Today' : DOW[parseYmd(d).getDay()]) + '</em><b>' + parseYmd(d).getDate() + '</b><i' + (busy ? '' : ' class="none"') + '></i></button>';
    }).join('') + '<button type="button" class="wday some' + (!w.due ? ' on' : '') + '" data-act="wday" data-d="" aria-pressed="' + !w.due + '"><em>No</em><b>date</b><i class="none"></i></button></div>';
  if (w.full) h += '<div class="wmonth">' + monthGrid(w.month, w.due, { pick: 'wday', nav: 'wmonth', exceptId: w.id }) + '</div>';
  h += '<p class="note small">• dot = other tasks already that day</p>';
  // time ruler
  h += '<div class="wlab"><span>Time</span><span class="faint">5 min steps</span></div>'
    + '<div class="ruler' + (w.time ? '' : ' allday') + '" id="ruler" tabindex="0" role="slider" aria-label="Time" aria-valuemin="0" aria-valuemax="1435" aria-valuenow="' + (w.time ? mins(w.time) : 540) + '" aria-valuetext="' + esc(tm || 'All day') + '">'
    + '<div class="rstrip" id="rstrip">' + rulerTicks() + '</div><span class="rline" aria-hidden="true"></span></div>'
    + '<p class="note small" style="text-align:center">Drag the rail. It snaps every 5 minutes.</p>'
    + '<div class="scrollx">' + [['06:00'], ['09:00'], ['12:00'], ['17:00'], ['20:00'], ['', 'All day']].map(function (p) {
      var on = (p[0] || null) === (w.time || null);
      return '<button type="button" class="chip' + (on ? ' on' : '') + '" data-act="wpreset" data-t="' + p[0] + '">' + esc(p[1] || fmtTime(p[0]).replace(/^(\d+)(am|pm)$/, '$1:00$2').toUpperCase().replace(/(AM|PM)$/, ' $1')) + '</button>';
    }).join('') + '</div>';
  // reminders
  h += '<div class="wlab"><span>Remind me before' + (w.remind.length ? ' · ' + w.remind.length + ' set' : '') + '</span></div>'
    + '<div class="chips">' + REMIND_OPTS.map(function (r) {
      var on = w.remind.indexOf(r[0]) > -1;
      return '<button type="button" class="chip' + (on ? ' on' : '') + '" data-act="wremind" data-m="' + r[0] + '" aria-pressed="' + on + '">' + (on ? '✓ ' : '') + r[1] + '</button>';
    }).join('') + '</div>'
    + '<form class="addstep" data-form="wremindadd"><label class="sr" for="wrn">Custom reminder</label><input id="wrn" class="input" name="n" inputmode="numeric" placeholder="10" style="flex:0 0 72px">'
    + '<label class="sr" for="wru">Unit</label><select id="wru" name="u" class="input sel"><option value="1">min</option><option value="60" selected>hour</option><option value="1440">day</option><option value="10080">week</option></select>'
    + '<button class="btn soft" type="submit">Add</button></form>'
    + w.remind.filter(function (m) { return !REMIND_OPTS.some(function (r) { return r[0] === m; }); }).map(function (m) {
      return '<div class="remrow">🔔 ' + esc(remindLabel(m)) + ' before <button type="button" class="iconbtn" data-act="wremind" data-m="' + m + '" aria-label="Remove">' + icon('x', 'sm') + '</button></div>';
    }).join('')
    + '<p class="note small">Shown in Heads up on Today. Your phone won\'t ping: the Claude app can\'t send notifications.</p>';
  h += '<div class="btnrow"><button type="button" class="btn ghost" data-act="close">Cancel</button><button type="button" class="btn accent" data-act="wdone">Done</button></div>';
  box.innerHTML = h;
  wireRuler();
}
function rulerTicks() {
  var h = '';
  for (var m = 0; m < 1440; m += 5) {
    var cls = m % 60 === 0 ? 'hr' : m % 15 === 0 ? 'q' : '';
    h += '<i class="' + cls + '" style="left:' + (m / 5 * TICK) + 'px"></i>';
    if (m % 60 === 0) h += '<span style="left:' + (m / 5 * TICK) + 'px">' + fmtTime(hm(m)).toUpperCase().replace(/(AM|PM)$/, ' $1') + '</span>';
  }
  return h;
}
function wireRuler() {
  var r = $('#ruler'), strip = $('#rstrip'); if (!r) return;
  var cur = when.time ? mins(when.time) : 540, x0 = 0, base = 0, on = false, last = [], pid = null;
  var place = function (m, anim) { strip.style.transition = anim ? 'transform .25s cubic-bezier(.2,.8,.3,1)' : 'none'; strip.style.transform = 'translateX(' + (r.clientWidth / 2 - m / 5 * TICK) + 'px)'; };
  var setT = function (m, final) {
    m = Math.max(0, Math.min(1435, Math.round(m / 5) * 5)); cur = m;
    when.time = hm(m); r.classList.remove('allday');
    var tm = fmtTime(when.time); $('#wbig').innerHTML = esc(tm.replace(/(am|pm)$/, '')) + '<small>' + tm.slice(-2).toUpperCase() + '</small>';
    r.setAttribute('aria-valuenow', m); r.setAttribute('aria-valuetext', tm);
    if (final) { place(m, true); $$('[data-act=wpreset]').forEach(function (b) { b.classList.toggle('on', b.dataset.t === when.time); }); }
  };
  place(cur, false);
  r.addEventListener('pointerdown', function (e) { on = true; pid = e.pointerId; x0 = e.clientX; base = cur; last = [[e.clientX, e.timeStamp]]; try { r.setPointerCapture(pid); } catch (er) {} });
  r.addEventListener('pointermove', function (e) {
    if (!on || e.pointerId !== pid) return;
    var m = base - (e.clientX - x0) / TICK * 5; m = Math.max(0, Math.min(1435, m));
    strip.style.transition = 'none'; strip.style.transform = 'translateX(' + (r.clientWidth / 2 - m / 5 * TICK) + 'px)';
    setT(m, false); last.push([e.clientX, e.timeStamp]); if (last.length > 5) last.shift();
  });
  var end = function (e) {
    if (!on) return; on = false;
    // a flick carries on a little, then settles on the nearest 5 minutes
    var a = last[0], b = last[last.length - 1], v = b && a && b[1] > a[1] ? (b[0] - a[0]) / (b[1] - a[1]) : 0;
    var m = cur - (Math.abs(v) > 0.4 ? v * 140 / TICK * 5 : 0);
    if (Math.abs(e.clientX - x0) < 4 && last.length < 3) { var rect = r.getBoundingClientRect(); m = cur + (e.clientX - rect.left - rect.width / 2) / TICK * 5; }
    setT(m, true);
  };
  r.addEventListener('pointerup', end); r.addEventListener('pointercancel', end);
  r.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { e.preventDefault(); setT(cur + 5, true); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { e.preventDefault(); setT(cur - 5, true); }
  });
  addEventListener('resize', function () { if ($('#ruler')) place(cur, false); }, { once: true });
}
ACTS.wfull = function () { when.full = !when.full; whenPaint(); };
ACTS.wday = function (d) { when.due = d.d || null; if (d.d) when.month = d.d.slice(0, 8) + '01'; whenPaint(); };
ACTS.wmonth = function (d) { var f = parseYmd(when.month); f.setMonth(f.getMonth() + (+d.n)); when.month = ymd(f); whenPaint(); };
ACTS.wpreset = function (d) { when.time = d.t || null; whenPaint(); };
ACTS.wremind = function (d) { var m = +d.m, i = when.remind.indexOf(m); if (i > -1) when.remind.splice(i, 1); else when.remind.push(m); when.remind.sort(function (a, b) { return b - a; }); whenPaint(); };
ACTS.form_wremindadd = function (d, f) {
  var n = parseInt($('[name=n]', f).value, 10), u = +$('[name=u]', f).value; if (!n || n < 1) return;
  var m = n * u; if (when.remind.indexOf(m) < 0) when.remind.push(m); when.remind.sort(function (a, b) { return b - a; }); whenPaint();
};
ACTS.wdone = function () {
  var w = when; when = null; closeSheet();
  if (w && w.onDone) w.onDone({ due: w.due, time: w.time, remind: w.due ? w.remind : [] });
};

/* In-app reminders: tasks whose reminder window is open right now. */
function dueAt(t) { var d = parseYmd(t.due), p = (t.time || '09:00').split(':'); d.setHours(+p[0], +p[1], 0, 0); return d.getTime(); }
function remindersNow() {
  var now = Date.now();
  return Store.all('tasks').filter(function (t) {
    if (t.done || !t.due || !t.remind || !t.remind.length) return false;
    var at = dueAt(t); if (now >= at) return false;
    return t.remind.some(function (m) { return now >= at - m * 6e4; });
  }).sort(function (a, b) { return dueAt(a) - dueAt(b); });
}
function untilText(t) {
  var m = Math.round((dueAt(t) - Date.now()) / 6e4);
  if (m < 60) return 'in ' + m + ' min'; if (m < 1440) return 'in ' + Math.round(m / 60) + ' h';
  return shortDate(t.due).toLowerCase() === 'tomorrow' ? 'tomorrow' + (t.time ? ' at ' + fmtTime(t.time) : '') : 'in ' + Math.round(m / 1440) + ' days';
}

/* ═══ BOOT ══════════════════════════════════════════════════════════ */
try { var th = localStorage.getItem('mossos.theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
var hadCache = Store.init();
Store.on(function () { render(); });

/* First run: seed when there is truly nothing, after db has answered (or
   straight away when there is no db). Never seed over real data. */
function maybeSeed() {
  if (Store.get('meta', 'setup')) { upgradeSeed(); return; }
  if (Store.all('tasks').length || Store.all('areas').length) { Store.put('meta', { id: 'setup', seeded: Date.now(), examples: false }); return; }
  seedData();
}
Store.connect(maybeSeed).then(function (live) { if (!live) maybeSeed(); });
if (!hadCache && (!window.claude || !window.claude.use)) maybeSeed();
aiInit(); assetsInit(); timerLoop();
render(true);

/* A new day while the app stays open: repaint at midnight. */
(function tick() {
  var n = new Date(), next = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1, 0, 0, 5);
  setTimeout(function () { render(); tick(); }, next - n);
})();
