iewBox=\"0 0 24 24\">\u003cpath d=\"M19 10.5c.9.3 1.8 1 2 2.2M4.5 11.5C4.5 8 7.8 5.5 12 5.5c1.3 0 2.5.2 3.6.7l2.4-1.4-.4 3a5.6 5.6 0 0 1 1.4 3.7c0 2-1.1 3.7-2.9 4.8V20h-3v-1.6c-.7.1-1.4.1-2.1 0V20H8v-3.2c-2.1-1.1-3.5-3-3.5-5.3z\"/>\u003ccircle cx=\"15.5\" cy=\"10\" r=\".6\"/>\u003c/symbol>\n  \u003csymbol id=\"i-more\" viewBox=\"0 0 24 24\">\u003ccircle cx=\"5\" cy=\"12\" r=\"1.3\"/>\u003ccircle cx=\"12\" cy=\"12\" r=\"1.3\"/>\u003ccircle cx=\"19\" cy=\"12\" r=\"1.3\"/>\u003c/symbol>\n  \u003csymbol id=\"i-back\" viewBox=\"0 0 24 24\">\u003cpath d=\"M15 5 8 12l7 7\"/>\u003c/symbol>\n  \u003csymbol id=\"i-chev\" viewBox=\"0 0 24 24\">\u003cpath d=\"m9 6 6 6-6 6\"/>\u003c/symbol>\n  \u003csymbol id=\"i-x\" viewBox=\"0 0 24 24\">\u003cpath d=\"M6 6l12 12M18 6 6 18\"/>\u003c/symbol>\n  \u003csymbol id=\"i-lock\" viewBox=\"0 0 24 24\">\u003crect x=\"5\" y=\"10.5\" width=\"14\" height=\"10\" rx=\"2.5\"/>\u003cpath d=\"M8 10.5V7.5a4 4 0 0 1 8 0v3\"/>\u003c/symbol>\n  \u003csymbol id=\"i-copy\" viewBox=\"0 0 24 24\">\u003crect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2.5\"/>\u003cpath d=\"M16 8V5.5A1.5 1.5 0 0 0 14.5 4h-9A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8\"/>\u003c/symbol>\n  \u003csymbol id=\"i-ask\" viewBox=\"0 0 24 24\">\u003cpath d=\"M20.5 11.5a8.5 8.5 0 0 1-12.6 7.4L3 20.5l1.4-4.6a8.5 8.5 0 1 1 16.1-4.4z\"/>\u003cpath d=\"M9.8 9.5a2.3 2.3 0 0 1 4.4.8c0 1.5-2.2 2-2.2 2M12 15h.01\"/>\u003c/symbol>\n  \u003csymbol id=\"i-spark\" viewBox=\"0 0 24 24\">\u003cpath d=\"M12 3.5 13.9 9l5.6 1.9-5.6 1.9L12 18.5l-1.9-5.7-5.6-1.9L10.1 9z\"/>\u003c/symbol>\n  \u003csymbol id=\"i-stub\" viewBox=\"0 0 24 24\">\u003cpath d=\"M5 3.5h14v17l-2.3-1.5-2.4 1.5-2.3-1.5-2.3 1.5-2.4-1.5L5 20.5z\"/>\u003cpath d=\"M8.5 8h7M8.5 11.5h7M8.5 15h4\"/>\u003c/symbol>\n  \u003csymbol id=\"i-gear\" viewBox=\"0 0 24 24\">\u003ccircle cx=\"12\" cy=\"12\" r=\"3\"/>\u003cpath d=\"M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6\"/>\u003c/symbol>\n  \u003csymbol id=\"i-chart\" viewBox=\"0 0 24 24\">\u003cpath d=\"M4 20V4M4 20h16\"/>\u003cpath d=\"M8 16v-4M12 16V8M16 16v-6M20 16v-9\" stroke-width=\"2.2\"/>\u003c/symbol>\n  \u003csymbol id=\"i-link\" viewBox=\"0 0 24 24\">\u003cpath d=\"M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1\"/>\u003c/symbol>\n\u003c/svg>\n\n\u003cnav class=\"rail\" id=\"rail\" aria-label=\"Main\">\u003cdiv class=\"brand\">Payday\u003cspan>OS\u003c/span>\u003c/div>\u003c/nav>\n\n\u003cdiv class=\"shell\">\u003cdiv class=\"main\">\n  \u003cheader class=\"top\" id=\"top\">\n    \u003cbutton class=\"back\" onclick=\"go(prevView||'today')\" aria-label=\"Back\">\u003csvg class=\"i\">\u003cuse href=\"#i-back\"/>\u003c/svg>\u003c/button>\n    \u003ch1 id=\"title\">Today\u003c/h1>\n    \u003cbutton class=\"status\" id=\"status\" onclick=\"go('monarch')\">\u003ci>\u003c/i>\u003cspan id=\"statusTxt\">Screenshot data\u003c/span>\u003c/button>\n  \u003c/header>\n\n  \u003c!-- TODAY -->\n  \u003csection class=\"view on\" id=\"v-today\">\u003cdiv class=\"pad stack\">\n    \u003cdiv class=\"kicker\" id=\"tKicker\">\u003c/div>\n    \u003cdiv class=\"card\" id=\"checkinCard\">\u003c/div>\n    \u003cdiv class=\"card\" id=\"spendHero\">\u003c/div>\n    \u003cdiv class=\"card\" id=\"helpCard\" hidden>\u003cdiv class=\"chead\" style=\"margin-bottom:8px\">\u003ch2>How Payday OS works\u003c/h2>\u003cbutton class=\"link\" onclick=\"hideHelp()\">Got it\u003c/button>\u003c/div>\n      \u003col class=\"steps\" style=\"margin-top:0\">\u003cli>\u003cb>Friday:\u003c/b> your check lands. Payday OS pays the bills, savings and debt on paper first.\u003c/li>\u003cli>\u003cb>Every day:\u003c/b> the big green number is what you can spend out today. That's it.\u003c/li>\u003cli>\u003cb>Spend less\u003c/b> and some rolls to the weekend and some gets banked. \u003cb>Spend more\u003c/b> and the rest of the week shrinks.\u003c/li>\u003cli>Tap \u003cb>Month\u003c/b> to see every day, \u003cb>Budget\u003c/b> for the plan and advice.\u003c/li>\u003c/ol>\u003c/div>\n    \u003cdiv class=\"card\" id=\"payBanner\" hidden style=\"border-color:var(--warn)\">\u003c/div>\n    \u003cdiv class=\"dash\">\n      \u003cdiv class=\"col\">\n        \u003cdiv>\n          \u003cdiv class=\"stub\" id=\"stub\">\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"card\">\u003cdiv class=\"chead\">\u003ch2>Pay to pay\u003c/h2>\u003cbutton class=\"link\" onclick=\"go('calendar')\">Month →\u003c/button>\u003c/div>\u003cdiv class=\"small muted\" id=\"weekRange\" style=\"margin:-8px 0 8px\">\u003c/div>\u003cdiv class=\"week\" id=\"weekStrip\">\u003c/div>\n          \u003cdiv id=\"foodBox\" style=\"margin-top:14px\">\u003c/div>\u003cdiv id=\"weekPva\">\u003c/div>\u003c/div>\n        \u003cdiv class=\"card\">\u003cdiv class=\"chead\">\u003ch2>Friday checklist\u003c/h2>\u003cspan class=\"frac\" id=\"ckFrac\">\u003c/span>\u003c/div>\u003cdiv class=\"list\" id=\"checklist\">\u003c/div>\n          \u003cdiv class=\"small muted\" style=\"margin-top:10px\">Resets by itself every Friday.\u003c/div>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"col\">\n        \u003cdiv class=\"card\">\u003cdiv class=\"chead\">\u003ch2>Debt ladder\u003c/h2>\u003cbutton class=\"link\" onclick=\"go('debts')\">Details\u003c/button>\u003c/div>\u003cdiv class=\"small muted\" id=\"ladderLead\" style=\"margin:-6px 0 8px\">\u003c/div>\u003cdiv class=\"ladder\" id=\"ladderMini\">\u003c/div>\u003c/div>\n        \u003cdiv class=\"card\" id=\"savMini\">\u003c/div>\n        \u003cdiv class=\"card\">\u003cdiv class=\"chead\">\u003ch2>Bills, saved before they're due\u003c/h2>\u003cbutton class=\"link\" onclick=\"go('calendar')\">Month\u003c/button>\u003c/div>\u003cdiv class=\"list\" id=\"billsList\">\u003c/div>\u003c/div>\n        \u003cbutton class=\"card\" style=\"text-align:left;display:flex;gap:12px;align-items:center\" onclick=\"go('ask')\">\u003csvg class=\"i\" style=\"color:var(--accent)\">\u003cuse href=\"#i-ask\"/>\u003c/svg>\u003cdiv class=\"grow\">\u003cdiv style=\"font-weight:650\">Ask about this week\u003c/div>\u003cdiv class=\"small muted\">What to pay first, what you can afford, how fast SoFi goes\u003c/div>\u003c/div>\u003csvg class=\"i muted\">\u003cuse href=\"#i-chev\"/>\u003c/svg>\u003c/button>\n      \u003c/div>\n    \u003c/div>\n    \u003cp class=\"note\" style=\"text-align:center;margin:8px auto 0\">Planning estimates. Confirm balances and due dates before paying.\u003c/p>\n  \u003c/div>\u003c/section>\n\n  \u003c!-- PLAN -->\n  \u003csection class=\"view\" id=\"v-plan\">\u003cdiv class=\"pad stack narrow\">\n    \u003cdiv class=\"card\">\n      \u003cdiv class=\"kicker\">This week's check\u003c/div>\n      \u003cdiv style=\"margin-top:6px\" id=\"checkSrc\">\u003c/div>\n      \u003cdiv class=\"field\" style=\"margin-top:10px\">\u003clabel for=\"checkInput\">Different amount? Type it here (blank = use Monarch)\u003c/label>\u003cinput id=\"checkInput\" type=\"number\" inputmode=\"decimal\" min=\"0\" step=\"0.01\" placeholder=\"Use Monarch\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"card\" style=\"text-align:center\">\n      \u003cdiv class=\"kicker\">Food + fun this week\u003c/div>\n      \u003cdiv class=\"display good\" style=\"font-size:40px;margin-top:8px\" id=\"walletSafe\">—\u003c/div>\n      \u003cdiv class=\"note\" style=\"margin:8px auto 0\" id=\"walletSub\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"seg\" id=\"walletBars\">\u003c/div>\n    \u003cdiv class=\"card\" style=\"padding:4px 16px\">\u003cdiv class=\"list\" id=\"walletTable\">\u003c/div>\u003c/div>\n    \u003cdiv class=\"card\" style=\"display:grid;gap:12px\">\n      \u003ch2>Daily allowance\u003c/h2>\n      \u003cdiv class=\"note\" style=\"margin-top:-6px\">Your daily number for eating out, snacks and drinks, including gas-station runs. Groceries, gas, bills and fun have their own lines and never shrink it.\u003c/div>\n      \u003cdiv class=\"field\">\u003clabel for=\"grocInput\">Groceries set aside per week ($) · spend it whenever, tracked by the month\u003c/label>\u003cinput id=\"grocInput\" type=\"number\" inputmode=\"decimal\" min=\"0\" step=\"5\">\u003c/div>\n      \n      \u003cdiv class=\"field\">\u003clabel>Days I work: tap to cycle Off → Truck → Safeway\u003c/label>\u003cdiv class=\"dchips\" id=\"workDays\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"field\">\u003clabel for=\"workW\">Truck days (food on the go) get: \u003cb id=\"workLbl\">\u003c/b>\u003c/label>\u003cinput id=\"workW\" type=\"range\" min=\"1\" max=\"3\" step=\"0.25\">\u003c/div>\n      \u003cdiv class=\"field\">\u003clabel>Days that count as the weekend\u003c/label>\u003cdiv class=\"dchips\" id=\"wkndDays\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"field\">\u003clabel for=\"wkndW\">Weekend days get: \u003cb id=\"wkndLbl\">\u003c/b>\u003c/label>\u003cinput id=\"wkndW\" type=\"range\" min=\"1\" max=\"3\" step=\"0.25\">\u003c/div>\n      \u003cdiv class=\"note\" id=\"allowPreview\">\u003c/div>\n      \u003cdiv class=\"field\">\u003clabel for=\"floorInput\">On a short week, protect at least \u003cb id=\"floorLbl\">\u003c/b> of allowance\u003c/label>\u003cinput id=\"floorInput\" type=\"range\" min=\"0.5\" max=\"1\" step=\"0.05\">\u003c/div>\n      \u003cdiv class=\"field\">\u003clabel for=\"rollIn\">Unspent money that rolls forward: \u003cb id=\"rollLbl\">\u003c/b>\u003c/label>\u003cinput id=\"rollIn\" type=\"range\" min=\"0\" max=\"1\" step=\"0.1\">\u003c/div>\n      \u003cdiv class=\"note\">The rest of anything you don&rsquo;t spend gets banked for savings. Bills and savings come first, then a floor for food, then your extra debt payment.\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"card\" style=\"display:grid;gap:12px\">\n      \u003ch2>Budget lines (per week)\u003c/h2>\n      \u003clabel class=\"row\" style=\"padding:4px 0;border:0\">\u003cinput class=\"ck\" type=\"checkbox\" id=\"sideOnCk\" onchange=\"state.sideOn=this.checked;persist();rerender()\">\u003cdiv class=\"grow\">\u003cdiv class=\"t\">I've started at Safeway\u003c/div>\u003cdiv class=\"s\">Until then, the plan uses only your EMT check. Turns on by itself when a Safeway paycheck shows up in Monarch.\u003c/div>\u003c/div>\u003c/label>\n      \u003clabel class=\"row\" style=\"padding:4px 0;border:0\">\u003cinput class=\"ck\" type=\"checkbox\" id=\"sideDebtCk\" onchange=\"state.sideToDebt=this.checked;persist();rerender()\">\u003cdiv class=\"grow\">\u003cdiv class=\"t\">Send all Safeway pay to debt\u003c/div>\u003cdiv class=\"s\">Live on the EMT check. Safeway goes straight to the card you're attacking. If the EMT check comes up short, Safeway covers the basics first.\u003c/div>\u003c/div>\u003c/label>\n      \u003cdiv class=\"field\">\u003clabel for=\"bl-side\">Safeway / side income (weekly avg)\u003c/label>\u003cinput id=\"bl-side\" data-k=\"sideIncome\" type=\"number\" inputmode=\"decimal\" min=\"0\" step=\"1\">\u003c/div>\n      \u003cdiv class=\"field\">\u003clabel for=\"bl-minx\">Always pay at least this much extra to debt each week (least important lines get trimmed first: fun → Wins/Trip/Holiday funds → clothing → car fund → misc → allowance down to 80% → savings)\u003c/label>\u003cinput id=\"bl-minx\" data-k=\"minExtra\" type=\"number\" inputmode=\"decimal\" min=\"0\" step=\"5\">\u003c/div>\n      \u003cdiv class=\"field\">\u003clabel for=\"bl-raise\">Raise rule base (your normal EMT check). When a check comes in 10%+ above this, half the difference goes to debt/goals and half to allowance + fun.\u003c/label>\u003cinput id=\"bl-raise\" data-k=\"raiseBase\" type=\"number\" inputmode=\"decimal\" min=\"0\" step=\"10\">\u003c/div>\n      \u003cdiv class=\"field\">\u003clabel for=\"bl-pt\">Physical therapy (per week)\u003c/label>\u003cinput id=\"bl-pt\" data-k=\"ptBudget\" type=\"number\" inputmode=\"decimal\" min=\"0\" step=\"5\">\u003c/div>\n      \u003cdiv class=\"field\">\u003clabel for=\"bl-hair\">Haircut (per week · $55 every 2 weeks = $27.50)\u003c/label>\u003cinput id=\"bl-hair\" data-k=\"haircut\" type=\"number\" inputmode=\"decimal\" min=\"0\" step=\"0.5\">\u003c/div>\n      \u003cdiv class=\"field\">\u003clabel for=\"bl-out\">Daily allowance (eating out, snacks, drinks) per week\u003c/label>\u003cinput id=\"bl-out\" data-k=\"outTarget\" type=\"number\" inputmode=\"decimal\" min=\"0\" step=\"5\">\u003c/div>\n      \u003cdiv class=\"field\">\u003clabel for=\"bl-date\">Date fund (weekends)\u003c/label>\u003cinput id=\"bl-date\" data-k=\"dateFund\" type=\"number\" inputmode=\"decimal\" min=\"0\" step=\"5\">\u003c/div>\n      \u003cdiv class=\"field\">\u003clabel for=\"bl-cloth\">Clothing (per week, protected)\u003c/label>\u003cinput id=\"bl-cloth\" data-k=\"clothBudget\" type=\"number\" inputmode=\"decimal\" min=\"0\" step=\"5\">\u003c/div>\n      \u003cdiv class=\"field\">\u003clabel for=\"bl-misc\">Misc needs: toiletries, random stuff (per week, protected)\u003c/label>\u003cinput id=\"bl-misc\" data-k=\"miscBudget\" type=\"number\" inputmode=\"decimal\" min=\"0\" step=\"5\">\u003c/div>\n      \u003cdiv class=\"field\">\u003clabel for=\"bl-rest\">Restaurant: sit-down and takeout meals (per week, protected, separate from your allowance)\u003c/label>\u003cinput id=\"bl-rest\" data-k=\"restBudget\" type=\"number\" inputmode=\"decimal\" min=\"0\" step=\"5\">\u003c/div>\n      \u003cdiv class=\"field\">\u003clabel for=\"bl-fun\">Fun & shopping (doesn't touch your allowance)\u003c/label>\u003cinput id=\"bl-fun\" data-k=\"funBudget\" type=\"number\" inputmode=\"decimal\" min=\"0\" step=\"5\">\u003c/div>\n      \u003cdiv class=\"field\">\u003clabel for=\"bl-floor\">Soda floor: every day gets at least\u003c/label>\u003cinput id=\"bl-floor\" data-k=\"sodaFloor\" type=\"number\" inputmode=\"decimal\" min=\"0\" step=\"1\">\u003c/div>\n      \u003cdiv class=\"field\">\u003clabel for=\"bl-gas\">Gas\u003c/label>\u003cinput id=\"bl-gas\" data-k=\"gasBudget\" type=\"number\" inputmode=\"decimal\" min=\"0\" step=\"5\">\u003c/div>\n      \u003cdiv class=\"field\">\u003clabel for=\"bl-bills\">Insurance, phone, subscriptions\u003c/label>\u003cinput id=\"bl-bills\" data-k=\"billsBudget\" type=\"number\" inputmode=\"decimal\" min=\"0\" step=\"1\">\u003c/div>\n      \u003cdiv class=\"field\">\u003clabel for=\"bl-health\">Health\u003c/label>\u003cinput id=\"bl-health\" data-k=\"healthBudget\" type=\"number\" inputmode=\"decimal\" min=\"0\" step=\"5\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"card\" style=\"display:grid;gap:12px\">\n      \u003ch2>Your targets\u003c/h2>\n      \u003cdiv class=\"field\" hidden>\u003clabel for=\"payInput\">Target weekly pay ($)\u003c/label>\u003cinput id=\"payInput\" type=\"number\" inputmode=\"decimal\" min=\"0\" step=\"25\">\u003c/div>\n      \u003cdiv class=\"field\">\u003clabel for=\"extraInput\">Extra debt payment goal each Friday ($)\u003c/label>\u003cinput id=\"extraInput\" type=\"number\" inputmode=\"decimal\" min=\"0\" step=\"25\">\u003c/div>\n      \u003cdiv class=\"field\">\u003clabel for=\"savingsInput\">Emergency savings each Friday ($)\u003c/label>\u003cinput type=\"number\" id=\"savingsInput\" inputmode=\"decimal\" min=\"0\" step=\"10\">\u003c/div>\n      \u003cdiv class=\"field\">\u003clabel for=\"bufferInput\">Cushion for surprises ($/week)\u003c/label>\u003cinput id=\"bufferInput\" type=\"number\" inputmode=\"decimal\" min=\"0\" step=\"25\">\u003c/div>\n      \u003cdiv class=\"note\">The target drives your debt-free date and long-range numbers. Each week's real plan uses the check that actually landed. Saves as you type, on every device.\u003c/div>\n    \u003c/div>\n  \u003c/div>\u003c/section>\n\n  \u003c!-- BUDGET -->\n  \u003csection class=\"view\" id=\"v-budget\">\u003cdiv class=\"pad stack\">\n    \u003cdiv class=\"segctl btabs\" style=\"grid-template-columns:repeat(2,1fr)\">\u003cbutton id=\"bt-plan\" class=\"on\" onclick=\"setBTab('plan')\">My budget\u003c/button>\u003cbutton id=\"bt-ai\" onclick=\"setBTab('ai')\">AI suggestions\u003c/button>\u003c/div>\n    \u003cdiv id=\"bAI\" hidden>\u003c/div>\n    \u003cdiv class=\"dash\" id=\"bPlanDash\">\n      \u003cdiv class=\"col\">\n        \u003cdiv class=\"card\">\u003cdiv class=\"kicker\">Built on your Friday check\u003c/div>\u003ch2 style=\"margin-top:4px;font-size:21px\">Every dollar has a job\u003c/h2>\n          \u003cdiv class=\"segctl\" hidden style=\"grid-template-columns:repeat(2,1fr);margin-top:12px\">\u003cbutton id=\"bm-week\" onclick=\"setBudgetMode('week')\">\u003c/button>\u003cbutton id=\"bm-goal\" onclick=\"setBudgetMode('goal')\">\u003c/button>\u003c/div>\n          \u003cdiv class=\"lines\" id=\"bIncome\" style=\"margin-top:12px\">\u003c/div>\n          \u003cdiv class=\"seg\" id=\"bBar\" style=\"margin-top:12px\">\u003c/div>\n          \u003cdiv id=\"bRows\">\u003c/div>\n          \u003cdiv id=\"bApply\" style=\"margin-top:14px\">\u003c/div>\u003c/div>\n        \u003cdiv class=\"card\" hidden>\u003cdiv id=\"bAdj\">\u003c/div>\u003c/div>\n        \u003cdiv class=\"card\" hidden style=\"border-color:#c9a227\">\u003cdiv class=\"kicker\" style=\"color:#a6831a\">Gold standard\u003c/div>\u003ch2 style=\"margin-top:4px\">This week vs a $1,000 week\u003c/h2>\u003cdiv id=\"bGold\" style=\"margin-top:8px\">\u003c/div>\u003c/div>\n        \u003cdiv class=\"card\">\u003cdiv class=\"kicker\">Your allowance\u003c/div>\u003ch2 style=\"margin-top:4px\">What you can spend out each day\u003c/h2>\u003cdiv id=\"bAllow\" style=\"margin-top:12px\">\u003c/div>\u003c/div>\n        \u003cdiv class=\"card\">\u003cdiv class=\"kicker\">Put Fridays on autopilot\u003c/div>\u003ch2 style=\"margin-top:4px\">Set it once in SoFi\u003c/h2>\u003cdiv id=\"bAuto\" style=\"margin-top:8px\">\u003c/div>\u003c/div>\n        \u003cdiv class=\"card\">\u003cdiv class=\"kicker\">Your goals, in order\u003c/div>\u003cdiv class=\"list\" id=\"bGoals\" style=\"margin-top:4px\">\u003c/div>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"col\">\n        \u003cdiv class=\"card\">\u003cdiv class=\"kicker\">Your habits · Monarch\u003c/div>\u003ch2 style=\"margin-top:4px\">Where there&rsquo;s room to improve\u003c/h2>\u003cdiv id=\"bHabits\" style=\"margin-top:8px\">\u003c/div>\u003cdiv id=\"bOther\" style=\"margin-top:10px\">\u003c/div>\u003c/div>\n        \u003cdiv class=\"card\">\u003cdiv class=\"kicker\">Advice\u003c/div>\u003ch2 style=\"margin-top:4px\">What the research says for you\u003c/h2>\u003cdiv id=\"bAdvice\" style=\"margin-top:4px\">\u003c/div>\u003c/div>\n        \u003cdiv class=\"card flat\">\u003cdiv class=\"kicker\">Sources\u003c/div>\u003col class=\"srcs\" id=\"bSources\">\u003c/ol>\u003cdiv class=\"note\" style=\"margin-top:8px\">Planning guidance, not professional financial advice.\u003c/div>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\u003c/section>\n\n  \u003c!-- CALENDAR -->\n  \u003csection class=\"view\" id=\"v-calendar\">\u003cdiv class=\"pad stack narrow\">\n    \u003cdiv class=\"card\">\n      \u003cdiv class=\"calhead\">\u003cbutton class=\"iconbtn\" onclick=\"changeMonth(-1)\" aria-label=\"Previous month\">\u003csvg class=\"i\" style=\"transform:scaleX(-1)\">\u003cuse href=\"#i-chev\"/>\u003c/svg>\u003c/button>\u003ch2 id=\"calTitle\">\u003c/h2>\u003cbutton class=\"iconbtn\" onclick=\"changeMonth(1)\" aria-label=\"Next month\">\u003csvg class=\"i\">\u003cuse href=\"#i-chev\"/>\u003c/svg>\u003c/button>\u003c/div>\n      \u003cdiv class=\"cal\" id=\"calGrid\" style=\"margin-top:8px\">\u003c/div>\n      \u003cdiv class=\"small muted\" style=\"margin-top:10px\">\u003cspan class=\"legend\" style=\"background:var(--good)\">\u003c/span>Payday &nbsp; \u003cspan class=\"legend\" style=\"background:var(--accent)\">\u003c/span>Bill due\u003c/div>\u003cdiv class=\"small muted\" style=\"margin-top:4px\">Under each date: \u003cspan class=\"good\">green\u003c/span> = stayed under, \u003cspan class=\"bad\">red\u003c/span> = went over, gray = planned. Weekends are underlined. Tap a day for the details.\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"card\">\u003ch2 id=\"dayTitle\">\u003c/h2>\u003cdiv id=\"dayEvents\">\u003c/div>\u003c/div>\n    \u003cdiv class=\"card\">\u003cdiv class=\"chead\">\u003ch2>Pay weeks\u003c/h2>\u003cspan class=\"small muted\">Fri – Thu\u003c/span>\u003c/div>\u003cdiv id=\"weekRows\" style=\"display:grid;gap:8px\">\u003c/div>\u003c/div>\n    \u003cdiv class=\"card flat\">\u003ch2 style=\"margin-bottom:4px\">This month in numbers\u003c/h2>\u003cdiv class=\"list\" id=\"monthStats\">\u003c/div>\u003c/div>\n    \u003cdiv class=\"warnnote\">Bill dates repeat monthly from your Nov 2026 statements (Apple Card on the last day of each month). Later months are projections. Boost and Hulu dates aren't confirmed.\u003c/div>\n  \u003c/div>\u003c/section>\n\n  \u003c!-- DEBTS -->\n  \u003csection class=\"view\" id=\"v-debts\">\u003cdiv class=\"pad stack\">\n    \u003cdiv class=\"dash\">\n      \u003cdiv class=\"col\">\n        \u003cdiv class=\"card tele\" id=\"debtTele\">\u003c/div>\n        \u003cdiv class=\"card freehero\">\u003cdiv class=\"kicker\">Debt-free by\u003c/div>\u003cdiv class=\"display\" id=\"freeDate\">\u003c/div>\u003cdiv class=\"note\" id=\"freeSub\">\u003c/div>\u003cbutton class=\"btn accent block\" style=\"margin-top:12px\" onclick=\"go('roadmap')\">Open the roadmap\u003c/button>\u003c/div>\n        \u003cdiv class=\"card\">\u003cdiv class=\"chead\">\u003ch2>The ladder\u003c/h2>\u003cspan class=\"small muted\">Highest APR first\u003c/span>\u003c/div>\u003cdiv class=\"ladder\" id=\"ladderFull\">\u003c/div>\n          \u003cdiv class=\"note\" style=\"margin-top:8px\">Extra money goes to the top card. When it's paid off, its minimum and the extra roll down to the next one.\u003c/div>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"col\">\n        \u003cdiv class=\"card\" style=\"display:grid;gap:14px\">\n          \u003cdiv>\u003cdiv class=\"kicker\" id=\"debtInfo\">\u003c/div>\u003ch2 id=\"debtName\" style=\"font-size:22px;margin-top:4px\">\u003c/h2>\u003cdiv class=\"small good\" id=\"debtPct\">\u003c/div>\u003c/div>\n          \u003cdiv class=\"stat3\">\u003cdiv>\u003cb id=\"debtBalance\">\u003c/b>\u003cspan>balance\u003c/span>\u003c/div>\u003cdiv>\u003cb id=\"debtApr\">\u003c/b>\u003cspan>APR\u003c/span>\u003c/div>\u003cdiv>\u003cb id=\"payoffWeek\">\u003c/b>\u003cspan>on the plan\u003c/span>\u003c/div>\u003c/div>\n          \u003cdiv class=\"segctl\">\u003cbutton id=\"pt-f\" class=\"on\" onclick=\"ptab('f')\">Forecast\u003c/button>\u003cbutton id=\"pt-m\" onclick=\"ptab('m')\">Milestones\u003c/button>\u003c/div>\n          \u003cdiv id=\"pf\" style=\"display:grid;gap:12px\">\n            \u003csvg id=\"debtChart\" class=\"chart\" viewBox=\"0 0 600 250\" role=\"img\" aria-label=\"Balance forecast over 52 weeks\">\u003c/svg>\n            \u003cinput id=\"forecastExtra\" type=\"hidden\" value=\"0\">\n            \u003cdiv class=\"field\">\u003clabel>Pay it off by\u003c/label>\u003cdiv class=\"chips\" id=\"dtChips\">\u003c/div>\u003c/div>\n            \u003cdiv id=\"dtResult\">\u003c/div>\n            \u003cdiv class=\"note\" id=\"payoffText\">\u003c/div>\n            \u003cdiv style=\"overflow-x:auto\">\u003ctable id=\"weeklyTable\">\u003c/table>\u003c/div>\n          \u003c/div>\n          \u003cdiv id=\"pm\" hidden style=\"display:grid;gap:12px\">\n            \u003cdiv class=\"grid3\" id=\"pmGrid\">\u003c/div>\n            \u003cdiv class=\"btnrow\">\u003cdiv class=\"field\" style=\"flex:1\">\u003cinput id=\"simAmount\" type=\"number\" inputmode=\"decimal\" min=\"1\" step=\"25\" value=\"150\" aria-label=\"Simulated payment\">\u003c/div>\u003cbutton class=\"btn\" onclick=\"simulatePayment()\">Simulate\u003c/button>\u003cbutton class=\"btn soft\" onclick=\"resetSimulation()\">Reset\u003c/button>\u003c/div>\n            \u003cdiv class=\"note\" id=\"simNote\">\u003c/div>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\u003c/section>\n\n  \u003c!-- SAVINGS -->\n  \u003csection class=\"view\" id=\"v-savings\">\u003cdiv class=\"pad stack\">\n    \u003cdiv class=\"dash\">\n      \u003cdiv class=\"col\">\n        \u003cdiv class=\"card\">\n          \u003cdiv class=\"chead\" style=\"margin-bottom:0\">\u003cdiv class=\"kicker\" id=\"savSource\">Emergency fund\u003c/div>\u003c/div>\n          \u003cdiv class=\"display big-amt\" id=\"savBal\" style=\"margin-top:8px\">\u003c/div>\n          \u003cdiv class=\"note\" id=\"savSub\" style=\"margin-top:8px\">\u003c/div>\n          \u003cdiv class=\"gauge\" id=\"savGauge\">\u003ci id=\"savBar\">\u003c/i>\u003c/div>\n          \u003cdiv class=\"chips\" id=\"savChips\">\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"card\">\n          \u003csvg id=\"savChart\" class=\"chart\" viewBox=\"0 0 600 250\" role=\"img\" aria-label=\"Savings history and projection\">\u003c/svg>\n          \u003cdiv class=\"small muted\" style=\"margin-top:6px\">\u003cspan class=\"legend\" style=\"background:var(--good)\">\u003c/span>Saved &nbsp; \u003cspan class=\"legend\" style=\"background:var(--good);opacity:.4\">\u003c/span>Projection &nbsp; \u003cspan class=\"legend\" style=\"background:var(--warn)\">\u003c/span>Goals\u003c/div>\n          \u003cdiv class=\"field\" style=\"margin-top:12px\">\u003clabel for=\"savWhat\">If you save every Friday: \u003cb id=\"savWhatLbl\">\u003c/b>\u003c/label>\u003cinput id=\"savWhat\" type=\"range\" min=\"0\" max=\"200\" step=\"10\" oninput=\"renderSavings()\">\u003c/div>\n          \u003cdiv class=\"stat3\" id=\"savStats\" style=\"margin-top:12px\">\u003c/div>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"col\">\n        \u003cdiv class=\"card\">\u003ch2>Goals\u003c/h2>\u003cdiv class=\"list\" id=\"savGoals\">\u003c/div>\u003c/div>\n        \u003cdiv class=\"card\">\u003ch2>Funds for known costs\u003c/h2>\u003cdiv class=\"note\" style=\"margin-top:4px\">Money set aside each Friday for things you know are coming, so they never wreck a week.\u003c/div>\u003cdiv class=\"list\" id=\"fundList\">\u003c/div>\u003cdiv class=\"note\" style=\"margin-top:8px\">Name a SoFi Vault \"Holidays\" or \"Car\" and Payday OS reads its real balance from Monarch.\u003c/div>\u003c/div>\n        \u003cdiv class=\"card\">\u003ch2 id=\"depTitle\">Log a deposit\u003c/h2>\u003cdiv class=\"note\" id=\"depNote\" style=\"margin-top:4px\">\u003c/div>\n          \u003cdiv class=\"btnrow\" id=\"depForm\" style=\"margin-top:10px\">\u003cdiv class=\"field\" style=\"flex:1\">\u003cinput id=\"depAmt\" type=\"number\" inputmode=\"decimal\" min=\"1\" step=\"5\" aria-label=\"Deposit amount\">\u003c/div>\u003cbutton class=\"btn\" onclick=\"logDeposit()\">Add\u003c/button>\u003c/div>\n          \u003cdiv class=\"list\" id=\"depList\">\u003c/div>\u003c/div>\n        \u003cdiv class=\"field\">\u003clabel for=\"apyInput\">Savings account APY (%)\u003c/label>\u003cinput id=\"apyInput\" type=\"number\" inputmode=\"decimal\" min=\"0\" max=\"20\" step=\"0.1\">\u003c/div>\n        \u003cdiv class=\"note\">Projection assumes no withdrawals and weekly compounding at the APY you enter.\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\u003c/section>\n\n  \u003c!-- DATA -->\n  \u003csection class=\"view\" id=\"v-data\">\u003cdiv class=\"pad stack\">\n    \u003cdiv class=\"dash\">\n      \u003cdiv class=\"col\">\n        \u003cdiv class=\"card\">\u003cdiv class=\"chead\">\u003ch2>Plan vs actual\u003c/h2>\u003c/div>\n          \u003cdiv class=\"segctl\" style=\"grid-template-columns:repeat(3,1fr)\">\u003cbutton id=\"pva-week\" onclick=\"setPva('week')\">This week\u003c/button>\u003cbutton id=\"pva-last\" onclick=\"setPva('last')\">Last week\u003c/button>\u003cbutton id=\"pva-month\" onclick=\"setPva('month')\">This month\u003c/button>\u003c/div>\n          \u003cdiv class=\"small muted\" id=\"pvaLabel\" style=\"margin-top:10px\">\u003c/div>\n          \u003cdiv id=\"pvaRows\">\u003c/div>\u003cdiv id=\"pvaTotal\" style=\"display:grid;gap:6px;margin-top:12px\">\u003c/div>\n          \u003cdiv style=\"border-top:1.5px dashed var(--line);margin-top:14px;padding-top:12px\" id=\"pvaPay\">\u003c/div>\u003c/div>\n        \u003cdiv class=\"card\">\u003cdiv class=\"kicker\">Interest you'll save\u003c/div>\u003cdiv class=\"display hero-num good\" id=\"dSaved\" style=\"margin-top:8px\">\u003c/div>\n          \u003cdiv class=\"note\" id=\"dSavedSub\" style=\"margin-top:10px\">\u003c/div>\n          \u003cdiv class=\"chips\" style=\"margin-top:12px\">\u003cspan class=\"chip\" id=\"dWeeks\">\u003c/span>\u003cspan class=\"chip\">vs. paying only minimums\u003c/span>\u003c/div>\u003c/div>\n        \u003cdiv class=\"card\">\u003cdiv class=\"chead\">\u003ch2>Total debt over time\u003c/h2>\u003c/div>\n          \u003csvg id=\"dChart\" class=\"chart\" viewBox=\"0 0 600 250\" role=\"img\" aria-label=\"Total debt with your plan versus minimums only\">\u003c/svg>\n          \u003cdiv class=\"small muted\" style=\"margin-top:6px\">\u003cspan class=\"legend\" style=\"background:var(--accent)\">\u003c/span>Your plan &nbsp; \u003cspan class=\"legend\" style=\"background:var(--muted)\">\u003c/span>Minimums only &nbsp; \u003cspan class=\"legend\" style=\"background:var(--good);opacity:.4\">\u003c/span>Interest you skip\u003c/div>\u003c/div>\n        \u003cdiv class=\"card\">\u003cdiv class=\"chead\">\u003ch2>Card by card\u003c/h2>\u003cspan class=\"small muted\">Interest paid under your plan\u003c/span>\u003c/div>\u003cdiv style=\"overflow-x:auto\">\u003ctable id=\"dTable\">\u003c/table>\u003c/div>\n          \u003cdiv class=\"note\" style=\"margin-top:10px\">Estimates assume no new charges and fixed minimums. Real card minimums shrink as balances drop, so paying only minimums would cost even more than shown.\u003c/div>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"col\">\n        \u003cdiv class=\"card\">\u003cdiv class=\"kicker\">Interest costing you right now\u003c/div>\u003cdiv style=\"display:flex;align-items:baseline;gap:8px;margin-top:8px\">\u003cdiv class=\"display\" style=\"font-size:38px\" id=\"dNowTotal\">\u003c/div>\u003cspan class=\"muted\">per month\u003c/span>\u003c/div>\u003cdiv class=\"note\" id=\"dNowSub\" style=\"margin-top:6px\">\u003c/div>\u003cdiv class=\"list\" id=\"dNowBars\" style=\"margin-top:8px\">\u003c/div>\u003c/div>\n        \u003cdiv class=\"card\">\u003cdiv class=\"kicker\">Once you're debt-free\u003c/div>\u003cdiv class=\"display good\" style=\"font-size:38px;margin-top:8px\" id=\"dFreed\">\u003c/div>\u003cdiv class=\"note\" id=\"dFreedSub\" style=\"margin-top:6px\">\u003c/div>\n          \u003ch2 style=\"margin-top:16px\">Rollover timeline\u003c/h2>\u003cdiv class=\"list\" id=\"dRoll\">\u003c/div>\u003c/div>\n        \u003cdiv class=\"card\">\u003cdiv class=\"kicker\">Monarch · this month\u003c/div>\u003ch2 id=\"dSpendHead\" style=\"margin-top:6px\">\u003c/h2>\u003cdiv class=\"small\" id=\"dSpendFood\" style=\"margin-top:6px\">\u003c/div>\u003cdiv class=\"list\" id=\"dSpend\" style=\"margin-top:6px\">\u003c/div>\u003cdiv class=\"note\" id=\"dSpendNote\" style=\"margin-top:8px\">\u003c/div>\u003c/div>\n        \u003cdiv class=\"card\" id=\"dCashCard\" hidden>\u003cdiv class=\"kicker\">Cash across your accounts\u003c/div>\u003cdiv class=\"display\" style=\"font-size:34px;margin-top:8px\" id=\"dCash\">\u003c/div>\u003cdiv class=\"list\" id=\"dCashList\" style=\"margin-top:6px\">\u003c/div>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\u003c/section>\n\n  \u003c!-- MORE -->\n  \u003csection class=\"view\" id=\"v-roadmap\">\u003cdiv class=\"pad stack\">\n    \u003cdiv class=\"dash\">\u003cdiv class=\"col\">\n      \u003cdiv class=\"card freehero\" id=\"rmHero\">\u003c/div>\n      \u003cdiv class=\"card\">\u003cdiv class=\"chead\">\u003ch2>Kill order\u003c/h2>\u003cspan class=\"small muted\">Highest rate first\u003c/span>\u003c/div>\u003cdiv id=\"rmTimeline\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"card\" id=\"rmFreed\">\u003c/div>\n      \u003cdiv class=\"card\" id=\"rmWins\">\u003c/div>\n    \u003c/div>\u003cdiv class=\"col\">\n      \u003cdiv class=\"card\" id=\"rmDecision\">\u003c/div>\n      \u003cdiv class=\"card\" id=\"rmIra\">\u003c/div>\n      \u003cdiv class=\"card\" id=\"rmGoals\">\u003c/div>\n    \u003c/div>\u003c/div>\n  \u003c/div>\u003c/section>\n  \u003csection class=\"view\" id=\"v-food\">\u003cdiv class=\"pad stack narrow\">\n    \u003cdiv class=\"card\" id=\"fHead\">\u003c/div>\n    \u003cdiv class=\"segctl ftabs\" style=\"grid-template-columns:repeat(4,1fr)\">\u003cbutton data-f=\"plan\" onclick=\"setFTab('plan')\">Meals\u003c/button>\u003cbutton data-f=\"list\" onclick=\"setFTab('list')\">List\u003c/button>\u003cbutton data-f=\"compare\" onclick=\"setFTab('compare')\">Compare\u003c/button>\u003cbutton data-f=\"hauls\" onclick=\"setFTab('hauls')\">Hauls\u003c/button>\u003c/div>\n    \u003cdiv id=\"fBody\" style=\"display:grid;gap:14px\">\u003c/div>\n  \u003c/div>\u003c/section>\n  \u003csection class=\"view\" id=\"v-more\">\u003cdiv class=\"pad stack narrow\">\n    \u003cdiv class=\"card\" style=\"padding:4px 16px\">\u003cdiv class=\"list\">\n      \u003cbutton class=\"row\" onclick=\"go('calendar')\">\u003csvg class=\"i\">\u003cuse href=\"#i-cal\"/>\u003c/svg>\u003cdiv class=\"grow\">\u003cdiv class=\"t\">Month\u003c/div>\u003cdiv class=\"s\">Every day's food money, spending and bills\u003c/div>\u003c/div>\u003csvg class=\"i muted\">\u003cuse href=\"#i-chev\"/>\u003c/svg>\u003c/button>\n      \u003cbutton class=\"row\" onclick=\"go('roadmap')\">\u003csvg class=\"i\">\u003cuse href=\"#i-ladder\"/>\u003c/svg>\u003cdiv class=\"grow\">\u003cdiv class=\"t\">Roadmap\u003c/div>\u003cdiv class=\"s\">Card kill dates, decision day, wins, big buys, Roth IRA\u003c/div>\u003c/div>\u003csvg class=\"i muted\">\u003cuse href=\"#i-chev\"/>\u003c/svg>\u003c/button>\n      \u003cbutton class=\"row\" onclick=\"openAfford()\">\u003csvg class=\"i\">\u003cuse href=\"#i-ask\"/>\u003c/svg>\u003cdiv class=\"grow\">\u003cdiv class=\"t\">Can I afford this?\u003c/div>\u003cdiv class=\"s\">Check any price against your week and your debt plan\u003c/div>\u003c/div>\u003csvg class=\"i muted\">\u003cuse href=\"#i-chev\"/>\u003c/svg>\u003c/button>\n      \u003cbutton class=\"row\" onclick=\"go('sort')\">\u003csvg class=\"i\">\u003cuse href=\"#i-spark\"/>\u003c/svg>\u003cdiv class=\"grow\">\u003cdiv class=\"t\">Sort purchases\u003c/div>\u003cdiv class=\"s\">Swipe gas-station runs, cash and big-store trips into the right bucket\u003c/div>\u003c/div>\u003csvg class=\"i muted\">\u003cuse href=\"#i-chev\"/>\u003c/svg>\u003c/button>\n      \u003cbutton class=\"row\" onclick=\"go('savings')\">\u003csvg class=\"i\">\u003cuse href=\"#i-piggy\"/>\u003c/svg>\u003cdiv class=\"grow\">\u003cdiv class=\"t\">Savings\u003c/div>\u003cdiv class=\"s\">Emergency fund, goals, deposits\u003c/div>\u003c/div>\u003csvg class=\"i muted\">\u003cuse href=\"#i-chev\"/>\u003c/svg>\u003c/button>\n      \u003cbutton class=\"row\" onclick=\"go('data')\">\u003csvg class=\"i\">\u003cuse href=\"#i-chart\"/>\u003c/svg>\u003cdiv class=\"grow\">\u003cdiv class=\"t\">Data\u003c/div>\u003cdiv class=\"s\">Plan vs actual, interest saved, spending\u003c/div>\u003c/div>\u003csvg class=\"i muted\">\u003cuse href=\"#i-chev\"/>\u003c/svg>\u003c/button>\n      \u003cbutton class=\"row\" onclick=\"go('plan')\">\u003csvg class=\"i\">\u003cuse href=\"#i-stub\"/>\u003c/svg>\u003cdiv class=\"grow\">\u003cdiv class=\"t\">Plan this Friday\u003c/div>\u003cdiv class=\"s\">Pay, extra payment, cushion, food, savings\u003c/div>\u003c/div>\u003csvg class=\"i muted\">\u003cuse href=\"#i-chev\"/>\u003c/svg>\u003c/button>\n      \u003cbutton class=\"row\" onclick=\"go('ask')\">\u003csvg class=\"i\">\u003cuse href=\"#i-ask\"/>\u003c/svg>\u003cdiv class=\"grow\">\u003cdiv class=\"t\">Ask Payday\u003c/div>\u003cdiv class=\"s\">Step-by-step answers from your plan\u003c/div>\u003c/div>\u003csvg class=\"i muted\">\u003cuse href=\"#i-chev\"/>\u003c/svg>\u003c/button>\n      \u003cbutton class=\"row\" onclick=\"go('future')\">\u003csvg class=\"i\">\u003cuse href=\"#i-spark\"/>\u003c/svg>\u003cdiv class=\"grow\">\u003cdiv class=\"t\">What if\u003c/div>\u003cdiv class=\"s\">See how a bigger check changes things\u003c/div>\u003c/div>\u003csvg class=\"i muted\">\u003cuse href=\"#i-chev\"/>\u003c/svg>\u003c/button>\n      \u003cbutton class=\"row\" onclick=\"go('monarch')\">\u003csvg class=\"i\">\u003cuse href=\"#i-link\"/>\u003c/svg>\u003cdiv class=\"grow\">\u003cdiv class=\"t\">Monarch\u003c/div>\u003cdiv class=\"s\" id=\"setMon\">Connect for live balances\u003c/div>\u003c/div>\u003csvg class=\"i muted\">\u003cuse href=\"#i-chev\"/>\u003c/svg>\u003c/button>\n      \u003cbutton class=\"row\" onclick=\"go('settings')\">\u003csvg class=\"i\">\u003cuse href=\"#i-gear\"/>\u003c/svg>\u003cdiv class=\"grow\">\u003cdiv class=\"t\">Settings and data\u003c/div>\u003cdiv class=\"s\" id=\"syncMini\">\u003c/div>\u003c/div>\u003csvg class=\"i muted\">\u003cuse href=\"#i-chev\"/>\u003c/svg>\u003c/button>\n    \u003c/div>\u003c/div>\n  \u003c/div>\u003c/section>\n\n  \u003c!-- FUTURE -->\n  \u003csection class=\"view\" id=\"v-future\">\u003cdiv class=\"pad stack narrow\">\n    \u003cdiv class=\"card\">\u003cdiv class=\"kicker\">Extra debt each Friday\u003c/div>\u003cdiv class=\"display big-amt\" id=\"futureResult\" style=\"margin-top:8px\">\u003c/div>\u003cdiv class=\"note\" id=\"futureDescription\" style=\"margin-top:8px\">\u003c/div>\u003c/div>\n    \u003cdiv class=\"field\">\u003clabel for=\"futurePay\">Weekly paycheck: \u003cb id=\"futurePayLabel\">\u003c/b>\u003c/label>\u003cinput id=\"futurePay\" type=\"range\" min=\"750\" max=\"1200\" step=\"25\" value=\"1000\" oninput=\"renderFuture()\">\u003c/div>\n    \u003cdiv class=\"field\">\u003clabel for=\"futureExtra\">Extra debt cap: \u003cb id=\"futureExtraLabel\">\u003c/b>\u003c/label>\u003cinput id=\"futureExtra\" type=\"range\" min=\"0\" max=\"350\" step=\"25\" value=\"150\" oninput=\"renderFuture()\">\u003c/div>\n    \u003cdiv class=\"card\" style=\"padding:4px 16px\">\u003cdiv class=\"list\">\n      \u003cdiv class=\"row\">\u003cdiv class=\"grow\">\u003cdiv class=\"t\">Debt-free by\u003c/div>\u003cdiv class=\"s\" id=\"futureFreeTxt\">\u003c/div>\u003c/div>\u003cdiv class=\"amt\" id=\"futureFree\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"row\">\u003cdiv class=\"grow\">\u003cdiv class=\"t\">Interest saved vs minimums\u003c/div>\u003cdiv class=\"s\" id=\"futureIntTxt\">\u003c/div>\u003c/div>\u003cdiv class=\"amt good\" id=\"futureInt\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"row\">\u003cdiv class=\"grow\">\u003cdiv class=\"t\">SoFi Credit Card gone in\u003c/div>\u003cdiv class=\"s\" id=\"futureWeeksText\">\u003c/div>\u003c/div>\u003cdiv class=\"amt\" id=\"futureWeeks\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"row\">\u003cdiv class=\"grow\">\u003cdiv class=\"t\">Emergency fund hits $1,000\u003c/div>\u003cdiv class=\"s\" id=\"futureSavings\">\u003c/div>\u003c/div>\u003cdiv class=\"amt\" id=\"futureSavingsN\">\u003c/div>\u003c/div>\n    \u003c/div>\u003c/div>\n    \u003cdiv class=\"note\">Protects a $100 weekly cushion. Not a day-by-day cash flow or amortization schedule.\u003c/div>\n  \u003c/div>\u003c/section>\n\n  \u003c!-- ASK -->\n  \u003csection class=\"view\" id=\"v-ask\">\u003cdiv class=\"pad narrow\">\n    \u003cdiv class=\"qa stack\" id=\"dm\">\u003c/div>\n    \u003cdiv class=\"composer\">\n      \u003cdiv class=\"quick\" id=\"quick\">\u003c/div>\n      \u003cform onsubmit=\"event.preventDefault();ask('custom')\">\u003cinput id=\"askInput\" type=\"text\" placeholder=\"e.g. What if I earn $900 Friday?\" autocomplete=\"off\">\u003cbutton class=\"btn accent\" type=\"submit\">Ask\u003c/button>\u003c/form>\n    \u003c/div>\n  \u003c/div>\u003c/section>\n\n  \u003c!-- SORT -->\n  \u003csection class=\"view\" id=\"v-sort\">\u003cdiv class=\"pad stack narrow\">\n    \u003cdiv class=\"note\">Swipe each purchase, or tap a button. \u003cb>Right\u003c/b> = allowance (food, snacks, drinks) · \u003cb>Left\u003c/b> = gas for the car · \u003cb>Up\u003c/b> = groceries · \u003cb>Down\u003c/b> = need / other.\u003c/div>\n    \u003cdiv id=\"sortProg\">\u003c/div>\n    \u003cdiv class=\"deck\" id=\"sortDeck\">\u003c/div>\n    \u003clabel class=\"toggle\" id=\"sortRem\">\u003cinput type=\"checkbox\" id=\"sortRemCb\" onchange=\"sortRemember=this.checked\">\u003cspan id=\"sortRemTxt\">Always sort this store this way\u003c/span>\u003c/label>\n    \u003cdiv class=\"sbtns\" id=\"sortBtns\">\u003c/div>\n    \u003cdiv class=\"card flat\">\u003ch2>Your store rules\u003c/h2>\u003cdiv class=\"list\" id=\"sortRules\" style=\"margin-top:6px\">\u003c/div>\u003c/div>\n  \u003c/div>\u003c/section>\n\n  \u003c!-- MONARCH -->\n  \u003csection class=\"view\" id=\"v-monarch\">\u003cdiv class=\"pad stack narrow\">\n    \u003cdiv class=\"card\">\u003cdiv class=\"row\" style=\"padding:0;border:0;align-items:flex-start\">\u003cdiv class=\"mono-badge\">M\u003c/div>\u003cdiv class=\"grow\">\u003cdiv class=\"t\">\u003cspan class=\"legend\" id=\"liveDot\" style=\"background:var(--line)\">\u003c/span>\u003cspan id=\"liveStatus\">Connecting to Monarch…\u003c/span>\u003c/div>\u003cdiv class=\"s\" id=\"liveSub\">\u003c/div>\u003c/div>\u003cbutton class=\"btn soft\" id=\"liveBtn\" onclick=\"liveAction()\" hidden style=\"min-height:36px;padding:0 12px\">Refresh\u003c/button>\u003c/div>\u003c/div>\n    \u003cdiv class=\"card\" id=\"liveMapWrap\" hidden>\u003ch2>Your Monarch accounts\u003c/h2>\u003cdiv class=\"note\" style=\"margin-top:4px\">Matched automatically. Change any match and it saves to all your devices.\u003c/div>\u003cdiv class=\"list\" id=\"liveMap\">\u003c/div>\u003c/div>\n    \u003cdiv class=\"warnnote\" id=\"hiddenNote\" hidden>\u003c/div>\n    \u003cdiv class=\"note\">Payday OS only reads from Monarch. It never moves money or edits anything there.\u003c/div>\n    \u003cdiv class=\"card flat\" style=\"display:grid;gap:12px\">\n      \u003ch2>Backup: import Monarch files\u003c/h2>\n      \u003cdiv>\u003cdiv class=\"t\" id=\"monStatus\" style=\"font-weight:600\">\u003c/div>\u003cdiv class=\"small muted\" id=\"monSub\">\u003c/div>\u003c/div>\n      \u003col class=\"steps\">\u003cli>On your MacBook, open Monarch on the web and go to \u003cb>Settings → Data\u003c/b>.\u003c/li>\u003cli>Download \u003cb>account balances\u003c/b> (and \u003cb>transactions\u003c/b> if you like).\u003c/li>\u003cli>Choose the files below. Your iPhone picks up the changes on its own.\u003c/li>\u003c/ol>\n      \u003clabel class=\"btn soft block\" for=\"monFiles\" style=\"background:var(--surface)\">Choose Monarch CSV files\u003c/label>\u003cinput id=\"monFiles\" class=\"vh\" type=\"file\" accept=\".csv,text/csv\" multiple>\n      \u003cdiv id=\"monMapWrap\" hidden>\u003cdiv class=\"note\">Match each imported account.\u003c/div>\u003cdiv class=\"list\" id=\"monMap\">\u003c/div>\u003c/div>\n      \u003cbutton class=\"btn soft\" id=\"monClear\" onclick=\"clearMonarch()\" hidden style=\"background:var(--surface)\">Remove imported files\u003c/button>\n    \u003c/div>\n  \u003c/div>\u003c/section>\n\n  \u003c!-- SETTINGS -->\n  \u003csection class=\"view\" id=\"v-settings\">\u003cdiv class=\"pad stack narrow\">\n    \u003cdiv class=\"card\" style=\"padding:4px 16px\">\u003cdiv class=\"list\">\n      \u003cdiv class=\"row\">\u003cspan class=\"legend\" id=\"syncDot\" style=\"background:var(--line)\">\u003c/span>\u003cdiv class=\"grow\">\u003cdiv class=\"t\" id=\"syncTxt\">Checking sync…\u003c/div>\u003cdiv class=\"s\" id=\"syncSub\">\u003c/div>\u003c/div>\u003c/div>\n      \u003cbutton class=\"row\" onclick=\"exportData()\">\u003csvg class=\"i\">\u003cuse href=\"#i-copy\"/>\u003c/svg>\u003cdiv class=\"grow\">\u003cdiv class=\"t\">Copy backup (JSON)\u003c/div>\u003cdiv class=\"s\">Paste it into Notes to keep a copy\u003c/div>\u003c/div>\u003c/button>\n      \u003cbutton class=\"row\" id=\"resetBtn\" onclick=\"resetAll()\" style=\"color:var(--bad)\">\u003csvg class=\"i\">\u003cuse href=\"#i-x\"/>\u003c/svg>\u003cdiv class=\"grow\">\u003cdiv class=\"t\" id=\"resetTxt\">Reset all data\u003c/div>\u003c/div>\u003c/button>\n    \u003c/div>\u003c/div>\n    \u003cdiv class=\"card\">\u003ch2>Where the numbers come from\u003c/h2>\u003cdiv class=\"list\">\n      \u003cdiv class=\"row\">\u003cspan class=\"legend\" style=\"background:var(--good)\">\u003c/span>\u003cdiv class=\"grow small\">Balances: Monarch when connected, otherwise your screenshots\u003c/div>\u003c/div>\n      \u003cdiv class=\"row\">\u003cspan class=\"legend\" style=\"background:var(--warn)\">\u003c/span>\u003cdiv class=\"grow small\">Due dates: statement snapshots. Confirm current statements.\u003c/div>\u003c/div>\n      \u003cdiv class=\"row\">\u003cspan class=\"legend\" style=\"background:var(--line)\">\u003c/span>\u003cdiv class=\"grow small\">No payments, transfers or bank logins happen here\u003c/div>\u003c/div>\n    \u003c/div>\u003c/div>\n  \u003c/div>\u003c/section>\n\u003c/div>\u003c/div>\n\n\u003cnav class=\"tabs\" id=\"tabs\" aria-label=\"Main\">\u003c/nav>\n\u003cdiv class=\"toast\" id=\"toast\" role=\"status\" hidden>\u003c/div>\n\u003cbutton class=\"budfab\" id=\"budFab\" onclick=\"openBuddy()\" aria-label=\"Chat with Benji\">\u003c/button>\n\u003cdiv class=\"sheetbg\" id=\"budSheet\" hidden onclick=\"if(event.target===this)closeBuddy()\">\u003cdiv class=\"sheet budsheet\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"budName\">\n  \u003cdiv class=\"budhead\">\u003cdiv class=\"budav\" id=\"budAv\">B\u003c/div>\u003cdiv class=\"grow\">\u003cbutton class=\"budnm\" onclick=\"renameBuddy()\">\u003cspan id=\"budName\">Benji\u003c/span> \u003cspan class=\"small muted\">✎\u003c/span>\u003c/button>\u003cinput id=\"budNameIn\" class=\"affname\" hidden maxlength=\"20\" onchange=\"setBuddyName(this.value)\" onblur=\"setBuddyName(this.value)\" style=\"margin:2px 0 0;height:34px\">\u003cdiv class=\"small muted\" id=\"budSub\">Your money buddy\u003c/div>\u003c/div>\u003cbutton class=\"link\" onclick=\"clearBuddy()\" style=\"margin-right:12px\">Clear\u003c/button>\u003cbutton class=\"link\" onclick=\"closeBuddy()\">Done\u003c/button>\u003c/div>\n  \u003cdiv class=\"budlog\" id=\"budLog\">\u003c/div>\n  \u003cdiv class=\"chips budchips\" id=\"budChips\">\u003c/div>\n  \u003cform class=\"budform\" onsubmit=\"event.preventDefault();buddySend($('budIn').value)\">\u003ctextarea id=\"budIn\" rows=\"1\" placeholder=\"Text your buddy…\" onkeydown=\"if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();buddySend(this.value)}\">\u003c/textarea>\u003cbutton class=\"btn accent\" id=\"budSend\" type=\"submit\">Send\u003c/button>\u003cbutton class=\"btn soft\" id=\"budStop\" type=\"button\" hidden onclick=\"stopBuddy()\">Stop\u003c/button>\u003c/form>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"sheetbg\" id=\"planSheet\" hidden onclick=\"if(event.target===this)closePlanner()\">\u003cdiv class=\"sheet\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"planT\">\u003cdiv class=\"sheethead\">\u003ch2 id=\"planT\">Move money\u003c/h2>\u003cbutton class=\"link\" onclick=\"closePlanner()\">Done\u003c/button>\u003c/div>\u003cdiv id=\"planSum\">\u003c/div>\u003cdiv id=\"coinBoard\" style=\"margin-top:14px\">\u003c/div>\u003cdiv id=\"planRows\" style=\"margin-top:12px\">\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"sheetbg\" id=\"daySheet\" hidden onclick=\"if(event.target===this)closeDay()\">\u003cdiv class=\"sheet\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"dayST\">\u003cdiv class=\"sheethead\">\u003ch2 id=\"dayST\">\u003c/h2>\u003cbutton class=\"link\" onclick=\"closeDay()\">Done\u003c/button>\u003c/div>\u003cdiv id=\"daySB\">\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"sheetbg\" id=\"affSheet\" hidden onclick=\"if(event.target===this)closeAfford()\">\u003cdiv cl Miles's money buddy inside Payday OS, his budgeting app. Miles is 22, an EMT doing interfacility transports (on the truck ~3 shifts a week) and about to start ~16 hrs/week as a closing manager at Safeway. He's ~$25k in debt and locked in on getting out, while still living: his girlfriend (a teacher; weekend dates, sometimes split), travel, an apartment after the high-interest cards die (fall 2027), physical therapy and getting in shape for the police academy (applying 2027). He's told you he has ADHD, so keep things light, concrete and low-friction.\n\nHow you talk: his hype-man friend texting him. Fun, warm, a little playful (light roasts when he's being silly, never mean), real about the numbers, never preachy, never shaming. Match his vibe lightly (\"fr\", \"locked in\", \"ong\") without overdoing it; an emoji now and then is fine. Short: 1-3 sentences unless he asks for detail. Throw him small quests (\"pack lunch Tue + Thu and the weekend gets +$12\"). Real rewards (pay yourself): his Rewards vault gets $5 every Friday plus +$1 for each day under allowance, +$5 per 7-day check-in streak, 10% of any wishlist item he skips, +$2 for the Friday routine; he can spend it on anything, guilt-free (he has ${money(rewardAvail())} unlocked, ${state.streak.n}-day streak). Hype that when it fits. Never mention XP or levels. Use his real numbers from the snapshot. Give ONE clear next step when there is one. Celebrate wins (a card dying, a day under). If he messed up, help him reset: what it cost, what to do next, move on.\n\nHow the plan works (don't recite it, use it): every Friday the actual EMT deposit is split: rent, a Bills vault that saves each bill before it's due, gas, health, haircut, PT, savings, groceries, date fund, the daily allowance (eating out, snacks, gas-station drinks; weekends bigger; never below the soda floor; 50% of unspent rolls forward, 50% banked), funds (Holidays, Car, Subscription, Rewards vault), fun money, then extra debt to the highest-APR card n or takeout, its own weekly line), fun = fun (flexible), cloth = clothing/shoes, misc = small needs like toiletries, groc = groceries, gas = fuel, big = big purchase outside any budget. Returns a verdict, details, hours of work it costs, and whether the 72-hour rule applies.',inputSchema:{type:'object',properties:{amount:{type:'number'},kind:{type:'string',enum:['allow','rest','fun','groc','gas','cloth','misc','big']}},required:['amount','kind']},\n   execute:i=>{let a=Number(i.amount),k=B.concat('big').includes(String(i.kind))?String(i.kind):'big';if(!(a>0))throw new Error('amount must be > 0');let r=affordCheck(a,k);return {verdict:r.title,level:r.level,details:r.lines.map(l=>l.replace(/\u003c[^>]+>/g,'')),hoursOfWork:Math.round(r.hours*10)/10,wait72hours:r.wait}}},\n  {name:'log_purchase',description:'Logs a purchase he just made so it counts toward his week immediately; it auto-matches the Monarch transaction when it syncs. Returns what is left today and this week.',inputSchema:{type:'object',properties:{amount:{type:'number'},merchant:{type:'string'},bucket:{type:'string',enum:B},note:{type:'string'}},required:['amount','merchant','bucket']},\n   execute:i=>{let a=Number(i.amount);if(!(a>0))throw new Error('amount must be > 0');let b=B.includes(String(i.bucket))?String(i.bucket):'allow',id=Date.now().toString(36);state.quickLog.push({id,date:iso(today()),amt:Math.round(a*100)/100,merchant:String(i.merchant||'Purchase').slice(0,60),bucket:b,note:String(i.note||'').slice(0,200)});state.quickLog=state.quickLog.slice(-60);state.txCat['q'+id]=b;persist();let gx=award(5,'logged a purchase',true);let A=allowance();return {logged:true,xpEarned:gx,bucket:BUCKET_NAMES[b],leftToday:Math.round(A.leftToday),leftUntilFriday:Math.round(A.weekLeft),funLeft:Math.round(A.wp.fun-A.tot.fun)}}},\n  {name:'add_note',description:'Adds his context to a purchase already in recentPurchases (by id), and optionally re-files it into the right bucket.',inputSchema:{type:'object',properties:{tx_id:{type:'string'},note:{type:'string'},bucket:{type:'string',enum:B}},required:['tx_id','note']},\n   execute:i=>{let id=String(i.tx_id),t=(live&&live.tx||[]).find(x=>x.id===id);if(!t)throw new Error('No purchase with that id in recentPurchases');state.txNotes[id]=String(i.note).slice(0,200);if(B.includes(String(i.bucket))){state.txCat[id]=String(i.bucket);state.sortCount=(state.sortCount||0)+1}persist();award(3,'added context',true);return {saved:true,xpEarned:3,purchase:t.merchant+' $'+(-t.amount).toFixed(2)}}},\n  {name:'remember',description:'Saves a lasting fact or preference about his money habits so you know it next time (e.g. \"Sheetz runs under $15 are shift snacks\").',inputSchema:{type:'object',properties:{fact:{type:'string'}},required:['fact']},\n   execute:i=>{let f=String(i.fact).slice(0,160);if(!state.buddyMem.includes(f))state.buddyMem.push(f);state.buddyMem=state.buddyMem.slice(-40);persist();award(2,'taught Benji',true);return {remembered:f,xpEarned:2}}},\n  {name:'save_to_wishlist',description:'Adds something he wants to the wishlist (72-hour rule) instead of buying now.',inputSchema:{type:'object',properties:{name:{type:'string'},amount:{type:'number'},kind:{type:'string',enum:['fun','big']}},required:['name','amount']},\n   execute:i=>{let a=Number(i.amount);if(!(a>0))throw new Error('amount must be > 0');state.wish.unshift({id:Date.now().toString(36),name:String(i.name).slice(0,60),amt:a,kind:i.kind==='fun'?'fun':'big',at:Date.now()});state.wish=state.wish.slice(0,12);persist();award(5,'waited instead of buying',true);return {saved:true,xpEarned:5,decideAfter:'72 hours'}}}]}\nfunction mdLite(t){return esc(t).replace(/\\*\\*(.+?)\\*\\*/g,'\u003cb>$1\u003c/b>').replace(/\\n/g,'\u003cbr>')}\nfunction openBuddy(prefill){$('budSheet').hidden=false;document.body.style.overflow='hidden';renderBuddy();if(prefill!=null){let el=$('budIn');el.value=prefill;setTimeout(()=>{el.focus();el.setSelectionRange(el.value.length,el.value.length)},60)}}\nfunction closeBuddy(){$('budSheet').hidden=true;document.body.style.overflow=''}\nfunction renameBuddy(){let el=$('budNameIn');el.hidden=!el.hidden;el.value=state.buddyName;if(!el.hidden)el.focus()}\nfunction setBuddyName(v){v=String(v||'').trim().slice(0,20);if(v){state.buddyName=v;persist()}$('budNameIn').hidden=true;renderBuddy()}\nfunction renderBuddy(){let n=state.buddyName;$('budName').textContent=n;$('budAv').innerHTML=benjiSVG(bud.busy?'wow':benjiMood(),44);$('budSub').textContent=`🔥 ${state.streak.n}-day streak · ${money(rewardAvail())} reward wallet`;\n  let msgs=state.chat.length?state.chat:[{role:'assistant',content:`Yo Miles, I'm ${n}. I can see your week, your allowance, every purchase and the debt plan. Text me like a friend: \"can I get the $40 shoes?\", \"just spent $12 at Sheetz on a Monster\", \"why am I at $9 today?\", or \"talk me down\". I'll keep it real and keep it short.`}];\n  $('budLog').innerHTML=msgs.map(m=>`\u003cdiv class=\"bub ${m.role==='user'?'me':'them'}\">${mdLite(m.content)}\u003c/div>`).join('')+(bud.busy?`\u003cdiv class=\"bub them typing\" id=\"budLive\">${bud.live?mdLite(bud.live):'\u003cspan class=\"dots\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/span>'}\u003c/div>`:'');\n  let fri=[4,5].includes(today().getDay());\n  $('budChips').innerHTML=[...(fri?[['Friday check-in','Friday check-in. Walk me through this week: what to move where.']]:[]),['How\\'s my week?','How\\'s my week looking?'],['Can I afford…','Can I afford '],['Log a purchase','Just spent $'],['Talk me down','Talk me down, I want to buy '],['Why this number?','Why is my allowance what it is today?']].map(([l,t])=>`\u003cbutton class=\"chip\" onclick=\"buddyChip(${JSON.stringify(t).replace(/\"/g,'&quot;')})\">${l}\u003c/button>`).join('');\n  $('budSend').hidden=bud.busy;$('budStop').hidden=!bud.busy;\n  let lg=$('budLog');lg.scrollTop=lg.scrollHeight}\nfunction buddyChip(t){if(/ $|\\$$/.test(t)){openBuddy(t)}else buddySend(t)}\nasync function buddySend(text){text=String(text||'').trim();if(!text||bud.busy)return;$('budIn').value='';\n  state.chat.push({role:'user',content:text.slice(0,1500),at:Date.now()});bud.busy=true;bud.live='';renderBuddy();\n  const sample=await claude.use('sample');\n  if(!sample){bud.busy=false;state.chat.push({role:'assistant',content:\"I can't reach Claude from this view. Open Payday OS inside the Claude app and I'm here.\",at:Date.now()});persist();renderBuddy();return}\n  let turns=state.chat.slice(-16).map(m=>({role:m.role,content:m.content}));while(turns.length&&turns[0].role!=='user')turns.shift();\n  let input=[{role:'user',content:BUDDY_RULES()+'\\n\\nLIVE SNAPSHOT (JSON, current as of this message):\\n'+buddySnapshot()+'\\n\\nThe conversation follows.'},...turns];\n  let run=async useTools=>{bud.ctl=new AbortController();let o={cache:false,signal:bud.ctl.signal,modelTier:'quick',onText:({text})=>{bud.live=text;let el=$('budLive');if(el)el.innerHTML=mdLite(text);let lg=$('budLog');lg.scrollTop=lg.scrollHeight}};if(useTools)o.tools=buddyTools();return sample(input,o)};\n  try{let res;try{res=await run(true)}catch(e){if(e&&e.code==='tools_unavailable')res=await run(false);else throw e}\n    let ans=res.text.split(/\\n\\n/).length>1&&bud.live?res.text:res.text;state.chat.push({role:'assistant',content:ans.slice(0,3000),at:Date.now()})}\n  catch(e){let c=e&&e.code,keep=e&&e.text;let msg=c==='cancelled'?null:c==='not_granted'||c==='sampling_disabled'?\"I need permission to use Claude here. Allow it when the app asks, then try again.\":c==='rate_limited'?\"I'm getting rate-limited. Give me a minute and ask again.\":c==='session_expired'?\"Your Claude session expired. Sign in again and I'm back.\":c==='refused'?\"I can't help with that one. Ask me another way?\":\"Something glitched on my end. Try that again?\";\n    if(keep)state.chat.push({role:'assistant',content:keep+(c==='cancelled'?'':' …'),at:Date.now()});if(msg)state.chat.push({role:'assistant',content:msg,at:Date.now()})}\n  finally{bud.busy=false;bud.live='';state.chat=state.chat.slice(-40);persist();renderBuddy();rerender()}}\nfunction stopBuddy(){bud.ctl&&bud.ctl.abort()}\nfunction clearBuddy(){state.chat=[];persist();renderBuddy()}\n\nfunction dayTxHTML(d){let k=iso(d);if(!live||!live.tx||k\u003ciso(lastFriday()))return '';let tx=[...live.tx,...quickPending()].filter(t=>t.date===k&&t.amount\u003c0&&catBucket(t.category)!==null);if(!tx.length)return '';\n  return `\u003cdiv class=\"kicker\" style=\"margin-top:12px\">Purchases that day · tap a bucket to re-file\u003c/div>\u003cdiv class=\"list\">${tx.sort((a,b)=>a.amount-b.amount).map(t=>{let b=txBucket(t);return `\u003cdiv class=\"row\" style=\"padding:7px 0;gap:8px\">\u003cdiv class=\"grow small\">\u003cdiv>${esc(t.merchant||t.category)}\u003c/div>${state.txNotes[t.id]?`\u003cdiv class=\"muted\" style=\"font-size:12px\">${esc(state.txNotes[t.id])}\u003c/div>`:''}\u003c/div>\u003cdiv class=\"amt small\">${money(-t.amount)}\u003c/div>\u003cselect class=\"txsel\" onchange=\"assignTx('${t.id}',this.value)\">${Object.entries(BUCKETS).map(([kk,v])=>`\u003coption value=\"${kk}\" ${kk===b?'selected':''}>${v[0]}\u003c/option>`).join('')}\u003c/select>\u003c/div>`}).join('')}\u003c/div>`}\nfunction assignTx(id,b){state.txCat[id]=b;state.sortCount=(state.sortCount||0)+1;persist();award(2,'filed a purchase',true);toast('Moved to '+BUCKETS[b][0]);rerender();if(dayOpen)openDay(dayOpen)}\n\n/* ---------- AI suggestions: researched benchmarks (late Oct 2026) + Benji's live review ---------- */\nlet bTab='plan';\nfunction setBTab(t){bTab=t;$('bt-plan').classList.toggle('on',t==='plan');$('bt-ai').classList.toggle('on',t==='ai');$('bAI').hidden=t!=='ai';$('bPlanDash').hidden=t==='ai';renderBudget()}\nconst SRC_R={usda:['USDA Food Plans, Sep 2026','https://www.fna.usda.gov/research/cnpp/usda-food-plans/cost-food-monthly-reports'],bls:['BLS CPI, Sep 2026','https://www.bls.gov/news.release/pdf/cpi.pdf'],gas:['Maryland gas prices','https://www.gasolytics.com/gas-prices/maryland'],aaa:['AAA gas prices','https://gasprices.aaa.com/?state=US'],ins:['MoneyGeek: MD car insurance','https://www.moneygeek.com/insurance/auto/average-cost-car-insurance-maryland/'],snap:['Insurify: Snapshot','https://insurify.com/car-insurance/companies/progressive/snapshot/'],boost:['Boost Mobile plans 2026','https://www.boostmobile.com/boost-blog/plans-features/top-prepaid-plans-2026'],hair:['Fresha: Baltimore barbers','https://www.fresha.com/lp/en/bt/barbershops/in/us-baltimore'],pt:['CareRoute: PT costs','https://www.careroute.ai/costs/physical-therapy-cost'],rofo:['Royal Farms menu deals','https://finance.yahoo.com/small-business/articles/royal-farms-unveils-menu-deals-123000405.html'],foru:['Safeway for U program','https://www.safeway.com/foru/program-details.html'],emp:['Glassdoor: Safeway discount','https://www.glassdoor.com/Benefits/Safeway-Employee-Discounts-US-BNFT34_E581_N1.htm'],wplus:['Walmart+ fuel savings','https://www.savings.com/savvy/walmart/walmart-gas-savings'],mdgam:['MD Voluntary Exclusion','https://www.mdgaming.com/responsible-gaming/']};\nconst RESEARCH_LINES=[\n {id:'groc',l:'Groceries',key:'groceries',rec:90,why:'USDA Thrifty/Low-Cost plan for a man 19–50 is ~$74/wk; +20% for a one-person household ≈ $88. You\\'ve been spending ~$166/wk, above even the \"Liberal\" plan, while also eating out. Food-at-home prices rose only 1.8% this year; eggs are down 35%, beef up 7%. Lean on chicken, eggs, beans, turkey.',src:['usda','bls']},\n {id:'out',l:'Eating-out allowance',key:'outTarget',rec:50,alt:75,why:'A fast-food combo averages ~$10.69 in Baltimore (eating out inflation 3.5%, double groceries). A packed shift meal costs $1.60–$2.20. Packing two meals per truck shift saves ~$45–55/wk. Your allowance stays protected either way, so pick the level you can actually hit.',src:['bls','rofo']},\n {id:'gas',l:'Gas',key:'gasBudget',rec:45,why:'MD regular ~$4.04/gal; a 2016 Civic gets ~30 mpg in real driving. 200–250 miles/week ≈ $ + betting: real money','Blocking those charges frees roughly $100–250/month, about 2 months off your payoff. Maryland\\'s Voluntary Exclusion Program locks out casinos, lottery and sports betting if you want a hard wall.',['mdgam']],\n];\n/* Allergy-safe: no whey/milk/yogurt, no shellfish. Labels still need checking (whey hides in breads, deli meat, breaded chicken, bars). */\nconst ALLERGY_NOTE='Built around your allergies: no whey, no milk or yogurt, no shellfish (natural cheese is in). Whey hides in a lot of packaged food, so always read the label (look for whey, milk, milk solids, casein): bread, deli meat, breaded chicken strips, protein bars and snacks, Lunchables cheese, some meat sticks and pasta sauces. Most cheese is fine for you: natural cheese (cheddar, mozzarella, Monterey Jack, string cheese) is usually just milk, cultures, salt and enzymes. Skip processed cheese (American singles, cheese spreads, Lunchables cheese, many cheese sauces), which often has added whey.';\nconst MEALS={Breakfast:[['PB-banana overnight oats (soy milk)','1 cup oats, 1 cup soy milk, 2 Tbsp PB, ½ banana, cinnamon',1.00,22],['Egg, bean & cheddar burrito (batch 8, freeze)','2 eggs, tortilla, beans, ½ oz cheddar, salsa',0.80,25],['Grab-and-go','3 hard-boiled eggs, banana, 2 slices PB toast (check the bread label)',0.90,28]],\n 'Lunch (packable, eat cold)':[['Cold chicken burrito bowl','6 oz thigh, rice, beans, veg, 1 oz cheddar, salsa',2.10,45],['Turkey & cheese wraps ×2','2 tortillas, 4 oz deli turkey (no whey), 1 oz cheese, mustard, lettuce',2.05,40],['Tuna pasta salad','5 oz tuna, 4 oz pasta, peas, mayo (egg-based, no dairy)',1.60,40]],\n 'Shift snacks':[['String cheese (check: no whey)','',0.35,7],['2 boiled eggs','',0.25,12],['PB sandwich','',0.26,10],['Dry-roasted peanuts, ¼ cup','',0.20,8],['Banana or mandarin','',0.25,1]],\n 'Fill-up add-ons (stay full while slimming down)':[['Baked or microwaved potato','A whole russet, salt, salsa or a little cheddar. One of the most fill /* Dates are local calendar days written YYYY-MM-DD. */
function ymd(d) {
  d = d || new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

function parseYmd(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }

var DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
var DOWL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function shortDate(s) {
  if (!s) return '';
  var n = dayDiff(today(), s);
  if (n === 0) return 'Today';
  if (n === 1) return 'Tomorrow';
  if (n === -1) return 'Yesterday';
  var d = parseYmd(s);
  if (n > 1 && n < 7) return DOW[d.getDay()];
  return DOW[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()];

  function cacheNow() { clearTimeout(cacheT); try { localStorage.setItem(CACHE_KEY, JSON.stringify({ v: 1, d: S, o: out })); } catch (e) {} }
  function cacheSave() { clearTimeout(cacheT); cacheT = setTimeout(cacheNow, 200); }

  function saveWarn(code) {
    if (warned[code]) return; warned[code] = 1;

  function remoteWrite(col, id) {

    init: function () { var had = cacheLoad(); emit(); return had; },
    status: function () { return status; },
    on: function (f) { subs.push(f); },

          // session that ended before db confirmed it) goes out first.

                // objects, and editing one in place threw, so taps did nothing.
                var v = doc.data(); if (!v) return; v = JSON.parse(JSON.stringify(v));
                var mine = S[col][doc.id];

                else fresh[doc.id] = v;
              });
              // Just saved here but missing from a late snapshot: keep it.
              Object.keys(S[col]).forEach(function (id) {
                var ck = col + '/' + id;
                if (!fresh[id] && confirmedAt[ck] && now - confirmedAt[ck] < 20000) fresh[id] = S[col][id];

              Object.keys(out).forEach(function (key) {
                var p = key.split('/'); if (p[0] !== col) return;

    },
    resetLocal: function () {
      COLS.forEach(function (c) { Object.keys(S[c]).forEach(function (id) { delete S[c][id]; remoteWrite(c, id); }); });
      cacheSave(); emit();
    }
  };
})();

    if (!qb) return 'That book isn\'t in Books';

  } else if (s.type === 'spent') {

    var l = Store.get('ranks', s.targetId);
    if (l) { addToRank(l.id, { t: title }); msg = 'Added to ' + esc(l.name); }
  } else msg = 'Deleted';
  Store.del('inbox', it.id);
  return msg;
}

function monthView() {
  var t = today(), m = cal.month, first = parseYmd(m), lead = (first.getDay() + 6) % 7;

  var h = '<div class="calhead"><button class="iconbtn" data-act="calnav" data-n="-1" aria-label="Previous month">' + icon('back') + '</button>'

  for (var i = 0; i < lead; i++) h += '<span></span>';
  var fe = typeof finEventsFor === 'function' ? finEventsFor(m) : {};
  for (var dnum = 1; dnum <= days; dnum++) {

    h += '<button class="day' + (d === t ? ' today' : '') + (d === cal.sel ? ' sel' : '') + '" data-act="calday" data-d="' + d + '" aria-label="' + esc(shortDate(d)) + ', ' + ts.length + ' tasks">'

/* The comparison sheet. */
var cmp = null; // {list, item, lo, hi, asked}
function startRanking(listId, itemId) {
  var l = rankList(listId), order = (l.order || []).filter(function (x) { return x !== itemId; });
  if (!order.length) { Store.patch('ranks', listId, { order: [itemId] }); toast('Added. The next one gets compared to it.'); return; }
  cmp = { list: listId, item: itemId, lo: 0, hi: order.length, asked: 0, total: Math.ceil(Math.log2(order.length + 1)) };
  askNext();
}
function askNext() {
  var l = rankList(cmp.list), order = (l.order || []).filter(function (x) { return x !== cmp.item; });
  if (cmp.lo >= cmp.hi) {
    order.splice(cmp.lo, 0, cmp.item); Store.patch('ranks', cmp.list, { order: order });
    var it = rankItem(l, cmp.item), pos = cmp.lo + 1, next = rankPending(rankList(cmp.list))[0];
    var listId = cmp.list; cmp = null;
    if (next) { toast(esc(it.t) + ' is #' + pos + '. Next one…'); startRanking(listId, next.id); }
    else { closeSheet(); toast(esc(it.t) + ' is #' + pos + ' of ' + order.length); }
    return;
  }
  var mid = (cmp.lo + cmp.hi) >> 1, a = rankItem(l, cmp.item), b = rankItem(l, order[mid]);
  cmp.mid = mid; cmp.asked++;
  var card = function (it, side) {
    return '<button class="vs" data-act="rankpick" data-s="' + side + '"><b>' + esc(it.t) + '</b>' + (it.year ? '<span>' + esc(it.year) + '</span>' : '')
      + (it.note ? '<small>' + esc(it.note) + '</small>' : '') + '</button>';
  };
  openSheet('<div class="shead"><h2>' + (l.kind === 'movies' ? 'Which was better?' : 'Which is better?') + '</h2><button class="iconbtn" data-act="rankstop" aria-label="Stop for now">' + icon('x') + '</button></div>'
    + '<p class="note small">Question ' + cmp.asked + ' of about ' + Math.max(cmp.asked, cmp.total) + '. Go with your gut.</p>'
    + '<div class="vsgrid">' + card(a, 'new') + '<span class="vsor">or</span>' + card(b, 'old') + '</div>'
    + '<button class="btn ghost block" data-act="rankpick" data-s="tie">Too close to call</button>', null, function () { cmp = null; });
}
ACTS.rankpick = function (d) {
  if (!cmp) return;
  if (d.s === 'new') cmp.hi = cmp.mid; else cmp.lo = cmp.mid + 1; // a tie places it just below

};
ACTS.rankstop = function () { cmp = null; closeSheet(); toast('Saved. The rest wait under "to rank".'); };
ACTS.rankitem = function (d) {
  var l = rankList(d.id), it = rankItem(l, d.i), pos = (l.order || []).indexOf(d.i) + 1;
  openSheet('<div class="shead"><h2>#' + pos + ' · ' + esc(it.t) + '</h2><button class="iconbtn" data-act="close" aria-label="Close">' + icon('x') + '</button></div>'
    + '<div class="field"><label for="rinote">Note</label><input id="rinote" class="input" value="' + esc(it.note || '') + '" placeholder="What stuck with you"></div>'
    + '<div class="btnrow"><button class="btn soft" data-act="rankmove" data-id="' + d.id + '" data-i="' + d.i + '" data-n="-1"' + (pos === 1 ? ' disabled' : '') + '>Move up</button>'
    + '<button class="btn soft" data-act="rankmove" data-id="' + d.id + '" data-i="' + d.i + '" data-n="1"' + (pos === (l.order || []).length ? ' disabled' : '') + '>Move down</button></div>'
    + '<div class="btnrow"><button class="btn accent" data-act="rerank" data-id="' + d.id + '" data-i="' + d.i + '">Rank it again</button>'
    + '<button class="btn ghost" style="color:var(--bad)" data-act="rankdel" data-id="' + d.id + '" data-i="' + d.i + '">Remove</button></div>',
    function (s) {
      $('#rinote', s).addEventListener('input', function (e) {
        var cur = rankList(d.id); Store.patch('ranks', d.id, { items: cur.items.map(function (x) { return x.id === d.i ? Object.assign({}, x, { note: e.target.value }) : x; }) });
      });
    });
};
ACTS.rankmove = function (d) {
  var l = rankList(d.id), o = (l.order || []).slice(), i = o.indexOf(d.i), j = i + (+d.n);
  if (j < 0 || j >= o.length) return; o.splice(i, 1); o.splice(j, 0, d.i);

var TMODES = [['Focus', 25], ['Short break', 5], ['Long break', 15]];
var timerState = (function () { try { return JSON.parse(localStorage.getItem('mossos.timer') || 'null') || { m: 0, end: null, left: 1500, running: false }; } catch (e) { return { m: 0, end: null, left: 1500, running: false }; } })();
function timerSave() { try { localStorage.setItem('mossos.timer', JSON.stringify(timerState)); } catch (e) {} }

var timerTick = null;
function timerLoop() {
  clearInterval(timerTick);
  if (!timerState.running) return;
  timerTick = setInterval(function () {
    var l = timerLeft(), el = $('#tclock');
    if (el) el.textContent = fmtSecs(l);
    if (l <= 0) {
      clearInterval(timerTick); timerState.running = false; timerState.left = TMODES[timerState.m][1] * 60; timerSave();
      if (timerState.m === 0) logEvent('Focused for ' + TMODES[0][1] + ' minutes');
      toast(timerState.m === 0 ? 'Focus done. Take five.' : 'Break over.');
      if (navigator.vibrate) navigator.vibrate(200);
      render();
    }
  }, 500);
}

/* ═══ MONEY ═════════════════════════════════════════════════════════
   Payday OS runs unchanged in a frame (PAYDAY_SRC, added by build.mjs).
   The frame is made once, a second after the first paint, and lives
   outside #view so re-renders never reload it. It shares this page's
   origin, so it uses the same Claude connection (sync, Monarch, Benji)
   and MossOS can ask it for numbers: __finSummary, __finEvents, __finLog,
   __finImport, __finTheme, __finInfo. */
var FIN = { frame: null, ready: false, view: 'today', sum: null, extra: null, sumKey: '' };

var FIN_MORE = [['roadmap', 'Roadmap', 'Card kill dates, decision day, big buys, Roth IRA'], ['data', 'Spending', 'Plan vs actual, interest saved, where it went'],
  ['sort', 'Sort purchases', 'Swipe purchases into the right bucket'], ['calendar', 'Month', 'Every day\'s money, spending and bills'],
  ['future', 'What if', 'A bigger check, a bigger payment: see the date move'], ['ask', 'Ask Payday', 'Step-by-step answers from your plan'],
  ['monarch', 'Monarch', 'Live balances and spending'], ['settings', 'Settings', 'Backup, sync, reset'], ['more', 'Everything else', 'Payday\'s own menu']];
function finMoreOn() { return FIN_MORE.some(function (x) { return x[0] === FIN.view; }); }

function finWin() { try { return FIN.ready && FIN.frame ? FIN.frame.contentWindow : null; } catch (e) { return null; } }
function finCall(name, args) {
  var w = finWin(); if (!w) return undefined;
  try { return typeof w[name] === 'function' ? w[name].apply(null, args || []) : undefined; } catch (e) { return undefined; }
}

  var f = document.createElement('iframe');

setTimeout(ensureFin, 1000);

  var r = slot.getBoundingClientRect(), m = main.getBoundingClientRect();

  f.style.height = Math.max(200, Math.round(innerHeight - tb - r.top)) + 'px';

/* ═══ CHALLENGES ════════════════════════════════════════════════════
   Built on habits. A day counts when every chosen habit is done (a habit
   that isn't due that day doesn't count against it). Strict: a missed day
   ends the run, and you start again when you're ready. Grace: one missed
   day in any 7 is forgiven. Nothing turns red; old runs stay as history.
   { name, habits:[ids], days, start, mode:'strict'|'grace', runs:[{start, ended, reached}] } */
function chHabits(c) { return (c.habits || []).map(function (id) { return Store.get('habits', id); }).filter(function (h) { return h && !h.archived; }); }
function chDayOK(c, d) {
  var hs = chHabits(c); if (!hs.length) return false;
  return hs.every(function (h) { return !dueOn(h, d) || habitDone(h, d); });
}
function challengesLive() { return Store.all('challenges').filter(function (c) { return !c.archived; }).sort(function (a, b) { return (a.created || 0) - (b.created || 0); }); }
/* Walks the run day by day. cells: done | grace | miss | today | todaydone | future */
function chState(c) {
  var t = today(), n = c.days, cells = [], done = 0, lastMiss = null, ended = null;
  for (var k = 0; k < n; k++) {

    if (ended) { cells.push('off'); continue; }
    if (d > t) { cells.push('future'); continue; }
    if (d === t) { var ok = chDayOK(c, d); if (ok) done++; cells.push(ok ? 'todaydone' : 'today'); continue; }
    if (chDayOK(c, d)) { done++; cells.push('done'); continue; }
    if (c.mode === 'grace' && (!lastMiss || dayDiff(lastMiss, d) >= 7)) { lastMiss = d; cells.push('grace'); continue; }
    ended = d; cells.push('miss');
  }
  var day = Math.min(n, dayDiff(c.start, t) + 1);
  return { cells: cells, done: done, ended: ended, day: day, upcoming: c.start > t, complete: !ended && done === n,

function chLine(c, s) {

  if (s.ended) return 'Missed ' + DOW[parseYmd(s.ended).getDay()] + ' · start again when you\'re ready';

/* ═══ BOOKS ═════════════════════════════════════════════════════════
   Progress (pages, pace, a finish estimate), quotes and thoughts kept as
   notes (so Notes search finds them), and Claude as a reading companion
   that never reads ahead of your page.
   { title, author, pages, page, color, started, finished, log:{ymd: page} } */
var BOOK_COLORS = ['#F0C889', '#7AA2F7', '#5FCF8E', '#C39BD3', '#F08A4B', '#3CC4B4', '#F27BA8'];
function booksAll() {
  return Store.all('books').sort(function (a, b) { return (!!a.finished - !!b.finished) || (b.updated || 0) - (a.updated || 0); });
}
function booksReading() { return booksAll().filter(function (b) { return !b.finished; }); }
function bookPct(b) { return b.pages ? Math.min(100, Math.round(100 * (b.page || 0) / b.pages)) : 0; }
/* The page you were on at the end of a day (0 before you started). */
function bookPageOn(b, d) {
  var best = null, log = b.log || {};
  Object.keys(log).forEach(function (k) { if (k <= d && (!best || k > best)) best = k; });
  return best ? +log[best] : 0;
}
function bookPace(b) {
  var t = today(), from = addDays(t, -14), start = b.started || t;
  var base = start > from ? 0 : bookPageOn(b, from), days = Math.max(1, Math.min(14, dayDiff(start, t) + (start > from ? 1 : 0)));
  var read = (b.page || 0) - base;
  return read > 0 ? read / days : 0;
}
function bookEta(b) {
  var p = bookPace(b); if (!p || !b.pages || b.finished) return null;
  return addDays(today(), Math.max(1, Math.ceil((b.pages - (b.page || 0)) / p)));
}
function bookNotes(id) { return Store.all('notes').filter(function (n) { return n.book === id; }).sort(function (a, b) { return (b.created || 0) - (a.created || 0); }); }
function bookFind(text) {
  var best = null, bs = 0;
  booksAll().forEach(function (b) { var v = overlap(b.title, text); if (v > bs || (v === bs && best && best.finished && !b.finished)) { bs = v; best = b; } });
  if (best && bs >= 0.5) return best;
  var r = booksReading(); return !text.trim() && r.length === 1 ? r[0] : null;
}
/* Logging pages also feeds a reading habit: one with a "pages" target
   gets the amount; one called "Read …" is marked done once today's pages
   reach the number in its name. */
function bookFeedHabit(delta, readToday) {
  if (!(delta > 0)) return;
  var hs = habitsSorted(), t = today();
  var amt = hs.filter(function (h) { return h.target && /^pages?$/i.test(h.unit || ''); })[0];
  if (amt) { logAmount(amt.id, t, delta); return; }
  var rd = hs.filter(function (h) { return !h.target && /\bread/i.test(h.n); })[0];
  if (rd && !habitDone(rd, t)) { var m = /(\d+)/.exec(rd.n); if (readToday >= (m ? +m[1] : 1)) setMark(rd.id, t, 1); }
}
function logPages(id, page) {
  var b = Store.get('books', id); if (!b) return null;
  var t = today(), was = b.page || 0;
  page = Math.max(0, Math.round(+page || 0)); if (b.pages) page = Math.min(b.pages, page);
  var log = Object.assign({}, b.log || {}); log[t] = page;
  var f = { page: page, log: log, started: b.started || t };
  var fin = b.pages && page >= b.pages && !b.finished;
  if (fin) f.finished = t;
  Store.patch('books', id, f);
  bookFeedHabit(page - was, page - bookPageOn(b, addDays(t, -1)));
  if (fin) logEvent('Finished ' + b.title + ' 📖'); else if (page > was) logEvent('Read ' + (page - was) + ' pages of ' + b.title);
  return { read: page - was, page: page, finished: fin };
}
