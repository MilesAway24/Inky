<title>MossOS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#191918">
<style>/* MossOS mobile. Layout: one column with bottom tabs on phones; a left sidebar and a
   centred column on iPad and wider. Dark-first, MossOS tokens, Helvetica Neue,
   light numerals. Area colours are the only accent besides moss green. */
:root{
  /* One dark look (Miles's reference): near-black, soft cards, green accent. */
  --bg:#0A0A0B;--surface:#161618;--sunk:#1E1E21;--raise:#232327;
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
  --ink:#F2F2F2;--muted:#9A9AA0;--faint:#6E6E75;
  --accent:#34D17A;--accent-ink:#06210F;--accent-tint:rgba(52,209,122,.14);
  --warn:#F5B544;--bad:#FF5A52;--good:#34D17A;--shadow:rgba(0,0,0,.6);
  --hn:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --r:20px;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:400 16px/1.45 var(--hn);letter-spacing:-.005em;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}

/* ── frame ─────────────────────────────────────────────────────────── */
.main{max-width:720px;margin:0 auto;min-height:100vh;
  padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);
  display:flex;align-items:center;gap:8px;min-height:56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top.edge{box-shadow:0 1px 0 var(--line)}
.top h1{margin:0 auto 0 0;font-size:24px;font-weight:500;letter-spacing:-.025em;line-height:1.1;
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top.sub h1{font-size:18px;font-weight:500}
.back{display:grid;place-items:center;width:44px;height:44px;margin-left:-12px;border-radius:12px;color:var(--ink)}
.iconbtn{display:grid;place-items:center;min-width:44px;height:44px;border-radius:12px;color:var(--muted)}
.iconbtn:hover{background:var(--sunk);color:var(--ink)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--faint);white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sync.on i{background:var(--accent)}
.sync.warn i{background:var(--warn)}
.view{display:grid;gap:22px;padding-top:4px;outline:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view>*{min-width:0}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:18px;height:18px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);align-items:end;
  padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.tabs button{display:grid;justify-items:center;gap:3px;padding:6px 0;min-height:50px;color:var(--faint);font-size:10.5px;font-weight:500}
.tabs button.on{color:var(--ink)}
.tabs button.on svg.i{stroke-width:2.2}
.tabs .cap{align-self:center}
.tabs .cap span{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
  box-shadow:0 6px 18px var(--shadow)}
.tabs .cap svg.i{width:26px;height:26px;stroke-width:2.2}
.side{display:none}

@media (min-width:900px){
  .tabs{display:none}
  .side{display:flex;flex-direction:column;gap:2px;position:fixed;top:0;bottom:0;left:0;width:240px;z-index:25;
    padding:calc(22px + env(safe-area-inset-top,0px)) 12px 20px max(12px,env(safe-area-inset-left,0px));
    border-right:1px solid var(--line);background:var(--bg);overflow-y:auto}
  .side .brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:500;letter-spacing:-.02em;padding:0 10px 18px}
  .side .brand svg{width:26px;height:26px;color:var(--accent)}
  .side button{display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px;font-size:15px;color:var(--muted);min-height:44px}
  .side button:hover{background:var(--sunk);color:var(--ink)}
  .side button.on{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
  .side .capbtn{background:var(--accent);color:var(--accent-ink);margin:0 0 14px;justify-content:center;font-weight:600}
  .side .capbtn:hover{background:var(--accent);color:var(--accent-ink);filter:brightness(1.06)}
  .side .grp{font-size:12px;color:var(--faint);padding:16px 10px 4px}
  .main{margin-left:240px;max-width:760px;padding-bottom:48px}
  .app .main{margin-left:max(240px,calc(50% - 380px + 120px))}
  .toast{bottom:28px}
}

/* ── type and common pieces ───────────────────────────────────────── */
h2{margin:0;font-size:17px;font-weight:500;letter-spacing:-.01em;text-wrap:balance}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.sechead .meta{font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums}
.link{color:var(--accent);font-weight:500;font-size:14px;white-space:nowrap;padding:6px 0}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:13px}
.note{font-size:14px;color:var(--muted);line-height:1.5;max-width:60ch;margin:0}
.dateline{font-size:13px;color:var(--faint);letter-spacing:.02em}
.big{font-size:44px;font-weight:300;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card.flat{background:var(--sunk);border-color:transparent}
.empty{padding:18px;border:1px dashed var(--line2);border-radius:var(--r);color:var(--muted);font-size:14px;line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;
  font-weight:500;font-size:15px;background:var(--ink);color:var(--bg);white-space:nowrap}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.soft{background:var(--sunk);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line2)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 13px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btnrow .btn{flex:1 1 auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:99px;border:1px solid var(--line2);
  font-size:14px;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip i{width:8px;height:8px;border-radius:50%;flex:none}
.scrollx{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.scrollx::-webkit-scrollbar{display:none}
.scrollx .chip{flex:none}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.pill{display:inline-flex;align-items:center;font-size:12px;padding:3px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ex{background:transparent;border:1px dashed var(--line2);color:var(--faint)}
.pill.warn{color:var(--warn)}
.field{display:grid;gap:6px}
.field label,.lbl{font-size:13px;color:var(--muted)}
.input,textarea.input{width:100%;min-height:46px;padding:11px 14px;border-radius:12px;border:1px solid var(--line2);
  background:var(--surface);font-size:16px;line-height:1.4}
textarea.input{resize:vertical;min-height:110px}
.input:focus{outline:none;border-color:var(--accent)}

/* ── rows ─────────────────────────────────────────────────────────── */
.list{display:grid;grid-template-columns:minmax(0,1fr)}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);min-height:56px;width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .t{font-size:16px;line-height:1.3;overflow-wrap:anywhere}
.row .s{font-size:13px;color:var(--faint);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row .ic{font-size:18px;width:24px;text-align:center;flex:none}
.row.done .t{color:var(--faint);text-decoration:line-through}
.ck{flex:none;width:44px;height:44px;margin:-10px -8px -10px -10px;display:grid;place-items:center}
.ck span{width:24px;height:24px;border-radius:8px;border:2px solid var(--line2);display:grid;place-items:center}
.ck.on span{background:var(--accent);border-color:var(--accent)}
.ck.on span::after{content:"";width:5px;height:10px;border:solid var(--accent-ink);border-width:0 2.4px 2.4px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chev{color:var(--faint);flex:none}

/* ── today ───────────────────────────────────────────────────────── */
.play{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:12px}
.play .k{display:flex;justify-content:space-between;font-size:12.5px;color:var(--faint)}
.play .t{font-size:22px;font-weight:500;letter-spacing:-.02em;line-height:1.2;display:flex;gap:12px;align-items:flex-start}
.play .t span:first-child{font-size:26px;line-height:1}
.play .w{font-size:14.5px;color:var(--muted);line-height:1.45}
.play .acts{display:grid;grid-template-columns:1fr auto;gap:8px}
.areas{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.areas::-webkit-scrollbar{display:none}
.acard{flex:0 0 148px;display:grid;gap:6px;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);
  box-shadow:inset 0 3px 0 var(--c);text-align:left}
.acard .n{font-size:14.5px;font-weight:500;display:flex;align-items:center;gap:7px;min-width:0}
.acard .n span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acard .f{font-size:12.5px;color:var(--muted);line-height:1.35;min-height:2.7em;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.st{font-size:11.5px;padding:2px 8px;border-radius:99px;justify-self:start;white-space:nowrap}
.st-ontrack{background:rgba(127,224,212,.15);color:#7FE0D4}
.st-needsyou{background:rgba(242,207,122,.16);color:#F2CF7A}
.st-blocked{background:rgba(245,163,163,.16);color:#F5A3A3}
.st-paused{background:var(--sunk);color:var(--muted)}
.st-planned{background:rgba(247,176,204,.15);color:#F7B0CC}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .st-ontrack{color:#16756B}
  :root:not([data-theme="dark"]) .st-needsyou{color:#8A6100}
  :root:not([data-theme="dark"]) .st-blocked{color:#B03A3A}
  :root:not([data-theme="dark"]) .st-planned{color:#A83A6A}}
:root[data-theme="light"] .st-ontrack{color:#16756B}
:root[data-theme="light"] .st-needsyou{color:#8A6100}
:root[data-theme="light"] .st-blocked{color:#B03A3A}
:root[data-theme="light"] .st-planned{color:#A83A6A}
.log{display:grid}
.logrow{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px;align-items:baseline}
.logrow:first-child{border-top:0}
.logrow time{width:48px;flex:none;font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.logrow .dot{transform:translateY(-1px)}
.inboxbar{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;background:var(--accent-tint);width:100%;text-align:left}
.inboxbar b{font-weight:500}
.inboxbar .grow{flex:1;min-width:0}

/* ── tasks ───────────────────────────────────────────────────────── */
.grouph{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:6px 0 0}
.grouph .c{color:var(--faint);font-variant-numeric:tabular-nums}
.grouph .ln{flex:1;height:1px;background:var(--line)}
.sweepbar{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;background:var(--sunk);width:100%;text-align:left}
.slip{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface);font-size:14.5px}
.slip .grow{flex:1;min-width:0}
.slip s{color:var(--faint);font-size:12.5px;white-space:nowrap}
.slip b{font-weight:500;font-size:12.5px;white-space:nowrap}
.sweepcard{display:grid;gap:12px;padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.sweepcard .t{font-size:17px}
.dest{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.dest .btn{min-height:48px}

/* ── task detail ─────────────────────────────────────────────────── */
.dhead{display:flex;gap:14px;align-items:flex-start}
.dhead .ic{width:48px;height:48px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:24px;flex:none}
.dhead h2{font-size:22px;line-height:1.25;letter-spacing:-.02em}
.props{display:grid;border-top:1px solid var(--line)}
.prop{display:flex;align-items:center;gap:12px;min-height:50px;border-bottom:1px solid var(--line);font-size:15px;width:100%;text-align:left}
.prop .k{width:96px;flex:none;color:var(--faint);font-size:14px}
.prop .v{flex:1;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.notebox{min-height:90px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:15.5px;line-height:1.55;outline:none;white-space:pre-wrap}
.notebox:focus{border-color:var(--accent)}
.notebox:empty::before{content:attr(data-ph);color:var(--faint)}
.steps .row{min-height:50px}
.addstep{display:flex;gap:8px}
.addstep .input{flex:1;min-width:0}

/* ── capture + sort ──────────────────────────────────────────────── */
.sheetbg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  box-shadow:0 -10px 40px var(--shadow);display:grid;gap:16px}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--line2);justify-self:center;margin-bottom:-4px}
.sheet .shead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet .shead h2{font-size:19px}
@media (min-width:760px){.sheetbg{align-items:center}.sheet{border-radius:22px;padding-bottom:20px}}
.capbox{font-size:19px;line-height:1.4;min-height:120px;border:0;background:transparent;padding:4px 0;resize:none;width:100%;outline:none}
.capbox::placeholder{color:var(--faint)}
.photo{position:relative;width:96px;height:96px;border-radius:12px;overflow:hidden;background:var(--sunk)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo button{position:absolute;right:4px;top:4px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.sugg{display:grid;gap:10px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.sugg .orig{font-size:13px;color:var(--faint);font-style:italic;overflow-wrap:anywhere}
.sugg .t{font-size:17px;font-weight:500;line-height:1.3}
.sugg .meta{display:flex;flex-wrap:wrap;gap:6px}
.sugg .first{font-size:14px;color:var(--muted)}
.sugg.gone{opacity:.45}
.typegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.typegrid .btn{min-height:48px;flex-direction:column;gap:2px;font-size:14px}

/* ── areas page ─────────────────────────────────────────────────── */
.agrid{display:grid;gap:10px}
.abig{display:grid;gap:10px;padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:inset 0 3px 0 var(--c);width:100%;text-align:left}
.abig .h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.abig .h b{font-weight:500;font-size:17px;display:flex;align-items:center;gap:8px}
.abig .kv{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.abig .kv span:first-child{color:var(--faint)}
@media (min-width:600px){.agrid{grid-template-columns:1fr 1fr}}

/* ── more ───────────────────────────────────────────────────────── */
.menu{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 14px}
.menu .row{min-height:54px}
.soon{font-size:12px;color:var(--faint);border:1px solid var(--line2);border-radius:99px;padding:2px 8px;white-space:nowrap}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;
  background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-size:14.5px;font-weight:500;
  box-shadow:0 10px 30px var(--shadow);width:max-content;max-width:calc(100% - 32px);display:flex;gap:14px;align-items:center}
.toast button{color:var(--accent);font-weight:600;padding:4px 0}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .toast button{color:#7FE0A8}}
:root[data-theme="light"] .toast button{color:#7FE0A8}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ── stat tiles, segmented control ─────────────────────────────────── */
.stats4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stats4>div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0;display:grid;gap:4px}
.stats4 span{font-size:12px;color:var(--faint);line-height:1.2}
.stats4 b{font-size:26px;font-weight:300;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.stats4 b small{font-size:14px;color:var(--faint)}
@media (max-width:380px){.stats4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:12px;padding:3px}
.seg button{min-height:38px;border-radius:9px;font-size:14px;color:var(--muted);text-align:center}
.seg button.on{background:var(--raise);color:var(--ink);box-shadow:0 1px 3px var(--shadow)}

/* ── habits ─────────────────────────────────────────────────────────── */
.habs{display:grid;gap:10px}
@media (min-width:600px){.habs{grid-template-columns:1fr 1fr}}
.hcard{display:grid;gap:12px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:inset 3px 0 0 var(--c)}
.hcard.big{box-shadow:inset 0 3px 0 var(--c)}
.hhead{display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-width:0}
.hhead .grow{display:grid;gap:2px;min-width:0;flex:1}
.hhead b{font-weight:500;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hhead .s{font-size:12.5px;color:var(--faint)}
.hic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none;
  background:color-mix(in srgb,var(--c) 18%,transparent)}
.hweek{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.hweek span{display:grid;justify-items:center;gap:4px}
.hweek i{width:100%;height:22px;border-radius:6px;background:var(--sunk);display:block}
.hweek em{font-style:normal;font-size:11px;color:var(--faint)}
.hweek .hit i{background:var(--c)}
.hweek .skip i{background:repeating-linear-gradient(135deg,var(--sunk) 0 4px,color-mix(in srgb,var(--c) 45%,transparent) 4px 6px)}
.hweek .now i{box-shadow:inset 0 0 0 2px var(--c);background:transparent}
.hweek .off i{background:transparent;border:1px dashed var(--line2)}
.hweek .fut i{opacity:.45}
.hgrid{display:grid;grid-template-columns:repeat(15,1fr);gap:4px}
.hgrid i,.hgrid button{aspect-ratio:1;border-radius:4px;background:var(--sunk);display:block;width:100%;max-width:100%}
.hgrid .hit{background:var(--c)}
.hgrid .skip{background:color-mix(in srgb,var(--c) 35%,var(--sunk))}
.hgrid .now{box-shadow:inset 0 0 0 2px var(--c);background:transparent}
.hgrid .off{background:transparent;border:1px dashed var(--line)}
.hcard.big .hgrid{grid-template-columns:repeat(10,1fr);gap:6px}
.hcard.big .hgrid button{border-radius:7px;min-height:28px}
.hspark{display:flex;align-items:flex-end;gap:3px;height:28px}
.hspark i{flex:1;border-radius:3px;display:block;height:30%;background:var(--sunk)}
.hspark .hit{height:100%;background:var(--c)}
.hspark .skip{height:60%;background:color-mix(in srgb,var(--c) 35%,var(--sunk))}
.hspark .off{height:12%}
.hmark{text-align:center;min-height:44px;border-radius:12px;font-weight:500;font-size:15px;border:1.5px solid var(--c);color:var(--ink);background:transparent}
.hmark.on{background:var(--c);color:#111}
.hchips{display:flex;flex-wrap:wrap;gap:8px}
.hchip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px 0 10px;border-radius:99px;border:1.5px solid var(--line2);font-size:14.5px;color:var(--ink)}
.hchip span{font-size:17px}
.hchip.on{background:var(--c);border-color:var(--c);color:#111}
.hchip.skip{opacity:.55}
.tplgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tpl{display:grid;gap:3px;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:left;min-width:0}
.tpl span{font-size:22px}
.tpl b{font-weight:500;font-size:15px}
.tpl small{font-size:12.5px;color:var(--faint);line-height:1.35}

/* ── goals ─────────────────────────────────────────────────────────── */
.goals{display:grid;gap:10px}
@media (min-width:600px){.goals{grid-template-columns:1fr 1fr}}
.goal{display:grid;gap:12px;padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:inset 0 3px 0 var(--c);text-align:left;width:100%;min-width:0}
.gh{display:flex;align-items:center;gap:12px;min-width:0}
.gh .grow{flex:1;min-width:0;display:grid;gap:2px}
.gh b{font-weight:500;font-size:16px;line-height:1.3}
.gh .s{font-size:12.5px;color:var(--faint);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.gic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none;background:var(--sunk)}
.gp{font-size:22px;font-weight:300;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:6px;background:var(--sunk);overflow:hidden}
.bar.big{height:10px}
.bar i{display:block;height:100%;border-radius:6px;background:var(--c,var(--accent))}
.goal .bar i{background:var(--c)}
.gnext{font-size:14.5px;display:grid;gap:2px}
.gnext span{font-size:12px;color:var(--faint)}
.nextcard{display:grid;gap:10px;padding:16px;border-radius:16px;border:1px solid var(--line2);background:var(--surface)}
.nextcard .t{font-size:19px;font-weight:500;line-height:1.3;letter-spacing:-.01em}
.donegrp summary{cursor:pointer;color:var(--muted);font-size:14px;padding:6px 0;list-style:none}
.donegrp summary::-webkit-details-marker{display:none}

/* ── projects ───────────────────────────────────────────────────────── */
.pcard{display:grid;gap:10px;padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:inset 0 3px 0 var(--c);text-align:left;width:100%;min-width:0}
.panel{border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden}
.panel summary{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 16px;cursor:pointer;font-weight:500;list-style:none}
.panel summary::-webkit-details-marker{display:none}
.panel summary .meta{margin-left:auto;font-size:13px;color:var(--faint);font-weight:400;font-variant-numeric:tabular-nums}
.panel .pbody{padding:0 16px 14px;display:grid;gap:10px;border-top:1px solid var(--line)}
.amt{font-variant-numeric:tabular-nums;white-space:nowrap}
.kvrow{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted)}
.kvrow b{font-weight:500;color:var(--ink)}
.av{width:36px;height:36px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-weight:500;flex:none}
.addstep input[inputmode]{flex:0 0 110px}

/* ── notes, journal ────────────────────────────────────────────────── */
.search .input{min-height:44px}
.moodweek{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.moodweek span{display:grid;justify-items:center;gap:2px;padding:8px 0;border-radius:12px;background:var(--surface)}
.moodweek span.now{box-shadow:inset 0 0 0 1.5px var(--ink)}
.moodweek b{font-size:20px;font-weight:400;line-height:1.2;color:var(--faint)}
.moodweek em{font-style:normal;font-size:11px;color:var(--faint)}
.jd{width:76px;flex:none;font-size:13px}
.jd b{font-weight:500}
.jt{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:15px}

/* ── calendar ───────────────────────────────────────────────────────── */
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.calhead b{font-weight:500;font-size:17px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal .wdh{font-size:11.5px;color:var(--faint);padding:4px 0}
.day{position:relative;min-height:58px;display:grid;justify-items:center;align-content:start;gap:4px;padding-top:6px;border-radius:12px;min-width:0}
.day .n{width:30px;height:30px;line-height:30px;border-radius:9px;font-variant-numeric:tabular-nums;font-size:15px}
.day.today .n{color:var(--accent);font-weight:600}
.day.sel .n{background:var(--ink);color:var(--bg)}
.day .dots{display:flex;gap:3px;height:6px}
.day .dots i{width:6px;height:6px;border-radius:50%;display:block}
.day .mood{position:absolute;right:2px;top:2px;font-size:10px}
.arealegend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--faint)}
.arealegend span{display:inline-flex;align-items:center;gap:5px}
.arealegend i{width:8px;height:8px;border-radius:50%}
.wk{display:grid;gap:6px}
.wkday{display:grid;grid-template-columns:52px 1fr;gap:4px 10px;align-items:start;padding:10px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.wkday.today{border-color:var(--accent)}
.wkday.sel{box-shadow:inset 0 0 0 1.5px var(--ink)}
.wkh{display:grid;justify-items:start;text-align:left}
.wkh b{font-size:13px;font-weight:500}
.wkh span{font-size:22px;font-weight:300;line-height:1.1;font-variant-numeric:tabular-nums}
.blocks{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.blk{font-size:13px;font-weight:500;padding:6px 9px;border-radius:9px;background:var(--c);color:#111;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.blk.done{opacity:.45;text-decoration:line-through}
.wkday .hab{grid-column:2}

/* ── jump tiles, more ─────────────────────────────────────────────── */
.jump{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.jt2{display:grid;gap:2px;justify-items:start;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:left;min-width:0;min-height:76px}
.jt2 svg.i{color:var(--accent);margin-bottom:4px}
.jt2 b{font-weight:500;font-size:15px}
.jt2 span{font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
@media (min-width:600px){.jump{grid-template-columns:repeat(6,minmax(0,1fr))}}
select.input.sel{min-height:40px;padding:6px 10px;font-size:15px;width:auto;max-width:100%;flex:0 1 auto;appearance:auto}

/* ── tools ───────────────────────────────────────────────────────── */
.toolgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tool{display:grid;gap:4px;align-content:start;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:left;min-width:0}
.tool .tic{font-size:26px}
.tool b{font-weight:500;font-size:16px}
.tool small{font-size:12.5px;color:var(--faint);line-height:1.35}
.ranked{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.rrow{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:left;min-height:56px}
.rrow .pos{width:32px;flex:none;font-size:22px;font-weight:300;letter-spacing:-.03em;color:var(--faint);font-variant-numeric:tabular-nums;text-align:center}
.rrow.top .pos{color:var(--accent);font-weight:400}
.rrow .grow{display:grid;gap:2px;min-width:0}
.rrow .t{font-size:16px;overflow-wrap:anywhere}
.rrow .s{font-size:12.5px;color:var(--faint)}
.vsgrid{display:grid;gap:8px}
.vs{display:grid;gap:4px;padding:18px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line2);text-align:left;min-height:84px}
.vs:hover,.vs:focus-visible{border-color:var(--accent)}
.vs b{font-size:19px;font-weight:500;letter-spacing:-.01em}
.vs span{font-size:13px;color:var(--faint)}
.vs small{font-size:13px;color:var(--muted)}
.vsor{justify-self:center;font-size:13px;color:var(--faint)}
.flash{display:grid;gap:14px;padding:22px 18px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.flash .q{font-size:22px;font-weight:500;letter-spacing:-.015em;line-height:1.3}
.flash .a{font-size:18px;color:var(--accent);line-height:1.35}
.cardform,.liftform{display:grid;gap:8px}
.liftform{grid-template-columns:repeat(3,minmax(0,1fr))}
.liftform .btn{grid-column:1/-1}
.liftbars{display:flex;align-items:flex-end;gap:4px;height:70px;padding:8px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.liftbars i{flex:1;display:block;border-radius:4px 4px 0 0;background:var(--accent);opacity:.85}
.timer{display:grid;gap:18px;justify-items:center;padding:28px 16px;border-radius:22px;background:var(--surface);border:1px solid var(--line)}
.tclock{font-size:72px;font-weight:200;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.timer .btnrow{width:100%;max-width:340px}

/* ── task list: add box, swipe rows, rename in place ─────────────── */
.addtask{display:flex;gap:8px}
.addtask .input{flex:1;min-width:0;min-height:50px;font-size:16px}
.addtask .btn{flex:0 0 50px;min-height:50px;padding:0}
.tlist{display:grid}
.trow{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trin{position:relative;z-index:1;display:flex;align-items:center;gap:12px;min-height:62px;padding:8px 0;background:var(--bg);touch-action:pan-y;transition:transform .18s ease}
.trow.swiping .trin{transition:none}
.trin .grow{flex:1;min-width:0;display:grid;gap:3px}
.tt{font-size:16.5px;line-height:1.3;text-align:left;overflow-wrap:anywhere;padding:2px 0;cursor:text}
.trin .s{font-size:13px;color:var(--faint);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.trow.done .trin{opacity:.45}
.trow.done .tt{text-decoration:line-through}
.ttedit{min-height:40px;font-size:16.5px;padding:6px 10px}
.swbg{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:14px;font-weight:600;color:#fff;background:var(--sunk)}
.swbg span{opacity:.0;transition:opacity .12s}
.trow.goR .swbg{background:var(--accent)}.trow.goR .swbg .l{opacity:1;color:var(--accent-ink)}
.trow.goL .swbg{background:#5B9BF5}.trow.goL .swbg .r{opacity:1;color:#0F1220}
.trow.swiping .swbg span{opacity:.6}
@media (prefers-reduced-motion:reduce){.trin{transition:none}}

/* ── when picker + time ruler ──────────────────────────────────────── */
.whenbtn{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;text-align:left;min-height:44px;padding:6px 0}
.whenbtn b{font-weight:500}
.readout{display:grid;gap:4px}
.big2{font-size:52px;font-weight:300;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.big2 small{font-size:18px;font-weight:500;letter-spacing:0;margin-left:6px;color:var(--muted)}
.todaytag{color:var(--accent);font-weight:500}
.wlab{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:-6px}
.wlab .link{text-transform:none;letter-spacing:0;font-size:14px}
.wstrip{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.wday{display:grid;justify-items:center;gap:2px;padding:8px 0 6px;border-radius:12px;min-width:0}
.wday em{font-style:normal;font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.wday b{font-size:18px;font-weight:500;font-variant-numeric:tabular-nums}
.wday i{width:5px;height:5px;border-radius:50%;background:var(--accent);display:block}
.wday i.none{background:transparent}
.wday.on{background:var(--accent-tint);box-shadow:inset 0 0 0 1.5px var(--accent)}
.wday.on em{color:var(--accent)}
.wday.some b{font-size:13px}
.cal.mini .day{min-height:44px}
.cal.mini .day.past .n{color:var(--faint)}
.ruler{position:relative;height:74px;overflow:hidden;border-radius:14px;background:var(--surface);border:1px solid var(--line);touch-action:none;cursor:grab;
  -webkit-mask:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent);mask:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent)}
.ruler:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ruler.allday .rstrip{opacity:.35}
.rstrip{position:absolute;left:0;top:0;bottom:0;width:2880px;will-change:transform}
.rstrip i{position:absolute;top:14px;width:1.5px;height:14px;background:var(--line2);border-radius:1px;transform:translateX(-.75px)}
.rstrip i.q{height:22px;background:var(--faint)}
.rstrip i.hr{height:32px;background:var(--muted)}
.rstrip span{position:absolute;top:50px;transform:translateX(-50%);font-size:11px;color:var(--faint);white-space:nowrap}
.rline{position:absolute;left:50%;top:8px;bottom:26px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--accent)}
.remrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px;border-radius:12px;background:var(--surface);font-size:14px}
.sheet>*{min-width:0}
#whenbox{display:grid;gap:14px;min-width:0}
#whenbox .scrollx{margin:0 -16px;padding:0 16px}

/* ── reschedule sheet ─────────────────────────────────────────────── */
#rsbox{display:grid;gap:14px;min-width:0}
#rsbox .scrollx{margin:0 -16px;padding:0 16px}
.odbox{border:1px solid color-mix(in srgb,var(--bad) 45%,transparent);background:color-mix(in srgb,var(--bad) 7%,var(--surface));border-radius:16px;overflow:hidden}
.odhead{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:52px;padding:0 16px;color:var(--bad);font-weight:600}
.odlinks{display:flex;gap:10px;align-items:center;padding:0 16px 6px;border-top:1px solid var(--line)}
.odrow{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 16px;border-top:1px solid var(--line);cursor:pointer}
.odrow input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.odrow .grow{flex:1;min-width:0;font-weight:500}
.od{font-size:12.5px;color:var(--bad);font-weight:600;white-space:nowrap}
.sweep3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sweep3 .btn{padding:0 8px;min-height:50px}
.sweep3 .btn.on{box-shadow:inset 0 0 0 1.5px var(--accent)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 60%,transparent)}
.big2.sm{font-size:34px}
.big3{min-height:56px;font-size:17px}

/* ── goals (from the demo) ────────────────────────────────────────── */
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats3>div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;gap:4px;min-width:0}
.stats3 span{font-size:12px;color:var(--faint);line-height:1.2}
.stats3 b{font-size:26px;font-weight:300;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.goal2{display:grid;border-radius:18px;overflow:hidden;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%;min-width:0}
.gcov{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;
  background:linear-gradient(140deg,color-mix(in srgb,var(--c) 55%,var(--surface)),color-mix(in srgb,var(--c) 18%,var(--surface)))}
.gcov.big{height:96px;border-radius:18px}
.gcov .gi{font-size:28px}
.gcov .pill{background:rgba(0,0,0,.25);color:#fff}
.gb{display:grid;gap:6px;padding:14px 16px 16px}
.gb b{font-weight:500;font-size:17px;line-height:1.3}
.gw{font-size:14px;color:var(--muted);line-height:1.4}
.goal2 .gnext{margin-top:4px}
.titlein{font-size:21px;font-weight:500;letter-spacing:-.015em}
.nextcard{box-shadow:inset 3px 0 0 var(--c,var(--accent))}
.weeks{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:110px;padding:10px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.wk1{display:grid;grid-template-rows:1fr auto;justify-items:center;gap:4px;height:100%;position:relative}
.wk1 i{align-self:end;width:70%;max-width:28px;border-radius:6px 6px 2px 2px;background:var(--c,var(--accent));opacity:.85;display:block}
.wk1 span{font-size:10.5px;color:var(--faint);white-space:nowrap}
.wk1 b{position:absolute;top:0;font-size:11px;font-weight:500;color:var(--muted)}
.swatch{width:32px;height:32px;border-radius:50%;border:2px solid transparent}
.swatch.on{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--bg)}

/* ── today overview, heads up, habit amounts ─────────────────────── */
.overview{display:grid;gap:2px}
.ovcount{font-size:20px;font-weight:500;letter-spacing:-.015em}
.bad{color:var(--bad)}
h2.bad{color:var(--bad)}
.headsup{display:grid;gap:8px;padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:inset 3px 0 0 var(--warn)}
.hurow{display:flex;align-items:center;gap:10px;min-height:40px}
.hurow .grow{flex:1;min-width:0}
.hurow b{font-weight:500}
.pill.accent{background:var(--accent);color:var(--accent-ink);font-weight:600}
.ring{flex:none}
.hchip .amt2{font-size:12.5px;color:var(--muted)}
.hchip.on .amt2{color:#111}
.hchip.part{border-color:color-mix(in srgb,var(--c) 60%,transparent)}
.hweek .part i{background:color-mix(in srgb,var(--c) 40%,var(--sunk))}
.hgrid .part,.hspark .part{background:color-mix(in srgb,var(--c) 40%,var(--sunk))}
.hspark .part{height:55%}
.hcard .btnrow .hmark{flex:1}
.amtnow{display:flex;align-items:center;gap:14px}
.amtnow b{font-size:22px;font-weight:400}

/* ── money (Payday OS in a frame) ─────────────────────────────────── */
body.finmode{overflow:hidden}
body.finmode .main{min-height:0}
.finnav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px;-webkit-overflow-scrolling:touch}
.finnav::-webkit-scrollbar{display:none}
.finnav .chip{flex:none}
.finbar{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 6px 6px 12px;gap:8px;min-height:0}
p.finbar{padding:10px 12px;margin:0}
.finslot{min-height:40px}
.view:has(#finslot){gap:10px}
#fin{position:fixed;z-index:15;border:0;display:block;background:var(--bg);width:100%}
#fin[hidden]{display:none}
.cal .dots i.fin,.dot.fin{border-radius:2px}
